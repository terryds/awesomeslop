<script type="module">
import * as THREE from 'three';

// ---------- helpers ----------
const lerp = (a, b, t) => a + (b - a) * t;

// ---------- the land: an orchard sloping down to a lake, hills beyond ----------
// z grows to the south. The near shore wanders around z = -14; the far shore is ~150 m north.
const shoreZ = (x) => -15 + 3 * Math.sin(x * 0.07) + 2 * Math.sin(x * 0.023 + 1);

// the path: from the jetty's foot up through the orchard and away south, with a branch to the cottage
const pathPts = [], branchPts = [];
for (let z = -12; z <= 72; z += 1) pathPts.push([pathX(z), z]);
const COTTAGE = { x: -21, z: 9 };
for (let i = 0; i <= 30; i++) { const t = i / 30, x0 = pathX(12); branchPts.push([lerp(x0, COTTAGE.x + 2.7, t), lerp(12, COTTAGE.z, t) + Math.sin(t * Math.PI) * 3]); }

// ---------- geometry kit ----------
// Everything carries its flat colour in the vertices, and a "root": where on the ground its colour comes from.

const JETTY = { x0: 4.9, x1: 7.1, z0: -40, z1: -10.5, top: 0.62 };

const wet = (x, z) => !onJetty(x, z) && H(x, z) < 0.12;

// ---------- the near ground: one fine sheet, coloured by vertex ----------
const scene = new THREE.Scene();
const GROUND = 140;
function groundColour(x, z, h, ny, c) {

{
  const g = new THREE.PlaneGeometry(GROUND, GROUND, 280, 280).rotateX(-Math.PI / 2);

  const col = new Float32Array(p.count * 3), r = new Float32Array(p.count * 4), c = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    groundColour(p.getX(i), p.getZ(i), p.getY(i), g.attributes.normal.getY(i), c);
    col.set([c.r, c.g, c.b], i * 3); r.set([0, -50, 0, -1e-6], i * 4);

  g.setAttribute('root', new THREE.BufferAttribute(r, 4));
  var groundGeo = g;
}
// the far land: coarse, hidden under the near sheet in the middle. Its colour comes from the nearest place you
// could have walked; beyond the lake, from the end of the jetty.
const JETTY_END = [6, 0.6, -39];
{
  const g = new THREE.PlaneGeometry(1600, 1600, 160, 160).rotateX(-Math.PI / 2);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) { const x = p.getX(i), z = p.getZ(i); p.setY(i, Math.abs(x) < 69 && Math.abs(z) < 69 ? -6 : H(x, z)); }
  g.computeVertexNormals(); g.deleteAttribute('uv');
  const col = new Float32Array(p.count * 3), r = new Float32Array(p.count * 4), c = new THREE.Color();
  const fields = ['#c9d68a', '#a8c97e', '#e2d49a', '#b9d391', '#9cc07c', '#d8c98e'];
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i), y = p.getY(i);
    if (z < farShoreZ(x) + 4) c.set('#6f9a6e').lerp(tmpC.set('#8fae86'), fbm(x * 0.01, z * 0.01)).lerp(tmpC.set('#a6b4c4'), smooth(30, 90, y) * 0.6);
    else c.set(fields[Math.floor(hash2(Math.floor((x + fbm(x * 0.02, z * 0.02) * 40) / 60), Math.floor(z / 45)) * fields.length)]);

    if (z < -60) r.set([JETTY_END[0], JETTY_END[1], JETTY_END[2], 0.045], i * 4);
    else r.set([clamp(x, -52, 52), 0.5, clamp(z, -8, 54), 0.05], i * 4);

  g.setAttribute('root', new THREE.BufferAttribute(r, 4));

// ---------- the jetty and a rowing boat ----------
{

const boatParts = [];
rooted(8.6, 0, -27, 0.3, () => {

  push(new THREE.BoxGeometry(1.0, 0.12, L - 0.6), '#7f5f48', at(0, 0.05, 0));
  for (const s of [-1, 1]) {
    push(new THREE.BoxGeometry(0.08, 0.5, L - 0.4), '#3f8a86', M().makeRotationZ(s * 0.35).setPosition(s * 0.6, 0.3, 0));

});

{

  float pcTooth(vec3 at, float fine){
    return mix(.5, wcNoise(at * 19.), clamp(1. - fine * 14., 0., 1.)) * .6 + mix(.5, wcNoise(at * 47. + 5.), clamp(1. - fine * 35., 0., 1.)) * .4; }

  // strokes along the level lines of h (a height measured along one fixed direction in the world), covering
  // "cover" of the paper, spacing held near uPx pixels by blending octaves (as in 007, after blendi)
  float pcStrokes(float h, float g, float cover){

    float k = -log2(g * uPx), kf = floor(k), t = k - kf, sc = exp2(kf), P = 1. / (g * sc), x = h * sc;

const SURF = /* glsl */`
  uniform sampler2D uMap; uniform vec4 uRect; uniform float uNow; uniform vec4 uFinale; uniform vec4 uJetty;

  varying vec4 vRoot; varying vec3 vAt;
  // the wash map, read by hand between four cells: how covered, and (over the covered cells) when
  vec2 wcMap(vec2 xz){
    float N = uRect.w;

    vec4 w = vec4((1. - f.x) * (1. - f.y), f.x * (1. - f.y), (1. - f.x) * f.y, f.x * f.y);

  vec2 wcAge(vec3 at, vec4 root){

    float n = (wcNoise(at * .42) - .5) * .5 + (wcNoise(at * 1.5 + 3.) - .5) * .3 + (wcNoise(at * 5.5 + 7.) - .5) * .1;

    left *= 1. - graphite * .2; // the pencil shows through
    // far things are paler and cooler, as if lifted with a damp brush

    return mix(sketch, left, P);
  }
`;

const clock = new THREE.Clock();
let slow = 0, frames = 0, lastZone = '', lastStamp = -1, walkTime = 0, skyT = 1e4, finaleT = 0;
const lastAt = new THREE.Vector2(1e9, 1e9);
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  walk(dt);
  if (mode === 'walk') { blend = Math.min(1, blend + dt * 0.8); walkTime += dt; }
  introCam(t, camPos, camLook);
  if (blend > 0) {
    followCam(tmp, camera.position);
    const b = smooth(0, 1, blend);
    camPos.lerp(tmp, b); camLook.lerp(camera.position, b);
  }
  camera.position.copy(camPos); camera.lookAt(camLook); camera.updateMatrixWorld();

  // paint: around the walker as they go; before that, a little around where the drifting camera looks
  if (t - lastStamp > 0.12) {
    if (mode === 'walk' || q.get('walk') === '1') {
      if (Math.hypot(P.x - lastAt.x, P.z - lastAt.y) > 0.25 || t - lastStamp > 1) { stamp(P.x, P.z, P.speed > 4.5 ? 4.2 : 3.6, t); lastAt.set(P.x, P.z); lastStamp = t; }
    } else if (t > 0.4) { stamp(focus.x, focus.z, 3.8, t, 0.6); lastStamp = t; }
    if (mapDirty) { mapTex.needsUpdate = true; mapDirty = false; }
  }
  // the sky is washed in once you reach the end of the jetty or have painted a fair patch; then, the last wash
  if (skyT > 1e3 && (coveredAt(...[JETTY_END[0], JETTY_END[2]]) > 0.5 || painted > WALKABLE * 0.3 || finaleT)) skyT = t + 0.5;
  if (!finaleT && mode === 'walk' && (walkTime > 120 || painted > WALKABLE * 0.7)) {
    finaleT = t; U.uFinale.value.set(P.x, P.z, t, 9);
    where.style.opacity = 0; setTimeout(() => { where.textContent = 'hollin water, all of it'; where.style.opacity = 1; }, 800);
  }
  U.uNow.value = t;
  paper.uniforms.uSkyT.value = skyT;
  paper.uniforms.uTime.value = t;
  boat.position.y = Math.sin(t * 1.1) * 0.04 - 0.02; boat.rotation.z = Math.sin(t * 0.8) * 0.03;

  const zn = zone();
  if (zn !== lastZone && mode === 'walk' && !finaleT) { lastZone = zn; where.style.opacity = 0; setTimeout(() => { where.textContent = zn; where.style.opacity = 1; }, 800); }

  renderer.shadowMap.needsUpdate = true;
  renderer.setRenderTarget(rt); renderer.setClearColor(0xffffff, 0); renderer.clear(); renderer.render(scene, camera);
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);

  // drop resolution a step if this machine cannot hold a smooth frame
  slow = lerp(slow, dt, 0.05);
  if (++frames % 90 === 0 && slow > 0.024 && pixelRatio > 0.6) { pixelRatio *= 0.85; renderer.setPixelRatio(pixelRatio); resize(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
