<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>noodles at 3 a.m.</title>
<style>
  html,body{margin:0;height:100%;background:#07060f;overflow:hidden}
  canvas{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;cursor:pointer}
  #hint{position:fixed;left:14px;bottom:12px;color:#fff;font:11px ui-monospace,Menlo,Consolas,monospace;opacity:0;transition:opacity 1s;text-shadow:0 1px 5px rgba(0,0,0,.8);pointer-events:none}
  @media (max-width:520px),(max-height:300px){#hint{display:none}}
</style>
<canvas id="c" width="1920" height="1200"></canvas>
<div id="hint">click to paint it again</div>
<script>
// A night street painted the way a painter works: block in big shapes, then smaller marks, then the details.
// 1. Draw a plain flat picture of the scene off-screen (never shown): walls, signs, their glow, their reflections.
// 2. Cover the canvas in brush marks, each taking its colour from that picture and its direction from what it paints.
// 3. Paint the small things on top by hand: sign lettering, cables, the umbrella's rim light, steam, rain.
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const W = 1920, H = 1200;
const VP = { x: W * 0.5, y: H * 0.58 }; // the street runs straight away from us to this point
const DURATION = 10000; // ms to paint the whole picture

const PALETTES = [
  { // magenta and cyan
    paper: '#120e22', skyTop: '#07061a', skyLow: '#3b1a5e', haze: '#d9367f', wallA: '#131129', wallB: '#241a47', ground: '#0b0a1c', groundFar: '#2c1d50',
    signs: ['#ff2e88', '#19e3ff', '#ffd23f', '#ff5a36', '#b56bff', '#49ffa8'], windows: ['#ffd98a', '#8fe8ff', '#ff9ac6'],
    warm: '#ffb24d', lantern: '#ff4a2e', ink: '#07060f', rimA: '#ff4fa3', rimB: '#3fe6ff', rain: '#bcd6ff',
  },
  { // amber and teal
    paper: '#0e1420', skyTop: '#040a14', skyLow: '#0f3a4a', haze: '#ff8a3a', wallA: '#0d1522', wallB: '#16283a', ground: '#070c16', groundFar: '#173444',
    signs: ['#ff9a1f', '#22f0d0', '#ffe14a', '#ff4d5e', '#5aa8ff', '#c8ff5a'], windows: ['#ffcf7a', '#9ff5e6', '#ffb07a'],
    warm: '#ffc46a', lantern: '#ff5a36', ink: '#04070c', rimA: '#ff9a3a', rimB: '#3ff0d8', rain: '#bfe6ee',
  },
];

// ---------- seeded randomness and noise ----------
let rnd, noiseSeed = 0;
const mulberry = (a) => () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const lerp = (a, b, t) => a + (b - a) * t;
const hash2 = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7 + noiseSeed) * 43758.5453; return s - Math.floor(s); };
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return lerp(lerp(hash2(xi, yi), hash2(xi + 1, yi), u), lerp(hash2(xi, yi + 1), hash2(xi + 1, yi + 1), u), v);
}
const fbm = (x, y) => vnoise(x, y) * 0.5 + vnoise(x * 2.03, y * 2.03) * 0.25 + vnoise(x * 4.1, y * 4.1) * 0.125 + vnoise(x * 8.3, y * 8.3) * 0.0625;
const rgb = (hex) => [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
const mix = (a, b, t) => { const x = rgb(a), y = rgb(b); return `rgb(${lerp(x[0], y[0], t) | 0},${lerp(x[1], y[1], t) | 0},${lerp(x[2], y[2], t) | 0})`; };
const pick = (a) => a[(rnd() * a.length) | 0];

// ---------- the street in perspective ----------
// t runs from 0 (nearest, off-screen) to 1 (the vanishing point). side is -1 left, +1 right.
const wallX = (side, t) => lerp(side < 0 ? -W * 0.22 : W * 1.22, VP.x, t);
const baseY = (t) => lerp(H, VP.y, t); // where things at depth t touch the road
const topY = (t, h) => VP.y - (1 - t) * h * H; // roof line of a building h units tall
const near = (t) => 1 - t; // how big things are drawn at depth t

// ---------- one brush mark: a few bristle lines side by side ----------
function mark(x, y, len, wid, ang, col, alpha = 0.9) {
  const cs = Math.cos(ang), sn = Math.sin(ang), n = Math.max(1, Math.round(wid / 2.4));
  for (let i = 0; i < n; i++) {
    const off = (i - (n - 1) / 2) * (wid / n) + (rnd() - 0.5) * 1.4, l = len * (0.7 + rnd() * 0.5), shift = (rnd() - 0.5) * len * 0.25;
    const j = 1 + (rnd() - 0.5) * 0.2, bend = (rnd() - 0.5) * len * 0.12;
    const x0 = x - (cs * l) / 2 - sn * off + cs * shift, y0 = y - (sn * l) / 2 + cs * off + sn * shift;
    ctx.strokeStyle = `rgba(${Math.min(255, col[0] * j) | 0},${Math.min(255, col[1] * j) | 0},${Math.min(255, col[2] * j) | 0},${alpha * (0.55 + rnd() * 0.45)})`;
    ctx.lineWidth = (wid / n) * (0.8 + rnd() * 0.9);
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.quadraticCurveTo(x0 + (cs * l) / 2 - sn * bend, y0 + (sn * l) / 2 + cs * bend, x0 + cs * l, y0 + sn * l);
    ctx.stroke();
  }
}
function paintLine(x0, y0, x1, y1, wid, col, alpha = 0.9, sag = 0) {
  const d = Math.hypot(x1 - x0, y1 - y0), steps = Math.max(2, Math.round(d / 9));
  let px = x0, py = y0;
  for (let i = 1; i <= steps; i++) {
    const t = i / steps, x = lerp(x0, x1, t), y = lerp(y0, y1, t) + Math.sin(t * Math.PI) * sag;
    mark((px + x) / 2, (py + y) / 2, Math.hypot(x - px, y - py) * 1.25, wid, Math.atan2(y - py, x - px), col, alpha);
    px = x; py = y;
  }
}

// ---------- the scene ----------
let P, ref, mask, details, strokes, cursor, startedAt, finished, signs, litWindows, figure, stall;
const ID = { ground: '#280000', wall: '#500000', sign: '#a00000', figure: '#f00000' }; // what each pixel is, for brush direction

function buildScene() {
  const rc = document.createElement('canvas'), mc = document.createElement('canvas');
  rc.width = mc.width = W; rc.height = mc.height = H;
  const g = rc.getContext('2d', { willReadFrequently: true }), m = mc.getContext('2d', { willReadFrequently: true });
  const quad = (c, color, pts) => { c.fillStyle = color; c.beginPath(); pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); c.fill(); };
  const both = (color, id, pts) => { quad(g, color, pts); quad(m, id, pts); };
  const glow = (x, y, r, color, a) => { // light spilling into the wet air
    const gr = g.createRadialGradient(x, y, 0, x, y, r), [cr, cg, cb] = rgb(color);
    gr.addColorStop(0, `rgba(${cr},${cg},${cb},${a})`); gr.addColorStop(0.4, `rgba(${cr},${cg},${cb},${a * 0.35})`); gr.addColorStop(1, `rgba(${cr},${cg},${cb},0)`);
    g.save(); g.globalCompositeOperation = 'lighter'; g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); g.restore();
  };

  // sky in the gap between the buildings, two searchlights, and far towers lost in the haze
  const sky = g.createLinearGradient(0, 0, 0, VP.y);
  sky.addColorStop(0, P.skyTop); sky.addColorStop(0.75, P.skyLow); sky.addColorStop(1, mix(P.skyLow, P.haze, 0.55));
  g.fillStyle = sky; g.fillRect(0, 0, W, VP.y + 4);
  g.save(); g.globalCompositeOperation = 'lighter';
  for (const [x, lean] of [[VP.x - 120, -0.22], [VP.x + 90, 0.3]]) quad(g, 'rgba(160,200,255,0.07)', [[x - 6, VP.y - 40], [x + 6, VP.y - 40], [x + lean * 900 + 70, -40], [x + lean * 900 - 70, -40]]);
  g.restore();
  for (let i = 0; i < 22; i++) {
    const x = VP.x + (rnd() - 0.5) * W * 0.3, w = 14 + rnd() * 40, h = 110 + rnd() * rnd() * 520;
    quad(g, mix(P.wallA, P.haze, 0.08 + rnd() * 0.14), [[x, VP.y - h], [x + w, VP.y - h], [x + w, VP.y + 2], [x, VP.y + 2]]);
    for (let k = 0; k < h / 6; k++) if (rnd() < 0.6) { g.fillStyle = pick(P.windows) + '99'; g.fillRect(x + 3 + rnd() * (w - 8), VP.y - h + 6 + rnd() * (h - 12), 3, 3); }
  }
  glow(VP.x, VP.y - 20, 430, P.haze, 0.42);

  // the two walls of the canyon: a row of buildings on each side, drawn far to near, each with rows of windows
  litWindows = [];
  const cuts = [0, 0.22, 0.38, 0.52, 0.63, 0.73, 0.81, 0.87, 0.92, 0.955, 0.98];
  for (const side of [-1, 1]) for (let i = cuts.length - 2; i >= 0; i--) {
    const t0 = cuts[i], t1 = cuts[i + 1], h = lerp(1.5, 0.7, i / (cuts.length - 2)) + rnd() * 0.3;
    const color = mix(mix(P.wallA, P.wallB, rnd()), P.haze, t0 * t0 * 0.3);
    both(color, ID.wall, [[wallX(side, t0), topY(t0, h)], [wallX(side, t1), topY(t1, h)], [wallX(side, t1), baseY(t1)], [wallX(side, t0), baseY(t0)]]);
    quad(g, 'rgba(0,0,0,0.28)', [[wallX(side, t1) - 2, topY(t1, h)], [wallX(side, t1) + 2, topY(t1, h)], [wallX(side, t1) + 2, baseY(t1)], [wallX(side, t1) - 2, baseY(t1)]]);
    // windows sit at equal steps of real distance z, so they bunch up toward the vanishing point
    const z0 = t0 / (1 - t0), z1 = t1 / (1 - t1), dz = Math.max(0.1, (z1 - z0) / 12), tOf = (z) => z / (1 + z);
    for (let z = z0 + dz * 0.3; z < z1 - dz * 0.5; z += dz) for (let v = 0.13; v < 0.97; v += 0.058 / h) {
      if (rnd() > 0.24) continue;
      const ta = tOf(z), tb = tOf(z + dz * 0.55), at = (t, vv) => [wallX(side, t), lerp(baseY(t), topY(t, h), vv)];
      const pts = [at(ta, v + 0.03 / h), at(tb, v + 0.03 / h), at(tb, v), at(ta, v)];
      if (pts[0][1] > H || pts[3][1] < 0 || Math.abs(pts[1][0] - pts[0][0]) < 1.5) continue;
      const c = pick(P.windows);
      quad(g, c + (rnd() < 0.5 ? 'cc' : '77'), pts);
      litWindows.push([(pts[0][0] + pts[1][0]) / 2, (pts[0][1] + pts[3][1]) / 2, Math.abs(pts[1][0] - pts[0][0]), c]);
    }
  }

  // the road: dark, lighter and hazier far away
  const roadPath = [[wallX(-1, 0), H], [VP.x, VP.y], [wallX(1, 0), H]];
  const road = g.createLinearGradient(0, VP.y, 0, H);
  road.addColorStop(0, mix(P.groundFar, P.haze, 0.35)); road.addColorStop(0.25, P.groundFar); road.addColorStop(1, P.ground);
  both(road, ID.ground, roadPath);
  const onRoad = (draw) => { g.save(); g.beginPath(); roadPath.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.clip(); g.globalCompositeOperation = 'lighter'; draw(); g.restore(); };
  onRoad(() => { const gr = g.createRadialGradient(VP.x, VP.y + 60, 0, VP.x, VP.y + 60, 520), [cr, cg, cb] = rgb(P.haze); gr.addColorStop(0, `rgba(${cr},${cg},${cb},0.4)`); gr.addColorStop(1, `rgba(${cr},${cg},${cb},0)`); g.fillStyle = gr; g.fillRect(VP.x - 520, VP.y, 1040, 580); }); // the haze at the end of the street, mirrored down the middle of the road
  // a lit thing above the road shows again below the spot where it would touch the road, upside down and stretched
  const reflect = (x, w, top, bottom, t, color, a) => onRoad(() => {
    const yg = baseY(t), y0 = yg + 8 + (yg - bottom) * 0.22, y1 = y0 + (bottom - top) * 1.7 + 140, [cr, cg, cb] = rgb(color), gr = g.createLinearGradient(0, y0, 0, y1);
    gr.addColorStop(0, `rgba(${cr},${cg},${cb},${a})`); gr.addColorStop(1, `rgba(${cr},${cg},${cb},0)`);
    g.fillStyle = gr; g.fillRect(x - w * 0.1, y0, w * 1.2, y1 - y0);
  });

  // neon signs hanging out over the street, facing us; far ones first so near ones overlap them
  signs = [];
  for (const side of [-1, 1]) for (let i = 0; i < 10; i++) {
    const t = 0.3 + rnd() * 0.58, tall = rnd() < 0.7, s = near(t) * 2.1;
    const w = (tall ? 0.03 + rnd() * 0.03 : 0.07 + rnd() * 0.07) * W * s, h = (tall ? 0.13 + rnd() * 0.2 : 0.045 + rnd() * 0.04) * H * s;
    const x = side < 0 ? wallX(side, t) : wallX(side, t) - w, y = baseY(t) - (0.2 + rnd() * 0.55) * H * s - h;
    signs.push({ t, x, y, w, h, tall, color: pick(P.signs) });
  }
  signs.sort((a, b) => b.t - a.t);
  for (const s of signs) {
    both(P.ink, ID.sign, [[s.x - 4, s.y - 4], [s.x + s.w + 4, s.y - 4], [s.x + s.w + 4, s.y + s.h + 4], [s.x - 4, s.y + s.h + 4]]);
    quad(g, s.color, [[s.x, s.y], [s.x + s.w, s.y], [s.x + s.w, s.y + s.h], [s.x, s.y + s.h]]);
    quad(g, mix(s.color, '#ffffff', 0.3), [[s.x + s.w * 0.3, s.y + s.h * 0.08], [s.x + s.w * 0.7, s.y + s.h * 0.08], [s.x + s.w * 0.7, s.y + s.h * 0.92], [s.x + s.w * 0.3, s.y + s.h * 0.92]]);
    glow(s.x + s.w / 2, s.y + s.h / 2, Math.max(s.w, s.h) * 1.25 + 30, s.color, 0.3);
    reflect(s.x, s.w, s.y, s.y + s.h, s.t, s.color, 0.75);
  }

  // the noodle stand: awning, a warm lit box, a counter, two customers, three lanterns
  {
    const t = 0.24, k = near(t), x = W * 0.07, yg = baseY(t), w = 440 * k, h = 340 * k;
    stall = { x, yg, w, h, k };
    both(P.ink, ID.sign, [[x, yg - h], [x + w, yg - h], [x + w, yg], [x, yg]]);
    quad(g, P.warm, [[x + 10 * k, yg - h * 0.78], [x + w - 10 * k, yg - h * 0.78], [x + w - 10 * k, yg - h * 0.34], [x + 10 * k, yg - h * 0.34]]);
    quad(g, mix(P.warm, '#ffffff', 0.5), [[x + w * 0.12, yg - h * 0.74], [x + w * 0.88, yg - h * 0.74], [x + w * 0.88, yg - h * 0.56], [x + w * 0.12, yg - h * 0.56]]);
    for (let i = 0; i < 6; i++) both(i % 2 ? '#f2e6d8' : P.lantern, ID.sign, [[x - 14 * k + (i * (w + 50 * k)) / 6, yg - h * 1.02], [x - 14 * k + ((i + 1) * (w + 50 * k)) / 6, yg - h * 1.02], [x + 4 * k + ((i + 1) * (w + 40 * k)) / 6, yg - h * 0.8], [x + 4 * k + (i * (w + 40 * k)) / 6, yg - h * 0.8]]);
    for (const cx of [0.36, 0.66]) { // customers on stools, backs to us
      const px = x + w * cx;
      both(P.ink, ID.figure, [[px - 26 * k, yg - h * 0.5], [px + 26 * k, yg - h * 0.5], [px + 22 * k, yg - 8 * k], [px - 22 * k, yg - 8 * k]]);
      g.fillStyle = P.ink; g.beginPath(); g.arc(px, yg - h * 0.58, 17 * k, 0, 6.2832); g.fill();
    }
    for (const lx of [0.14, 0.5, 0.86]) { g.fillStyle = P.lantern; g.beginPath(); g.ellipse(x + w * lx, yg - h * 0.74, 13 * k, 17 * k, 0, 0, 6.2832); g.fill(); glow(x + w * lx, yg - h * 0.74, 70 * k, P.lantern, 0.5); }
    glow(x + w / 2, yg - h * 0.5, 420 * k, P.warm, 0.5);
    reflect(x + 10 * k, w - 20 * k, yg - h * 0.78, yg - h * 0.34, t, P.warm, 0.5);
  }

  // someone walking away under a clear umbrella
  {
    const t = 0.4, k = near(t), x = W * 0.585, yg = baseY(t), h = 560 * k;
    figure = { x, yg, h, k };
    both(P.ink, ID.figure, [[x - h * 0.13, yg - h * 0.74], [x + h * 0.13, yg - h * 0.74], [x + h * 0.17, yg - h * 0.2], [x + h * 0.08, yg], [x - h * 0.08, yg], [x - h * 0.17, yg - h * 0.2]]);
    g.fillStyle = P.ink; g.beginPath(); g.arc(x, yg - h * 0.82, h * 0.075, 0, 6.2832); g.fill();
    for (const c of [g, m]) { c.fillStyle = c === g ? 'rgba(150,215,255,0.42)' : ID.figure; c.beginPath(); c.ellipse(x, yg - h * 0.9, h * 0.27, h * 0.17, 0, Math.PI, 0); c.fill(); }
    onRoad(() => { g.globalCompositeOperation = 'source-over'; quad(g, 'rgba(4,4,12,0.55)', [[x - h * 0.13, yg], [x + h * 0.13, yg], [x + h * 0.1, yg + h * 0.8], [x - h * 0.1, yg + h * 0.8]]); });
  }

  // dark corners pull the eye to the middle
  const vg = g.createRadialGradient(VP.x, VP.y, H * 0.35, VP.x, VP.y, H * 1.05);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,8,0.6)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);

  ref = g.getImageData(0, 0, W, H).data;
  mask = m.getImageData(0, 0, W, H).data;
}
const at = (x, y) => ((Math.min(H - 1, Math.max(0, y)) | 0) * W + (Math.min(W - 1, Math.max(0, x)) | 0)) * 4;
const colourAt = (x, y) => { const i = at(x, y); return [ref[i], ref[i + 1], ref[i + 2]]; };

// Which way the brush moves depends on what it is painting.
function directionAt(x, y, pass) {
  const id = mask[at(x, y)];
  if (id > 200) return Math.PI / 2 + (rnd() - 0.5) * 0.3; // people: up and down
  if (id > 120) return (rnd() < 0.5 ? 0 : Math.PI / 2) + (rnd() - 0.5) * 0.12; // signs and the stand: square
  if (id > 60) return rnd() < 0.62 ? Math.PI / 2 + (rnd() - 0.5) * 0.16 : Math.atan2(y - VP.y, x - VP.x); // walls: rain-streaked, some marks running down the street
  if (id > 20) return pass < 2 ? Math.PI / 2 + (rnd() - 0.5) * 0.22 : (rnd() - 0.5) * 0.2; // wet road: long vertical reflections, then short ripples across them
  return -0.62 + (fbm(x * 0.0035, y * 0.0035) - 0.47) * 1.1; // sky: one slanted hatch, loosened by noise
}

function planStrokes() {
  strokes = [];
  const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = (rnd() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const diff = (a, b) => Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]) + Math.abs(a[2] - b[2]);
  [[24, 70, 30], [12, 38, 13], [6.5, 17, 5.5]].forEach(([gap, len, wid], pass) => {
    const batch = [];
    for (let y = -gap; y < H + gap; y += gap) for (let x = -gap; x < W + gap; x += gap) {
      const px = x + (rnd() - 0.5) * gap * 1.6, py = y + (rnd() - 0.5) * gap * 1.6;
      // the finest marks go only where something changes: edges of light
      if (pass === 2 && rnd() > 0.16 && diff(colourAt(px - 5, py), colourAt(px + 5, py)) + diff(colourAt(px, py - 5), colourAt(px, py + 5)) < 40) continue;
      batch.push([px, py, len, wid, pass]);
    }
    strokes.push(...shuffle(batch));
  });
  const fine = []; // one more pass of very small marks on signs, the stand and people, so they stay crisp
  for (let y = 0; y < H; y += 3.6) for (let x = 0; x < W; x += 3.6) if (mask[at(x, y)] > 120) fine.push([x + (rnd() - 0.5) * 3, y + (rnd() - 0.5) * 3, 9, 3.2, 3]);
  strokes.push(...shuffle(fine));
}
function paintStroke([x, y, len, wid, pass]) {
  let col = rnd() < 0.05 ? colourAt(x + (rnd() - 0.5) * 60, y + (rnd() - 0.5) * 60) : colourAt(x, y);
  const j = 0.9 + rnd() * 0.22;
  col = [col[0] * j + 3, col[1] * j + 3, col[2] * j + 5];
  mark(x, y, pass < 2 && mask[at(x, y)] === 40 ? len * 1.5 : len, wid, directionAt(x, y, pass), col, pass === 0 ? 0.95 : 0.88);
}

// The small things, each a short list of marks painted last.
function planDetails() {
  details = [];
  const ink = rgb(P.ink), white = [255, 250, 240], rimA = rgb(P.rimA), rimB = rgb(P.rimB), rain = rgb(P.rain), steam = rgb(P.warm).map((v) => (v + 255) / 2);
  // lit windows get one crisp dab each, so they do not dissolve into the wall
  for (const [x, y, w, c] of litWindows) if (w < 10 && rnd() < 0.7) details.push(() => mark(x, y, Math.max(3, w), Math.max(2, w * 0.55), 0, rgb(c), 0.85));
  // sign lettering: made-up glyphs built from a few bars, stacked down a tall sign or along a wide one
  for (const s of signs) {
    const n = Math.max(2, Math.round((s.tall ? s.h / s.w : s.w / s.h) * 0.9)), cell = (s.tall ? s.h : s.w) / n, size = Math.min(s.w, s.h) * 0.62, col = rnd() < 0.5 ? white : ink;
    for (let i = 0; i < n; i++) {
      const cx = s.tall ? s.x + s.w / 2 : s.x + cell * (i + 0.5), cy = s.tall ? s.y + cell * (i + 0.5) : s.y + s.h / 2, bars = [];
      for (let k = 0; k < 3 + ((rnd() * 3) | 0); k++) bars.push([(rnd() - 0.5) * size * 0.7, (rnd() - 0.5) * size * 0.7, rnd() < 0.5, size * (0.4 + rnd() * 0.5)]);
      details.push(() => { for (const [ox, oy, flat, l] of bars) mark(cx + ox, cy + oy, l, Math.max(1.4, size * 0.13), flat ? 0 : Math.PI / 2, col, 0.95); });
    }
    // the hot edge of the tube, and a few bright dashes of it in the road below
    details.push(() => { paintLine(s.x, s.y, s.x + s.w, s.y, 2.2, white, 0.7); paintLine(s.x, s.y + s.h, s.x + s.w, s.y + s.h, 2.2, white, 0.5); });
    const yg = baseY(s.t);
    for (let k = 0; k < 7; k++) { const y = yg + 14 + rnd() * rnd() * (H - yg), x = s.x + rnd() * s.w; if (y < H && Math.abs(x - VP.x) < (y - VP.y) * 2.6) details.push(() => mark(x, y, 14 + rnd() * 40, 2.4, (rnd() - 0.5) * 0.12, rgb(s.color), 0.8)); }
  }
  // cables slung across the street
  for (let i = 0; i < 6; i++) {
    const t = 0.3 + rnd() * 0.55, k = near(t), y = baseY(t) - (0.55 + rnd() * 0.75) * H * k, drop = (rnd() - 0.5) * 90 * k;
    details.push(() => paintLine(wallX(-1, t), y, wallX(1, t), y + drop, Math.max(1, 4 * k), ink, 0.75, 90 * k * (0.5 + rnd())));
  }
  // two fliers high up, each trailing its lights
  for (const [fx, fy, dir] of [[VP.x - 150 - rnd() * 80, H * 0.2 + rnd() * 60, 1], [VP.x + 90 + rnd() * 90, H * 0.33 + rnd() * 50, -1]]) details.push(() => {
    paintLine(fx - dir * 150, fy + 22, fx, fy, 2.2, rimA, 0.45); paintLine(fx - dir * 110, fy + 20, fx, fy + 4, 1.6, white, 0.35);
    mark(fx, fy, 30, 7, -0.1 * dir, ink, 1); mark(fx + dir * 12, fy + 1, 4, 3, 0, [255, 70, 70], 1); mark(fx - dir * 12, fy, 4, 3, 0, white, 1);
  });
  // steam from the stand, lit warm from below
  for (let i = 0; i < 26; i++) { const x = stall.x + stall.w * (0.25 + rnd() * 0.5) + i * 2, y = stall.yg - stall.h * (0.82 + i * 0.03); details.push(() => mark(x + Math.sin(i * 0.8) * 16, y, 20 + i, 6 + i * 0.4, -1.2 + Math.sin(i * 0.6) * 0.7, steam, 0.32 - i * 0.009)); }
  // the walker: one edge lit by each colour of the street, a shine on the umbrella, and a broken reflection
  {
    const { x, yg, h } = figure;
    details.push(() => {
      paintLine(x - h * 0.15, yg - h * 0.7, x - h * 0.16, yg - h * 0.18, 2.6, rimB, 0.9); paintLine(x + h * 0.15, yg - h * 0.7, x + h * 0.16, yg - h * 0.18, 2.6, rimA, 0.9);
      ctx.strokeStyle = `rgba(${rimB},0.85)`; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.ellipse(x, yg - h * 0.9, h * 0.27, h * 0.17, 0, Math.PI, 0); ctx.stroke();
      for (const a of [-0.9, -0.35, 0.35, 0.9]) paintLine(x, yg - h * 1.07, x + Math.sin(a) * h * 0.27, yg - h * 0.9, 1.2, white, 0.35);
      paintLine(x - h * 0.26, yg - h * 0.9, x + h * 0.26, yg - h * 0.9, 1.6, white, 0.5);
      paintLine(x, yg - h * 0.9, x, yg - h * 0.6, 1.8, ink, 0.9);
      for (let i = 0; i < 12; i++) mark(x + (rnd() - 0.5) * h * 0.2, yg + 8 + i * h * 0.06, h * 0.16, 2.6, (rnd() - 0.5) * 0.1, i % 3 ? ink : rimA, 0.75);
    });
  }
  // rain: thin slanted marks everywhere, and rings where drops land on the road
  for (let i = 0; i < 1250; i++) { const x = rnd() * W, y = rnd() * H, l = 22 + rnd() * 58; details.push(() => mark(x, y, l, 1.3, 1.34, rain, 0.14 + rnd() * 0.26)); }
  for (let i = 0; i < 170; i++) { const y = VP.y + 30 + rnd() * (H - VP.y - 30), x = VP.x + (rnd() - 0.5) * 2 * (y - VP.y) * 2.6, k = (y - VP.y) / (H - VP.y); details.push(() => { ctx.strokeStyle = `rgba(${rain},${0.2 + rnd() * 0.3})`; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.ellipse(x, y, 4 + k * 16, 1 + k * 4, 0, 0, 6.2832); ctx.stroke(); }); }
}

// paper tooth over the finished picture
function grain() {
  const t = document.createElement('canvas'); t.width = t.height = 256;
  const g = t.getContext('2d'), d = g.createImageData(256, 256);
  for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 30; }
  g.putImageData(d, 0, 0);
  ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.fillStyle = ctx.createPattern(t, 'repeat'); ctx.fillRect(0, 0, W, H); ctx.restore();
}

// ---------- paint it ----------
const hint = document.getElementById('hint');
const isThumb = new URLSearchParams(location.search).has('thumb');
let paintings = 0;
function begin(seed) {
  rnd = mulberry(seed); noiseSeed = seed % 1000;
  P = PALETTES[paintings++ % PALETTES.length];
  buildScene(); planStrokes(); planDetails();
  ctx.lineCap = 'round';
  ctx.fillStyle = P.paper; ctx.fillRect(0, 0, W, H);
  cursor = 0; finished = false; startedAt = performance.now();
  hint.style.opacity = 0;
}
function tick(now) {
  if (!finished) {
    const total = strokes.length + details.length, target = Math.floor(total * Math.min(1, (now - startedAt) / DURATION)), stopAt = performance.now() + 12;
    while (cursor < target && performance.now() < stopAt) { cursor < strokes.length ? paintStroke(strokes[cursor]) : details[cursor - strokes.length](); cursor++; }
    if (cursor >= total) { grain(); finished = true; if (!isThumb) hint.style.opacity = 0.7; }
  }
  requestAnimationFrame(tick);
}
canvas.addEventListener('click', () => begin((Math.random() * 1e9) | 0));
begin(20261113);
requestAnimationFrame(tick);
</script>
