<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>sleep tight</title>
<style>
  html,body{margin:0;height:100%;background:#050505;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;cursor:pointer}
  #hint{position:fixed;left:0;right:0;bottom:14px;text-align:center;font:12px/1.4 ui-monospace,Menlo,monospace;
    color:#cfd3c8;letter-spacing:.08em;pointer-events:none;opacity:.85;transition:opacity .6s}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">click for sound</div>
<script>
'use strict';
/* sleep tight: a 60-second '90s Indonesian TV ad for a made-up mosquito coil.
   Every frame is drawn in code on a 640x480 canvas, then pushed through a fake VHS + CRT. */
const W=640,H=480,DUR=60,TAU=Math.PI*2;
const qs=new URLSearchParams(location.search),THUMB=qs.has('thumb');
const cv=document.getElementById('c'),X=cv.getContext('2d'),hint=document.getElementById('hint');
if(THUMB)hint.style.display='none';
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const S=mk(W,H),g=S.getContext('2d');           // the scene
const V=mk(W,H),vx=V.getContext('2d');           // after the tape
const RC=mk(W,H),rx=RC.getContext('2d'),CC=mk(W,H),cx2=CC.getContext('2d'); // red / cyan copies

/* ---------- small maths ---------- */
const cl=(x,a=0,b=1)=>x<a?a:x>b?b:x,lerp=(a,b,t)=>a+(b-a)*t;
const ss=(a,b,x)=>{x=cl((x-a)/(b-a));return x*x*(3-2*x)};
const eo=x=>1-Math.pow(1-cl(x),3);
const eb=x=>{x=cl(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
let T=0,BF=0,jn=0;
const j=(a=1)=>(hash(BF*17.13+(jn++)*3.7)-.5)*2*a;   // line boil, re-rolled 8 times a second

/* ---------- drawing kit ---------- */
const INK='#1b1524';
function fs(fill,lw=3,stroke=INK){
  if(fill){g.fillStyle=fill;g.fill()}
  if(lw){g.lineWidth=lw;g.strokeStyle=stroke;g.lineJoin=g.lineCap='round';g.stroke()}
}
function poly(p,fill,lw=3,stroke=INK,jit=.8){
  g.beginPath();
  for(let i=0;i<p.length;i+=2){const x=p[i]+j(jit),y=p[i+1]+j(jit);i?g.lineTo(x,y):g.moveTo(x,y)}
  g.closePath();fs(fill,lw,stroke);
}
function line(p,lw=3,stroke=INK,jit=.7){
  g.beginPath();
  for(let i=0;i<p.length;i+=2){const x=p[i]+j(jit),y=p[i+1]+j(jit);i?g.lineTo(x,y):g.moveTo(x,y)}
  g.lineWidth=lw;g.strokeStyle=stroke;g.lineJoin=g.lineCap='round';g.stroke();
}
const rect=(x,y,w,h,fill,lw,stroke,jit)=>poly([x,y,x+w,y,x+w,y+h,x,y+h],fill,lw,stroke,jit);
function ell(x,y,rx,ry,fill,lw=3,rot=0,stroke){
  g.beginPath();g.ellipse(x+j(.5),y+j(.5),Math.max(.1,rx+j(.4)),Math.max(.1,ry+j(.4)),rot,0,TAU);fs(fill,lw,stroke);
}
function arc(x,y,r,a0,a1,lw=3,stroke=INK){g.beginPath();g.arc(x+j(.4),y+j(.4),r,a0,a1);g.lineWidth=lw;g.strokeStyle=stroke;g.lineCap='round';g.stroke()}
const FONT='"Arial Black","Arial Bold",Impact,"Helvetica Neue",Arial,sans-serif';
function txt(s,x,y,size,fill='#fff',o={}){            // fat block letters with a drop
  g.save();g.translate(x,y);if(o.rot)g.rotate(o.rot);if(o.sc)g.scale(o.sc,o.sc);
  g.font=`${o.it?'italic ':''}900 ${size}px ${FONT}`;g.textAlign=o.al||'center';g.textBaseline='middle';g.lineJoin='round';
  const d=o.d??Math.max(2,Math.round(size*.11));
  g.fillStyle=g.strokeStyle=o.ex||INK;g.lineWidth=o.lw??Math.max(3,size*.15);
  for(let i=d;i>0;i--)g.strokeText(s,i,i);
  g.strokeText(s,0,0);g.fillStyle=fill;g.fillText(s,0,0);g.restore();
}
function small(s,x,y,size,fill='#fff',o={}){
  g.save();g.translate(x,y);if(o.rot)g.rotate(o.rot);
  g.font=`${o.it?'italic ':''}bold ${size}px "Helvetica Neue",Arial,sans-serif`;g.textAlign=o.al||'center';g.textBaseline='middle';
  if(o.lw!==0){g.lineJoin='round';g.lineWidth=o.lw||3;g.strokeStyle=INK;g.strokeText(s,0,0)}
  g.fillStyle=fill;g.fillText(s,0,0);g.restore();
}
function burst(x,y,r,s,size,fill='#ffd93b',tf='#e2231a',rot=0,sc=1){
  g.save();g.translate(x,y);g.rotate(rot);g.scale(sc,sc);
  const p=[];for(let i=0;i<24;i++){const a=i/24*TAU,rr=i&1?r*.66:r;p.push(Math.cos(a)*rr,Math.sin(a)*rr*.8)}
  poly(p,fill,3);txt(s,0,0,size,tf,{d:2});g.restore();
}
function sunburst(cx,cy,c1,c2,rot,n=12){
  g.fillStyle=c1;g.fillRect(0,0,W,H);g.fillStyle=c2;
  for(let i=0;i<n;i++){const a=rot+i/n*TAU,b=a+TAU/n/2;
    g.beginPath();g.moveTo(cx,cy);g.lineTo(cx+Math.cos(a)*900,cy+Math.sin(a)*900);g.lineTo(cx+Math.cos(b)*900,cy+Math.sin(b)*900);g.closePath();g.fill()}
}
const MEM=['#ff5fa2','#ffd93b','#3de0d0','#ffffff','#ff8a3d'];
function memphis(seed,n,t){
  for(let i=0;i<n;i++){
    const x=hash(seed+i*1.3)*W,y=hash(seed+i*2.9)*H,c=MEM[i%5],r=t*(.4+hash(i)*.8)+i;
    g.save();g.translate(x+Math.sin(t+i)*6,y+Math.cos(t*.8+i)*6);g.rotate(r*(i&1?1:-1));
    switch(i%5){
      case 0:poly([-12,10,12,10,0,-12],c,2.5);break;
      case 1:line([-18,0,-12,-7,-6,0,0,-7,6,0,12,-7,18,0],5,INK,0);line([-18,0,-12,-7,-6,0,0,-7,6,0,12,-7,18,0],2.5,c,0);break;
      case 2:ell(0,0,9,9,null,4,0,c);break;
      case 3:rect(-11,-3,22,6,c,2);rect(-3,-11,6,22,c,2);break;
      default:for(let k=0;k<4;k++)ell((k%2)*10-5,(k>>1)*10-5,2.5,2.5,c,0);
    }
    g.restore();
  }
}
function stars(seed,n,t){
  for(let i=0;i<n;i++){
    const x=hash(seed+i*3.1)*W,y=hash(seed+i*5.7)*H,s=(3+hash(i+seed)*6)*(.6+.4*Math.sin(t*3+i*1.7));
    g.fillStyle=i%3?'#fff6c2':'#ff9fc8';
    g.beginPath();g.moveTo(x,y-s);g.quadraticCurveTo(x,y,x+s,y);g.quadraticCurveTo(x,y,x,y+s);g.quadraticCurveTo(x,y,x-s,y);g.quadraticCurveTo(x,y,x,y-s);g.fill();
  }
}
function tint(c){g.globalCompositeOperation='multiply';g.fillStyle=c;g.fillRect(0,0,W,H);g.globalCompositeOperation='source-over'}
function glow(x,y,r,c,a){
  const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,c);gr.addColorStop(1,'rgba(0,0,0,0)');
  g.globalCompositeOperation='lighter';g.globalAlpha=a;g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2);g.globalAlpha=1;g.globalCompositeOperation='source-over';
}
function cam(cx,cy,z,fn){g.save();g.translate(W/2,H/2);g.scale(z,z);g.translate(-cx,-cy);fn();g.restore()}

/* ---------- the cast ---------- */
function nyamuk(x,y,s,o={}){                      // a mosquito, facing left unless dir:-1
  g.save();g.translate(x,y);g.scale(s*(o.dir||1),s);g.rotate(o.rot||0);
  const fl=Math.sin(T*55+(o.ph||0));
  if(o.dead){ell(10,-10,6,15,'#eef4ff',2,1.2)}
  else{g.globalAlpha=.78;ell(5,-17,7+3*fl,20,'#eef4ff',2,-.5+fl*.5);ell(13,-15,7-3*fl,18,'#eef4ff',2,.2-fl*.5);g.globalAlpha=1}
  for(let i=0;i<3;i++){const lx=-2+i*8,w=o.dead?0:Math.sin(T*6+i+(o.ph||0))*2;line([lx,7,lx-6+i*5,19,lx-2+i*6+w,31],2)}
  ell(25,4,18,8,'#34304a',3,.15);
  for(let k=0;k<3;k++)line([15+k*7,-3+k,14+k*7,10+k],2.5,'#fff',0);
  ell(4,2,11,10,'#48436a',3);ell(-10,-4,11,10,'#48436a',3);
  line([-19,0,-45,12],3.5);line([-14,-13,-22,-25],2);line([-7,-14,-9,-27],2);
  if(o.dead){line([-18,-9,-12,-3],2.2,'#fff',0);line([-12,-9,-18,-3],2.2,'#fff',0);line([-8,-9,-2,-3],2.2,'#fff',0);line([-2,-9,-8,-3],2.2,'#fff',0)}
  else{poly([-22,-9,0,-9,-1,-2,-8,-1,-11,-5,-14,-1,-21,-2],'#0c0a12',1.5,INK,.3);line([-19,-7,-15,-7],1.5,'#fff',0);line([-8,-7,-5,-7],1.5,'#fff',0)}
  if(o.band){poly([-21,-13,0,-15,1,-11,-21,-9],'#e2231a',2);poly([1,-14,12,-21,9,-11],'#e2231a',2)}
  if(o.patch){rect(-14,-17,10,7,'#f6e6c8',1.5);line([-12,-14,-6,-14],1.2,'#b58a5a',0)}
  if(o.sack){line([4,2,34,-26],2.5,'#7a4a2a');ell(36,-30,10,9,'#e2231a',2.5);ell(33,-32,1.6,1.6,'#fff',0);ell(39,-28,1.6,1.6,'#fff',0)}
  g.restore();
}
function spiral(lwI,lwG,col,A=5.5*Math.PI,k=3,r0=19){
  g.beginPath();for(let a=0;a<=A+.01;a+=.2){const r=r0+a*k,x=Math.cos(a)*r,y=Math.sin(a)*r;a?g.lineTo(x,y):g.moveTo(x,y)}
  g.lineCap='round';g.lineJoin='round';g.lineWidth=lwI;g.strokeStyle=INK;g.stroke();g.lineWidth=lwG;g.strokeStyle=col;g.stroke();
}
function coil(x,y,s,o={}){                        // the mascot; returns where its burning tip is
  g.save();g.translate(x,y);g.scale(s,s);
  if(o.stand!==false){line([0,74,0,0],5,'#6b7480');poly([-28,80,28,80,20,71,-20,71],'#aab2bb',3)}
  g.rotate(o.rot||0);
  if(o.arms){
    const w=Math.sin(T*9)*10;
    line([-64,12,-90,-6-w],5);ell(-94,-12-w,10,10,'#fff',3);
    line([64,12,92,-4],5);ell(96,-10,10,10,'#fff',3);rect(94,-28,6,12,'#fff',3);
  }
  spiral(17,11,'#3fae4a');
  ell(0,0,24,24,'#4dbd58',3);
  if(o.wink){line([-13,-5,-4,-5],3)}else{ell(-8,-5,5,6.5,'#fff',2);ell(-7,-4,2.4,3.2,INK,0)}
  ell(8,-5,5,6.5,'#fff',2);ell(9,-4,2.4,3.2,INK,0);
  arc(0,4,10,.25,Math.PI-.25,3);
  if(o.lit){ell(0,-71,7,7,'#ff7a1a',2.5);ell(0,-71,3,3,'#ffe27a',0)}
  g.restore();
  return [x+Math.sin(o.rot||0)*71*s,y-Math.cos(o.rot||0)*71*s];
}
function box(x,y,s,rot=0){
  g.save();g.translate(x,y);g.rotate(rot);g.scale(s,s);
  poly([75,-55,97,-70,97,42,75,55],'#9c1620',3);poly([-75,-55,-53,-70,97,-70,75,-55],'#f0525a',3);
  rect(-75,-55,150,110,'#d8262c',3);
  g.fillStyle='#ffd93b';g.fillRect(-73,34,146,19);
  ell(-40,6,25,25,'#ffd93b',2.5);
  g.save();g.translate(-40,6);g.scale(.3,.3);spiral(15,9,'#3fae4a');g.restore();
  txt('NYENYAK',0,-35,25,'#ffd93b',{d:2,lw:4});
  small('OBAT',28,-10,11,'#fff',{lw:0});small('NYAMUK',28,3,11,'#fff',{lw:0});small('BAKAR',28,16,11,'#fff',{lw:0});
  small('ISI 10 KEPING',0,44,9,'#9c1620',{lw:0});
  burst(70,-58,31,'8 JAM*',11,'#fff','#e2231a',.2);
  g.restore();
}
function bapak(o={}){                             // the father, in bed under a sarong
  poly([78,302,84,262,150,251,198,262,202,302],'#f3ead8',3);
  const br=1+.035*Math.sin(T*2.2);
  g.save();g.translate(0,304);g.scale(1,br);g.translate(0,-304);
  g.beginPath();g.moveTo(172,304);g.bezierCurveTo(190,236,300,230,352,256);g.bezierCurveTo(400,262,452,280,464,304);g.closePath();
  g.save();g.clip();g.fillStyle='#7a2f5a';g.fillRect(160,220,320,90);
  g.strokeStyle='rgba(255,217,59,.75)';g.lineWidth=2.5;
  for(let x=176;x<470;x+=24){g.beginPath();g.moveTo(x,220);g.lineTo(x+10,310);g.stroke()}
  g.strokeStyle='rgba(255,255,255,.55)';
  for(let y=244;y<306;y+=17){g.beginPath();g.moveTo(160,y);g.lineTo(480,y+4);g.stroke()}
  g.restore();fs(null,3);g.restore();
  g.save();g.translate(150+(o.shake||0),266);g.rotate(-.18+(o.tilt||0));
  ell(-33,2,6,9,'#d8935f',3);
  ell(0,0,34,31,'#e2a274',3);
  poly([-34,-6,-30,-24,-14,-35,8,-36,26,-27,34,-8,20,-18,0,-21,-18,-18],INK,2);
  const e=o.eyes||'shut';
  if(e==='shut'){arc(-12,-6,6,.25,Math.PI-.25,2.8);arc(12,-6,6,.25,Math.PI-.25,2.8)}
  else if(e==='happy'){arc(-12,-2,6,Math.PI+.3,TAU-.3,2.8);arc(12,-2,6,Math.PI+.3,TAU-.3,2.8)}
  else{
    for(const sx of[-12,12]){ell(sx,-4,8,6,'#fff',2.2);ell(sx+(o.look||0),-3,2.6,2.8,INK,0);line([sx-9,-7,sx+9,-7],3,INK,.3);arc(sx,2,7,.5,Math.PI-.5,1.6,'#8a4f3a')}
    line([-21,-15,-5,-11],3.2);line([21,-15,5,-11],3.2);
  }
  arc(0,2,4,.4,Math.PI-.4,2.2,'#8a4f3a');
  poly([-17,11,-6,8,0,10,6,8,17,11,10,16,0,14,-10,16],INK,1.5);
  if(e==='happy')arc(0,16,7,.3,Math.PI-.3,2.5);
  else if(e==='open')rect(-7,18,14,5,'#fff',2);
  else ell(0,21,5,2+5*(o.mouth||0),'#5a1f2a',2.2);
  const B=[[-22,-14],[21,7],[3,-24]];
  for(let i=0;i<(o.bumps||0);i++){ell(B[i][0],B[i][1],4.5,4.5,'#ef5247',1.8);ell(B[i][0]-1.2,B[i][1]-1.4,1.3,1.3,'#ffc9bd',0)}
  g.restore();
  if(o.arm!=null){
    const hx=lerp(246,172,o.arm),hy=lerp(250,246,o.arm)-Math.sin(o.arm*Math.PI)*26;
    line([214,282,hx,hy],21,INK,.3);line([214,282,hx,hy],15,'#e2a274',.3);ell(hx,hy,13,12,'#e2a274',3);
  }
}
function cicak(x,y){
  line([x-12,y,x-24,y+3,x-32,y-2],2.5,'#a8916a');
  line([x-6,y-3,x-10,y-9],2,'#a8916a');line([x-6,y+3,x-10,y+9],2,'#a8916a');line([x+7,y-3,x+11,y-9],2,'#a8916a');line([x+7,y+3,x+11,y+9],2,'#a8916a');
  ell(x,y,12,4,'#cdb891',2);ell(x+14,y,5,4,'#cdb891',2);ell(x+16,y-1.5,.9,.9,INK,0);
}
function room(){
  g.fillStyle='#86cdb8';g.fillRect(-300,-300,1240,1100);
  g.fillStyle='#5aa894';g.fillRect(-300,250,1240,90);line([-300,250,940,250],3,INK,0);
  g.fillStyle='#dccaa8';g.fillRect(-300,338,1240,500);
  const ys=[338,356,380,412,454,520],XX=(c,y)=>320+c*62*(y-170)/168;
  g.fillStyle='#b9a27c';
  for(let r=0;r<5;r++)for(let c=-9;c<9;c++){if((r+c)&1)continue;
    g.beginPath();g.moveTo(XX(c,ys[r]),ys[r]);g.lineTo(XX(c+1,ys[r]),ys[r]);g.lineTo(XX(c+1,ys[r+1]),ys[r+1]);g.lineTo(XX(c,ys[r+1]),ys[r+1]);g.fill()}
  line([-300,338,940,338],3,INK,0);
  // jalousie window (kaca nako) with the moon behind it
  rect(396,56,172,168,'#7a4a2a',3);g.fillStyle='#141b4d';g.fillRect(408,68,148,144);
  ell(522,102,16,16,'#ffe9a0',0);
  for(let i=0;i<6;i++){g.fillStyle='#cfd8ff';g.fillRect(416+hash(i)*130,74+hash(i+9)*120,2,2)}
  for(let i=0;i<8;i++){const y=70+i*18;g.fillStyle='rgba(200,230,255,.17)';g.fillRect(408,y,148,10);line([408,y+10,556,y+10],1.5,'#0b0f2a',0)}
  rect(478,68,8,144,'#7a4a2a',2);
  // shop calendar, clock, gecko
  rect(236,62,70,92,'#fff',3);g.fillStyle='#d8262c';g.fillRect(238,64,66,20);
  small('TOKO MAJU',271,74,8,'#fff',{lw:0});small('13',271,112,36,'#d8262c',{lw:0});small('JUMAT KLIWON',271,142,7,'#333',{lw:0});
  ell(120,96,30,30,'#fff',3);line([120,96,120,73],3,INK,.2);line([120,96,111,81],4,INK,.2);ell(120,96,2.5,2.5,'#d8262c',0);
  cicak(52+Math.floor(T/3)%2*14,36);
  // side table with a covered glass of tea
  rect(494,312,10,60,'#6f4526',3);rect(584,312,10,60,'#6f4526',3);rect(486,300,116,12,'#8a5a34',3);
  rect(567,273,21,27,'#c9853a',2.5);poly([562,273,593,273,589,266,566,266],'#e9e2d0',2.5);ell(577.5,264,3,2,'#e9e2d0',2);
  // bed
  rect(36,214,26,162,'#7a4a2a',3);rect(474,268,16,108,'#7a4a2a',3);
  rect(56,304,424,34,'#f3ead8',3);rect(50,338,436,18,'#8a5a34',3);rect(62,356,12,26,'#6f4526',3);rect(462,356,12,26,'#6f4526',3);
  // flip-flops and a bolster that fell off
  for(const[sx,sy]of[[250,420],[284,430]]){ell(sx,sy,13,6.5,'#2a7fd0',2.5,-.3);line([sx-7,sy+2,sx+3,sy-1,sx+6,sy-5],2,'#fff',.2);line([sx+3,sy-1,sx+8,sy+2],2,'#fff',.2)}
  ell(424,446,64,15,'#f3ead8',3,-.07);
  for(let i=-2;i<=2;i++)line([424+i*22,433-i*1.5,424+i*22-3,459-i*1.5],2,'#6fa0d8',.3);
}
function puff(x,y,r){ell(x,y,r,r,'#f3f0e8',2.5)}
function fist(x,y,s,rot){
  g.save();g.translate(x,y);g.rotate(rot);g.scale(s,s);
  puff(8,0,24);for(let i=0;i<4;i++)puff(-18,-20+i*13,10);puff(6,-24,11);
  line([-6,-10,-6,14],2,'#b9b4a8',.3);g.restore();
}

/* ---------- the ten shots ---------- */
function bumperIn(u){
  g.fillStyle='#1d2f9a';g.fillRect(0,0,W,H);
  g.fillStyle='rgba(255,255,255,.06)';for(let i=-8;i<16;i++){g.beginPath();g.moveTo(i*60+u*12,0);g.lineTo(i*60+30+u*12,0);g.lineTo(i*60-210+u*12,H);g.lineTo(i*60-240+u*12,H);g.fill()}
  stars(3,26,u);
  logo(320,86,1.5);
  txt('KAMI AKAN KEMBALI SETELAH',320,196,22,'#fff',{sc:eb(u/.4)});
  if(u>.5)txt('PESAN-PESAN',320,262,54,'#ffd93b',{sc:eb((u-.5)/.4),rot:-.03});
  if(u>.9)txt('BERIKUT INI',320,336,42,'#ffd93b',{sc:eb((u-.9)/.4),rot:.02});
  memphis(11,7,u);
}
function logo(x,y,s){                              // the made-up station

/* ---------- sound: everything is an oscillator or filtered noise ---------- */

const kick=w=>tone(w,150,.2,{type:'sine',to:45,v:.32}),snare=w=>{noise(w,.13,{ft:'highpass',f:1700,v:.13});tone(w,210,.08,{to:120,v:.08})},

  tak=w=>{tone(w,880,.06,{to:480,v:.13});noise(w,.03,{ft:'highpass',f:3000,v:.07})},
  clap=w=>{for(let i=0;i<3;i++)noise(w+i*.012,.09,{f:1500,q:1.2,v:.11})},
  whine=(w,d,v,f)=>tone(w,f,d,{type:'sawtooth',v,a:.5,sus:1,vib:11,vd:28}),
  brass=(w,ms,d,v)=>ms.forEach(m=>{tone(w,mf(m),d,{type:'sawtooth',v,a:.03,sus:1});tone(w,mf(m)*1.006,d,{type:'sawtooth',v:v*.7,a:.03,sus:1})}),

const EV=[],E=(t,f)=>EV.push({t,f});
(function score(){

})();
function newBus(){
  if(bus){const o=bus;o.gain.setTargetAtTime(0,AC.currentTime,.02);setTimeout(()=>o.disconnect(),300)}
  bus=AC.createGain();bus.gain.value=.9;bus.connect(master);
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),ga=AC.createGain();              // tape hiss and mains hum
  s.buffer=NB;s.loop=true;f.type='lowpass';f.frequency.value=5000;ga.gain.value=.012;s.connect(f);f.connect(ga);ga.connect(bus);s.start();
  const h=AC.createOscillator(),hg=AC.createGain();h.frequency.value=50;hg.gain.value=.012;h.connect(hg);hg.connect(bus);h.start();
  const tn=clock()-base;loopN=Math.floor(tn/DUR);const tm=tn-loopN*DUR;si=EV.findIndex(e=>e.t>=tm);if(si<0){si=0;loopN++}
}
function startAudio(){
  const tn=paused?pT:clock()-base;

  NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const comp=AC.createDynamicsCompressor();master=AC.createGain();master.gain.value=muted?0:1;master.connect(comp);comp.connect(AC.destination);

}
function schedule(){
  for(let n=0;n<400;n++){
    const ev=EV[si],when=base+loopN*DUR+ev.t;if(when>AC.currentTime+.3)break;
    if(when>AC.currentTime-.05)ev.f(Math.max(when,AC.currentTime+.005));
    if(++si>=EV.length){si=0;loopN++}
  }
}
function togglePause(){
  if(!paused){pT=clock()-base;paused=true;if(AC)AC.suspend()}
  else{paused=false;if(AC)AC.resume();base=clock()-pT}
}
function seek(d){
  const tn=Math.max(0,(paused?pT:clock()-base)+d);if(paused)pT=tn;base=clock()-tn;if(AC)newBus();
}
if(!THUMB){
  cv.addEventListener('click',()=>{AC?togglePause():startAudio()});
  addEventListener('keydown',e=>{
    if(e.code==='Space'){e.preventDefault();AC?togglePause():startAudio()}
    else if(e.code==='ArrowRight')seek(5);else if(e.code==='ArrowLeft')seek(-5);
    else if(e.key==='m'||e.key==='M'){muted=!muted;if(master)master.gain.value=muted?0:1}
  });

/* ---------- go ---------- */
function frame(){
  requestAnimationFrame(frame);
  if(AC&&!paused&&AC.state==='running')schedule();
  const tn=paused?pT:clock()-base;T=((tn%DUR)+DUR)%DUR;BF=Math.floor(T*8);jn=0;
  scene(T);tape(tn,T);present(tn);
