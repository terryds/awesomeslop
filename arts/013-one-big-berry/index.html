    if (e.code === 'Space') { e.preventDefault(); if (!audioOn) startAudio(); else togglePause(); }
    else if (e.code === 'ArrowLeft') seek(-5);
    else if (e.code === 'ArrowRight') seek(5);
    else if (e.code === 'KeyM') { muted = !muted; if (master) master.gain.setTargetAtTime(muted ? 0 : .7, ac.currentTime, .02); ui(); }
  });
}

function frame() {
  requestAnimationFrame(frame);
  tick();
  const t = curT();
  T = ((t % LEN) + LEN) % LEN; B = Math.floor(T * 8);
  draw();
}
requestAnimationFrame(frame);
</script>
