<title>sword of the yellow wood</title>
<style>
  html,body{margin:0;height:100%;background:#d8cbd0;overflow:hidden}
  canvas{display:block;width:100%;height:100%;cursor:pointer;touch-action:none}

  #stat{position:absolute;left:14px;top:12px;opacity:0;transition:opacity .6s;font:15px Georgia,serif;letter-spacing:.03em}
  #stat span{margin-right:16px}#hp{color:#ff5a4a;font-size:19px;letter-spacing:.08em}#hp i{font-style:normal;color:rgba(255,255,255,.35)}

  #bar{position:absolute;left:0;top:0;width:84px;height:6px;display:none;background:rgba(40,12,26,.65);border:1px solid rgba(255,244,220,.7)}#bar i{display:block;height:100%;background:#ee4a38}

  @media (max-width:520px),(max-height:300px){#hud{display:none}}
</style>

<script type="module">
// sword of the yellow wood: a small action RPG in an autumn wood, painted in oils.
// Nothing is filtered afterwards. Every surface is covered in brush strokes that are fixed in the world:
// each stroke is one flat quad in one of three paints, cut to a brush shape in its shader.
import * as THREE from 'three';
THREE.ColorManagement.enabled = false;   // colours here are the paint colours you see; nothing converts them

const q = new URLSearchParams(location.search), THUMB = q.has('thumb');

const [shadowCanvas, sctx] = mapCanvas('#fff');
sctx.lineCap = 'round';

const shadowData = sctx.getImageData(0, 0, MS, MS).data;
const lightAt = (x, z) => sample(shadowData, x, z);

// ---------- strokes ----------
// Two kinds. A fixed stroke lies on a surface (ground, bark, stone, cloth, sky). A facing stroke is a leaf or a

const FRAG = `

const fixVert = `
attribute vec3 iPos, iU, iV, iCol; attribute vec2 iMisc; uniform float uShade, uFlash;
varying vec2 vUv; varying vec3 vCol; varying vec2 vMisc;

void main(){
  vUv = position.xy; vMisc = iMisc; vec3 col = iCol;

attribute vec3 iPos, iU, iCol, iMisc; uniform float uTime; uniform vec3 uCenter;

const solidVert = `attribute vec3 aCol; varying vec3 vW, vC; void main(){ vec4 w = modelMatrix * vec4(position, 1.); vW = w.xyz; vC = aCol; gl_Position = projectionMatrix * viewMatrix * w; }`;

#ifdef VCOL

// ---------- scene ----------
const canvas = document.getElementById('c');

{

      if (d > b.r + .7) { sp = b.old ? 3.2 : 3.8; mx = dx / d; mz = dz / d; } else if (b.cd <= 0 && b.stun <= 0) { b.swipe = .85; b.cd = 2; b.hit = false; sfx.growl(b.old); }   // it rears up first: that is your warning
    } else if (b.wait > 0) b.wait -= dt;
    else { const wx = b.tx - b.x, wz = b.tz - b.z, wd = Math.hypot(wx, wz); b.going += dt; if (wd < .7 || b.going > 14) { b.wait = rr(1, 6); b.going = 0; const a = rnd() * 6.283, r = rr(3, 11); b.tx = b.hx + Math.cos(a) * r; b.tz = b.hz + Math.sin(a) * r; } else { sp = 1; mx = wx / wd; mz = wz / wd; } }

    const rad = Math.hypot(b.x, b.z); if (rad > 68) { b.x *= 68 / rad; b.z *= 68 / rad; }
    const ty = sp > 0 ? Math.atan2(mx, mz) : b.state === 1 ? Math.atan2(dx, dz) : b.yaw; b.yaw += wrap(ty - b.yaw) * (1 - Math.exp(-6 * dt));

  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    if (!it.m.visible) { if (!it.kind && (it.back -= dt) <= 0) it.m.visible = true; continue; }
    if (it.kind) { it.m.position.y = it.y + Math.sin(T * 2 + i) * .09; it.m.rotation.y = T * 1.4 + i; }
    if (can && Math.hypot(it.x - S.x, it.z - S.z) < 1.1 && S.y - ground(S.x, S.z) < 1.2) {
      if (it.kind) { it.m.visible = false; P.acorns++; sfx.acorn(); burst(it.x, it.m.position.y, it.z, 8, [C('#ffd84a'), C('#fff4d2')], 3, 0); say(P.acorns === ACORNS ? 'every golden acorn in the wood is yours' : 'a golden acorn'); hudDraw(); }
      else if (P.hp < P.max) { it.m.visible = false; it.back = 50; P.hp++; sfx.heal(); say('a red mushroom: one heart mended'); hudDraw(); }
    }
  }
  const f = P.focus, bar = $('bar'); let show = false;   // a small bar over the bear you are fighting
  if (f && f.state < 2 && f.hp < f.max) { pv.set(f.x, ground(f.x, f.z) + 1.85 * f.sc, f.z).project(camera); if (pv.z < 1) { show = true; bar.style.transform = `translate(${(pv.x * .5 + .5) * innerWidth - 42}px,${(-pv.y * .5 + .5) * innerHeight}px)`; bar.firstChild.style.width = f.hp / f.max * 100 + '%'; } }

}

// ---------- input ----------
let PR = Math.min(devicePixelRatio || 1, 1.5);
function resize() { const w = innerWidth, h = innerHeight; renderer.setPixelRatio(PR); renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const hud = document.getElementById('hud'); if (THUMB) hud.style.display = 'none';
function start() {
  if (THUMB) return;
  audio(); if (!walking) { walking = true; hud.classList.add('walking'); }
  if (canvas.requestPointerLock) { try { const p = canvas.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
}
canvas.addEventListener('click', start);
addEventListener('mousemove', e => { if (walking && document.pointerLockElement === canvas) { camYaw -= e.movementX * .0024; camPitch = clamp(camPitch - e.movementY * .0024, -1.1, .5); } });
let drag = null; // no pointer lock (touch, or a sandboxed frame): drag to look
let moved = 0;
canvas.addEventListener('pointerdown', e => { drag = [e.clientX, e.clientY]; moved = 0; if (e.button === 2) dodge(); else if (document.pointerLockElement === canvas && e.button === 0) attack(); });
canvas.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('pointerup', e => { if (drag && moved < 6 && document.pointerLockElement !== canvas && e.button === 0) attack(); drag = null; });   // without pointer lock, a tap that is not a drag swings
addEventListener('pointermove', e => { if (walking && drag && document.pointerLockElement !== canvas) { moved += Math.abs(e.clientX - drag[0]) + Math.abs(e.clientY - drag[1]); camYaw -= (e.clientX - drag[0]) * .005; camPitch = clamp(camPitch - (e.clientY - drag[1]) * .005, -1.1, .5); drag = [e.clientX, e.clientY]; } });
addEventListener('keydown', e => { keys[e.code] = true; if (!e.repeat) { if (e.code === 'KeyF' || e.code === 'KeyJ') { audio(); attack(); } else if (e.code === 'KeyE' || e.code === 'KeyQ') dodge(); else if (e.code === 'KeyM') muted = !muted; } if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault(); });
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// ---------- frame ----------
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3(), v1 = new THREE.Vector3(), v2 = new THREE.Vector3(), look = new THREE.Vector3();
let camInit = false, last = performance.now(), slow = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = clamp((now - last) / 1000, .001, .05); last = now; T += dt; UNI.uTime.value = T;
  if (dt > .03) { if (++slow > 40 && PR > .75) { PR = Math.max(.75, PR - .25); slow = 0; resize(); } } else slow = Math.max(0, slow - 1);
  if (hitStop > 0) hitStop -= dt; const gdt = hitStop > 0 ? dt * .03 : dt;   // a blow that lands stops the world for a moment
  walk(gdt); fight(gdt);
  if (!walking) { camYaw += wrap(S.yaw + .55 * Math.sin(T * .11) - camYaw) * (1 - Math.exp(-1.2 * dt)); camPitch = -.1 + .05 * Math.sin(T * .07); }
  v1.set(Math.sin(camYaw) * Math.cos(camPitch), Math.sin(camPitch), Math.cos(camYaw) * Math.cos(camPitch));   // the mouse turns the camera round the walker
  look.set(S.x, S.y + 1.35, S.z); v2.copy(look).addScaledVector(v1, -5.6); v2.y += .35;
  pushOut(v2, .35); const cg = ground(v2.x, v2.z) + .4; if (v2.y < cg) v2.y = cg;
  if (!camInit) { camPos.copy(v2); camLook.copy(look); camInit = true; }
  camPos.lerp(v2, 1 - Math.exp(-14 * dt)); camLook.lerp(look.addScaledVector(v1, 2.5), 1 - Math.exp(-14 * dt));
  camera.position.copy(camPos); camera.lookAt(camLook);
  if (shake > .002) { camera.position.x += (Math.random() - .5) * shake; camera.position.y += (Math.random() - .5) * shake; camera.position.z += (Math.random() - .5) * shake; camera.rotation.z += (Math.random() - .5) * shake * .12; shake *= Math.exp(-9 * dt); }
  camera.updateMatrixWorld();
  UNI.uCenter.value.set(S.x, ground(S.x, S.z), S.z);
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
</script>
