<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>wet paint</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#efe7d6}
  canvas{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;cursor:pointer}
  #hint{position:fixed;left:0;right:0;bottom:5%;text-align:center;pointer-events:none;transition:opacity .8s;
    font:italic 18px/1.3 Georgia,"Times New Roman",serif;color:#4a3f38}
  #hint span{display:inline-block;padding:7px 18px 9px;background:rgba(244,237,221,.9);border-radius:999px}
  #hint small{display:block;font-size:12px;opacity:.7}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint"><span>click for sound<small>space pauses · ← → skip 5 s · m mutes</small></span></div>
<script>
'use strict';
// ================================================================ setup
const qs = new URLSearchParams(location.search), THUMB = qs.has('thumb'), STILL = qs.has('still');
const cv = document.getElementById('c'), X = cv.getContext('2d'), hintEl = document.getElementById('hint');
if (THUMB) hintEl.style.display = 'none';
const SW = 1600, SH = 900, LEN = 60, SCN = 10, BEAT = .625, TR = .9, PI = Math.PI, TAU = PI * 2;
let S = 1, g = X, SK = false, HIDE = false, NOCAM = false;
let T1, T2, MK, GLOW, grainPat, L = {};

const lerp = (a, b, t) => a + (b - a) * t, clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function h1(x) { x |= 0; x = Math.imul(x ^ (x >>> 16), 0x7feb352d); x = Math.imul(x ^ (x >>> 15), 0x846ca68b); x ^= x >>> 16; return (x >>> 0) / 4294967296; }
const h2 = (x, y) => h1(Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263));
function vn(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return lerp(lerp(h2(xi, yi), h2(xi + 1, yi), u), lerp(h2(xi, yi + 1), h2(xi + 1, yi + 1), u), v) * 2 - 1;
}
function rng(seed) {
  let s = (seed | 0) ^ 0x9e3779b9;
  return () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const EASE = {
  l: p => p, io: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2, o: p => 1 - Math.pow(1 - p, 3), i: p => p * p * p,
  el: p => p <= 0 ? 0 : p >= 1 ? 1 : Math.pow(2, -9 * p) * Math.sin((p * 9 - .75) * TAU / 3) + 1
};
// keyframes [[t, v, ease], ...]: the ease shapes the move into that key
function kf(u, k) {
  if (u <= k[0][0]) return k[0][1];
  for (let i = 1; i < k.length; i++) if (u <= k[i][0]) { const a = k[i - 1], b = k[i], p = (u - a[0]) / (b[0] - a[0] || 1); return a[1] + (b[1] - a[1]) * EASE[b[2] || 'io'](p); }
  return k[k.length - 1][1];
}
const hop = (u, t0, d, h) => { const p = (u - t0) / d; return p > 0 && p < 1 ? 4 * h * p * (1 - p) : 0; };
function land(u, t0, amt = .3) { const d = u - t0; if (d < 0 || d > .7) return [1, 1]; const k = Math.exp(-d * 7) * Math.cos(d * 22) * amt; return [1 + k * .8, 1 - k]; }
const hx = c => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
const mix = (a, b, t) => { const A = hx(a), B = hx(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], t))).join(',')})`; };

// ================================================================ layers
function mk() { const c = document.createElement('canvas'); c.width = Math.round(SW * S); c.height = Math.round(SH * S); const x = c.getContext('2d'); x.setTransform(S, 0, 0, S, 0, 0); x.lineCap = x.lineJoin = 'round'; c.x = x; return c; }
function into(c, fn) { const o = g; g = c.x; fn(); g = o; return c; }
function img(c, a = 1) { g.globalAlpha = a; g.drawImage(c, 0, 0, SW, SH); g.globalAlpha = 1; }
const clear = () => g.clearRect(0, 0, SW, SH);

// ================================================================ drawing toolkit
function path(p, close = true) { g.beginPath(); g.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) g.lineTo(p[i], p[i + 1]); if (close) g.closePath(); }
function sm(c, closed = true, seg = 8) { // catmull-rom through control points
  const n = c.length / 2, out = [], P = i => { i = closed ? ((i % n) + n) % n : clamp(i, 0, n - 1); return [c[2 * i], c[2 * i + 1]]; };
  for (let i = 0, m = closed ? n : n - 1; i < m; i++) {
    const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
    for (let j = 0; j < seg; j++) { const t = j / seg, t2 = t * t, t3 = t2 * t; for (let k = 0; k < 2; k++) out.push(.5 * (2 * p1[k] + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3)); }
  }
  if (!closed) out.push(...P(n - 1));
  return out;
}
function rough(p, amp, seed, f = .03) { const o = []; for (let i = 0; i < p.length; i += 2) o.push(p[i] + vn(p[i] * f + seed, p[i + 1] * f) * amp, p[i + 1] + vn(p[i] * f, p[i + 1] * f + seed + 9) * amp); return o; }
function pencil(p, close = true) { g.strokeStyle = 'rgba(78,86,112,.5)'; g.lineWidth = 1.5; for (let k = 0; k < 2; k++) { path(rough(p, 2.4, k * 7 + 1, .04), close); g.stroke(); } }
function fill(p, c, a = 1) { if (SK) return pencil(p); path(p); g.globalAlpha = a; g.fillStyle = c; g.fill(); g.globalAlpha = 1; }
function bbox(p) { let a = 1e9, b = 1e9, c = -1e9, d = -1e9; for (let i = 0; i < p.length; i += 2) { a = Math.min(a, p[i]); c = Math.max(c, p[i]); b = Math.min(b, p[i + 1]); d = Math.max(d, p[i + 1]); } return [a, b, c, d]; }
// a watercolour shape: flat wash, uneven pigment inside, a darker edge where it dried
function wc(p, c, a = .9, seed = 1, dark = '#234') {
  if (SK) return pencil(p);
  fill(p, c, a);
  const [x0, y0, x1, y1] = bbox(p), R = rng(seed + x0 * 3 + y0), w = x1 - x0, h = y1 - y0;
  g.save(); path(p); g.clip();
  for (let i = 0; i < 9; i++) { g.globalAlpha = .07; g.fillStyle = R() < .5 ? '#fff' : dark; g.beginPath(); g.ellipse(x0 + R() * w, y0 + R() * h, (.1 + R() * .25) * w, (.1 + R() * .25) * h, 0, 0, TAU); g.fill(); }
  g.restore(); path(p); g.strokeStyle = c; g.globalAlpha = .45; g.lineWidth = 2.5; g.stroke(); g.globalAlpha = 1;
}
function dab(x, y, w, h, r, c, a = 1) { if (SK) return; g.save(); g.translate(x, y); g.rotate(r); g.globalAlpha = a; g.fillStyle = c; g.beginPath(); g.roundRect(-w / 2, -h / 2, w, h, Math.min(w, h) * .32); g.fill(); g.restore(); }
function circ(x, y, r, c, a = 1) { if (SK) return; g.globalAlpha = a; g.fillStyle = c; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); g.globalAlpha = 1; }
function ell(x, y, rx, ry, rot, c, a = 1) { if (SK) return; g.globalAlpha = a; g.fillStyle = c; g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, TAU); g.fill(); g.globalAlpha = 1; }
function rect(x, y, w, h, c, a = 1) { if (SK) return; g.globalAlpha = a; g.fillStyle = c; g.fillRect(x, y, w, h); g.globalAlpha = 1; }
function line(x0, y0, x1, y1, w, c, a = 1) { if (SK) return; g.globalAlpha = a; g.strokeStyle = c; g.lineWidth = w; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); g.globalAlpha = 1; }
function grad(x0, y0, x1, y1, st) { const G = g.createLinearGradient(x0, y0, x1, y1); for (const s of st) G.addColorStop(s[0], s[1]); return G; }
function hill(x0, x1, base, f, step = 20) { const p = []; for (let x = x0; x <= x1; x += step) p.push(x, f(x)); p.push(x1, base, x0, base); return p; }
function ring(cx, cy, rx, ry, n = 28) { const p = []; for (let i = 0; i < n; i++) { const a = i / n * TAU; p.push(cx + Math.cos(a) * rx, cy + Math.sin(a) * ry); } return p; }
function prefix(p, f) { // the first fraction f of a polyline, by length
  if (f >= 1) return p; let tot = 0; const d = [0];
  for (let i = 2; i < p.length; i += 2) { tot += Math.hypot(p[i] - p[i - 2], p[i + 1] - p[i - 1]); d.push(tot); }
  const o = [p[0], p[1]], want = tot * Math.max(f, 0);
  for (let i = 1; i < d.length; i++) { if (d[i] <= want) o.push(p[2 * i], p[2 * i + 1]); else { const k = (want - d[i - 1]) / (d[i] - d[i - 1] || 1); o.push(lerp(p[2 * i - 2], p[2 * i], k), lerp(p[2 * i - 1], p[2 * i + 1], k)); break; } }
  return o;
}
function offsetPath(p, d) { const o = [], n = p.length / 2; for (let i = 0; i < n; i++) { const a = Math.max(i - 1, 0), b = Math.min(i + 1, n - 1); let nx = -(p[2 * b + 1] - p[2 * a + 1]), ny = p[2 * b] - p[2 * a]; const l = Math.hypot(nx, ny) || 1; o.push(p[2 * i] + nx / l * d, p[2 * i + 1] + ny / l * d); } return o; }
// a brush stroke along a polyline: parallel bristles, some of them running dry
function brush(p, w, c, seed, a = 1, n = 9, dry = .3, core = false) {
  if (SK || p.length < 4) return; const R = rng(seed);
  if (core) { g.strokeStyle = c; g.globalAlpha = a; g.lineWidth = w * .66; path(p, false); g.stroke(); }
  for (let k = 0; k < n; k++) {
    const edge = !core || k < 2 || k > n - 3;
    g.strokeStyle = c; g.globalAlpha = a * (.6 + R() * .4); g.lineWidth = w / n * 1.7;
    g.setLineDash(edge && R() < dry ? [30 + R() * 90, 5 + R() * 22] : []);
    path(offsetPath(p, (k / (n - 1) - .5) * w * .86 + (R() - .5) * w / n), false); g.stroke();
  }
  g.setLineDash([]); g.globalAlpha = 1;
}
function yAt(p, x) { for (let i = 2; i < p.length; i += 2) if (p[i] >= x) return lerp(p[i - 1], p[i + 1], clamp((x - p[i - 2]) / (p[i] - p[i - 2] || 1), 0, 1)); return p[p.length - 1]; }

// ================================================================ the little painter
const MC = '#d97757', MC2 = '#b9583c', MC3 = '#eba083', EYE = '#2a1a16', HANDX = 62, HANDY = -56, BL = 114;
function mascot(x, y, s, o = {}) {
  if (HIDE) return;
  const dir = o.dir || 1, h = o.h || 0, sq = o.sq || [1, 1], sit = o.sit || 0, wk = o.walk, look = o.look || [0, 0];
  g.save(); g.translate(x, y);
  if (o.shadow !== false) { const k = 1 / (1 + h / 110); g.globalAlpha = .2 * k; g.fillStyle = o.sh || '#2a2030'; g.beginPath(); g.ellipse(0, 3, 64 * s * k, 9 * s * k, 0, 0, TAU); g.fill(); g.globalAlpha = 1; }
  g.translate(0, -h); g.rotate(o.tilt || 0); g.scale(s * dir * sq[0], s * sq[1]);
  const lh = 20 * (1 - sit * .8), by = -lh - (wk != null ? Math.abs(Math.sin(wk)) * 3 : 0);
  for (let i = 0; i < 4; i++) { // legs
    const ph = (i % 2 ? PI : 0) + (i > 1 ? .5 : 0), lift = wk != null ? Math.max(0, Math.sin(wk + ph)) * 7 : 0, sw = wk != null ? Math.cos(wk + ph) * 5 : 0;
    g.fillStyle = i == 1 || i == 2 ? '#b25539' : '#c4623f'; g.beginPath(); g.roundRect([-40, -17, 17, 40][i] - 6.5 + sw, by - 3, 13, -by + 3 - lift, 3); g.fill();
  }
  g.fillStyle = '#c96a4a'; g.beginPath(); g.roundRect(-69, by - 44, 18, 17, 4); g.fill(); // far arm
  g.fillStyle = MC; g.beginPath(); g.roundRect(-54, by - 64, 108, 64, 10); g.fill(); // body
  g.save(); g.clip();
  g.globalAlpha = .4; g.fillStyle = MC2; g.fillRect(-54, by - 13, 108, 13);
  g.globalAlpha = .45; g.fillStyle = MC3; g.beginPath(); g.roundRect(-47, by - 60, 94, 9, 5); g.fill();
  g.globalAlpha = .18; g.beginPath(); g.roundRect(-40, by - 30, 50, 5, 3); g.roundRect(-10, by - 22, 46, 4, 2); g.fill();
  g.restore(); g.globalAlpha = 1;
  const ex = 8 + look[0], ey = by - 40 + look[1]; // eyes
  for (const dx of [-19, 19]) {
    g.fillStyle = g.strokeStyle = EYE;
    if (o.eyes == 'h') { g.lineWidth = 4.5; g.beginPath(); g.arc(ex + dx, ey + 5, 8, PI * 1.12, PI * 1.88); g.stroke(); }
    else if (o.eyes == 'c') { g.lineWidth = 4.5; g.beginPath(); g.moveTo(ex + dx - 7, ey); g.lineTo(ex + dx + 7, ey); g.stroke(); }
    else if (o.eyes == 'w') { g.beginPath(); g.roundRect(ex + dx - 6, ey - 13, 12, 26, 4); g.fill(); g.fillStyle = '#fff'; g.fillRect(ex + dx - 3, ey - 9, 4, 5); }
    else { const bh = 20 * (1 - (o.blink || 0) * .85); g.beginPath(); g.roundRect(ex + dx - 4.5, ey - bh / 2, 9, bh, 3); g.fill(); }
  }
  g.fillStyle = MC; g.beginPath(); g.roundRect(51, by - 44, 18, 17, 4); g.fill(); // near arm
  if (o.ba != null) { g.translate(HANDX, by - 36); g.rotate(o.ba); brushShape(o.bc); }
  g.restore();
}
function brushShape(c) {
  g.fillStyle = '#c9a06a'; g.beginPath(); g.roundRect(-10, -3.5, 88, 7, 3); g.fill();
  g.fillStyle = '#9aa0a8'; g.fillRect(76, -5, 12, 10);
  g.fillStyle = c || '#f3ead8'; g.beginPath(); g.moveTo(88, -6.5); g.quadraticCurveTo(108, -8, BL + 4, 0); g.quadraticCurveTo(108, 8, 88, 6.5); g.closePath(); g.fill();
}
const tipOf = (x, y, s, dir, ba, h = 0) => [x + dir * s * (HANDX + Math.cos(ba) * BL), y - h + s * (HANDY + Math.sin(ba) * BL)];
const aim = (x, y, s, dir, tx, ty, h = 0) => Math.atan2(ty - (y - h + s * HANDY), (tx - (x + dir * s * HANDX)) * dir);
const blink = u => (u % 3.3 > 3.15 ? 1 : 0);

// ================================================================ 1. harbour (watercolour over a pencil sketch)
function lighthouse(x, y) {
  const hw = h => 34 - 12 * h / 170, band = (a, b, c) => fill([x - hw(a), y - a, x + hw(a), y - a, x + hw(b), y - b, x - hw(b), y - b], c);
  band(0, 170, '#f8f2e6'); band(34, 70, '#cc5340'); band(104, 138, '#cc5340');
  if (!SK) fill([x + 4, y, x + 34, y, x + 22, y - 170, x + 6, y - 170], '#3b3350', .13);
  fill([x - 30, y - 170, x + 30, y - 170, x + 30, y - 180, x - 30, y - 180], '#3d4250');
  fill([x - 16, y - 180, x + 16, y - 180, x + 16, y - 212, x - 16, y - 212], '#ffe7a0');
  fill([x - 23, y - 212, x + 23, y - 212, x, y - 242], '#cc5340');
  fill([x + 48, y, x + 132, y, x + 132, y - 46, x + 48, y - 46], '#f3e8d2');
  fill([x + 40, y - 46, x + 140, y - 46, x + 118, y - 78, x + 62, y - 78], '#b9523f');
  fill([x + 80, y, x + 98, y, x + 98, y - 30, x + 80, y - 30], '#5a6b7c');
}
function boat(x, y, s, c) {
  g.save(); g.translate(x, y); g.scale(s, s);
  if (!SK) { dab(0, 42, 96, 8, 0, c, .28); dab(6, 58, 60, 6, 0, '#fff8ea', .3); dab(-4, 72, 36, 5, 0, '#fff8ea', .2); }
  fill([0, -6, 5, -6, 5, -160, 0, -160], '#6b4a36'); fill([10, -152, 10, -16, 74, -16], '#fffaf0'); fill([-5, -130, -5, -14, -62, -14], '#f1dfc2');
  fill([-72, -4, -58, 26, 52, 26, 76, -8], c); fill([-72, -4, 76, -8, 74, 1, -69, 4], '#fff3e0');
  g.restore();
}
function harbourArt() {
  const R = rng(11);
  if (SK) {
    g.fillStyle = '#f4eddd'; g.fillRect(0, 0, SW, SH);
    pencil([0, 470, SW, 470], false); pencil(ring(1130, 392, 46)); pencil([1130, 300, 1130, 500], false); pencil([300, 40, 300, 320], false); pencil([0, 770, SW, 770], false);
    for (let i = 0; i < 16; i++) { const y = 490 + R() * 260, x = R() * 1450; pencil([x, y, x + 40, y - 5, x + 80, y, x + 120, y - 5], false); }
  } else {
    g.fillStyle = grad(0, 0, 0, 480, [[0, '#a5cde3'], [.5, '#e6e3d2'], [.85, '#f9dbb0'], [1, '#f9c896']]); g.fillRect(0, 0, SW, 480);
    for (const [r, a] of [[200, .16], [125, .28], [72, .5]]) circ(1130, 392, r, '#fff1c9', a); circ(1130, 392, 46, '#fffaf0');
  }
  for (const [cx, cy, w] of [[250, 120, 250], [640, 84, 320], [990, 176, 230], [1390, 104, 290], [830, 262, 180]]) {
    const p = []; for (let i = 0; i < 9; i++) { const a = i / 9 * TAU; p.push(cx + Math.cos(a) * w * (.5 + R() * .12), cy + Math.sin(a) * w * (.12 + R() * .08)); }
    wc(sm(p), '#ffffff', .8, cx, '#9fb4c8');
  }
  wc(hill(840, 1600, 474, x => 452 - Math.sin((x - 840) / 760 * PI) * 40 - vn(x * .01, 3) * 14), '#9db4c8', .85, 3);
  wc(hill(1160, 1600, 474, x => 464 - ss(1160, 1600, x) * 52 - vn(x * .013, 8) * 10), '#7896b2', .85, 4);
  if (!SK) {
    g.fillStyle = grad(0, 470, 0, 780, [[0, '#f5d8ae'], [.1, '#b4d2d2'], [.5, '#5fa3b8'], [1, '#2f7896']]); g.fillRect(0, 470, SW, 310);
    for (let i = 0; i < 300; i++) { const y = 474 + Math.pow(R(), 1.4) * 300, k = (y - 470) / 310; dab(R() * SW, y, 26 + k * 120 * R(), 2 + k * 5, 0, R() < .5 ? '#ffffff' : '#1f5f7c', .08 + R() * .13); }
    for (let i = 0; i < 50; i++) { const y = 476 + R() * 250, k = (y - 470) / 310; dab(1130 + (R() - .5) * (60 + k * 280), y, 24 + k * 60, 2.5 + k * 4, 0, '#fff3d2', .5 * (1 - k * .6)); }
  }
  wc(sm([-20, 314, 140, 296, 300, 300, 430, 306, 505, 334, 545, 402, 580, 470, 606, 524, 556, 566, 420, 596, 250, 616, -20, 644], true, 5), '#c5a88b', .95, 5);
  if (!SK) { for (let i = 0; i < 40; i++) { const x = R() * 560, y = 350 + R() * 250; if (x < 520 - (y - 330) * -.2) line(x, y, x + 10 + R() * 30, y + 30 + R() * 40, 3 + R() * 5, R() < .5 ? '#8f755f' : '#e0c9ad', .22); } for (let i = 0; i < 26; i++) dab(60 + R() * 540, 596 + R() * 40 - i, 30 + R() * 50, 6, 0, '#ffffff', .5); }
  wc(sm([-20, 312, 140, 294, 300, 298, 430, 304, 508, 334, 468, 356, 330, 342, 150, 346, -20, 362], true, 5), '#9bb97a', .95, 6);
  lighthouse(300, 302);
  for (const b of [[760, 548, 1, '#b8473a'], [1010, 506, .6, '#2f5d7a']]) if (SK) boat(...b);
  fill([0, 770, SW, 770, SW, 852, 0, 852], '#c9a174'); fill([0, 852, SW, 852, SW, 900, 0, 900], '#8c6746');
  if (!SK) { for (let x = -40; x < SW; x += 84) line(x, 852, x + 30, 770, 2, '#7a5636', .35); for (let i = 0; i < 90; i++) dab(R() * SW, 776 + R() * 70, 30 + R() * 80, 3, 0, R() < .5 ? '#e2bf93' : '#a37c52', .25); rect(0, 852, SW, 5, '#6d4d33', .5); }
  for (const x of [470, 1040]) { wc([x - 15, 800, x + 15, 800, x + 13, 752, x - 13, 752], '#4a4f5c', 1, x); wc(ring(x, 752, 19, 8, 12), '#5b6170', 1, x + 1); }
  for (const [x, c] of [[52, '#3f8aa3'], [92, '#e8a13c']]) { fill([x - 17, 838, x + 17, 838, x + 14, 806, x - 14, 806], '#d9d4c8'); fill(ring(x, 806, 14, 5, 12), c); }
}
const BLOTS = (() => { const R = rng(31), o = []; for (let i = 0; i < 70; i++) o.push([R() * 1700, R() * 900, 10 + R() * 30, R() * 80]); return o; })();
const edgeX = (E, y, u) => E + vn(y * .011, u * .5) * 40 + vn(y * .045, 7) * 12 - (850 - y) * .16;

function tone(t, f, v, dur, type = 'sine', att = .006, f2 = 0) {

}

const SFX = [];
(() => {
  const at = (t, fn) => SFX.push([t, fn]), swish = (v = .06, d = .5) => t => noise(t, v, d, 700, 2600), pop = f => t => { tone(t, f, .12, .16, 'sine', .004, f * 1.9); noise(t, .04, .06, 3000, 5000, 3); };
  for (let i = 0; i < 6; i++) at(i * SCN + .02, t => noise(t, .1, .85, 400, 3000, .8));
  for (let b = 2; b < 12; b++) at(b * BEAT + .05, swish(.05, .55));

  at(18.05, t => { tone(t, 110, .5, .3, 'sine', .004, 46); noise(t, .12, .12, 300, 120, .7); });
  for (let k = 0; k < 18; k++) at(21 + k * STEP, t => tone(t, mf(PENT[(k * 3) % 8 + 2] + 12), .04, .5));
  at(26.95, t => noise(t, .1, .95, 500, 5000, 1.5)); at(28, t => { tone(t, mf(88), .12, 2.2); tone(t, mf(93), .06, 2.2); });
  for (let i = 0; i < 6; i++) at(30 + field.ft(i), t => { for (let k = 0; k < 3; k++) tone(t + k * .09, mf([72, 76, 79][k] + (i % 3) * 2), .09, .3, 'triangle'); noise(t, .04, .5, 500, 1800); });
  for (const s of SPLAT) { at(40 + s[0] - .3, swish(.05, .25)); at(40 + s[0], t => { tone(t, 560, .22, .2, 'sine', .004, 170); noise(t, .05, .12, 1800, 700, 2); }); }

function sched() {

// ================================================================ controls
function toggle() {

  paused = !paused; if (AC) paused ? AC.suspend() : AC.resume(); schedAT = AT;

cv.addEventListener('click', toggle);
addEventListener('keydown', e => {
