<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>carrier wave</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block;width:100%;height:100%}</style>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const RAMP = ' .:-=+*#%@';
let W, H, cell, cols, rows;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.width = Math.max(1, innerWidth * dpr);
  H = canvas.height = Math.max(1, innerHeight * dpr);
  cell = Math.max(9 * dpr, Math.max(W, H) / 110);
  cols = Math.ceil(W / (cell * 0.62));
  rows = Math.ceil(H / cell);
}

function frame(ms) {
  const t = ms / 1000;
  // Three wave sources wandering on slow loops, in grid units.
  const sources = [0, 1, 2].map((i) => ({
    x: cols * (0.5 + 0.38 * Math.cos(t * (0.11 + i * 0.05) + i * 2.1)),
    y: rows * (0.5 + 0.38 * Math.sin(t * (0.14 + i * 0.04) + i * 1.3)),
  }));
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  ctx.font = `${cell}px ui-monospace, Menlo, Consolas, monospace`;
  ctx.textBaseline = 'top';
  const cw = cell * 0.62;
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      let v = 0;
      for (const s of sources) v += Math.sin(Math.hypot((x - s.x) * 0.62, y - s.y) * 0.55 - t * 2.2);
      const level = (v / 3 + 1) / 2; // 0..1
      const ch = RAMP[Math.min(RAMP.length - 1, Math.floor(level * RAMP.length))];
      if (ch === ' ') continue;
      ctx.fillStyle = level > 0.86 ? '#ff4fd8' : `rgba(255,255,255,${0.25 + level * 0.6})`;
      ctx.fillText(ch, x * cw, y * cell);
    }
  }
  requestAnimationFrame(frame);
}

addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);
</script>
</html>
