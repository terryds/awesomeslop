<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>joyride, 6 p.m.</title>
<style>
  html,body{margin:0;height:100%;background:#0b0d14;overflow:hidden}
  canvas#c{display:block;width:100%;height:100%;cursor:pointer}
  #vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.42) 100%)}
  #hud{position:fixed;inset:0;pointer-events:none;color:#fff;font:12px ui-monospace,Menlo,Consolas,monospace;text-shadow:0 1px 6px rgba(0,0,0,.8)}
  #hint{position:absolute;left:0;right:0;bottom:12%;text-align:center;transition:opacity .6s}
  #hint b{display:block;font:500 22px Georgia,serif;letter-spacing:.02em;margin-bottom:6px}
  #map{position:absolute;left:18px;bottom:18px;width:170px;height:170px;border-radius:50%;border:2px solid rgba(255,255,255,.55);opacity:0;transition:opacity .6s}
  #dash{position:absolute;right:22px;bottom:20px;text-align:right;opacity:0;transition:opacity .6s}
  #speed{font:600 44px ui-monospace,Menlo,monospace;line-height:1}
  #street{position:absolute;right:22px;top:16px;text-align:right;opacity:0;transition:opacity .6s;font-size:13px}
  #keys{position:absolute;left:206px;bottom:20px;opacity:0;transition:opacity .6s}
  .driving #hint{opacity:0}.driving #map,.driving #dash,.driving #street{opacity:1}.driving #keys{opacity:.7}
  @media (max-width:560px),(max-height:320px){#hud,#vig{display:none}}
</style>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="hud">
  <div id="hint"><b>click to drive</b>W A S D · space handbrake · C camera · T day / night · R reset · M sound</div>
  <canvas id="map" width="340" height="340"></canvas>
  <div id="keys">W A S D · space · C camera · T time · R reset · M sound</div>
  <div id="street"></div>
  <div id="dash"><div id="speed">0</div>km/h</div>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---------- helpers ----------
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
let seed = 20261114;
const rnd = () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const pick = (a) => a[(rnd() * a.length) | 0];
const query = new URLSearchParams(location.search);
const lite = innerWidth < 560 || query.has('thumb'); // gallery previews and small frames: no bloom, cheaper shadows

// ---------- the city plan: a grid of N x N blocks with a road between every pair ----------
const N = 7, BLOCK = 64, ROAD = 16, PITCH = BLOCK + ROAD, HALF = (N * PITCH + ROAD) / 2; // metres
const roadAt = (i) => -HALF + ROAD / 2 + i * PITCH; // centre line of road i (0..N)
const blockAt = (i) => -HALF + ROAD + BLOCK / 2 + i * PITCH; // centre of block i (0..N-1)
const AVENUES = ['Calder', 'Mirasol', 'Juniper', 'Vantage', 'Orchid', 'Larkspur', 'Tidewater', 'Sable'].map((n) => n + ' Ave'); // run north-south
const STREETS = ['1st', '2nd', '3rd', '4th', '5th', '6th', '7th', '8th'].map((n) => n + ' St'); // run east-west
const BAY = 3.2, STOREY = 3.3; // one window bay, one floor
const solids = []; // [cx, cz, halfW, halfD] things a car cannot drive through

// ---------- renderer ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: lite, powerPreference: 'high-performance' });
let pixelRatio = Math.min(window.devicePixelRatio || 1, lite ? 1 : 1.5, 2200 / innerWidth); // never draw more than about 2200 pixels across
renderer.setPixelRatio(pixelRatio);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xf3cfa4, 0.0011);
const camera = new THREE.PerspectiveCamera(60, 1, 0.3, 9000);
const maxAniso = renderer.capabilities.getMaxAnisotropy();

function canvasTexture(w, h, draw, repeat = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = maxAniso;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
const speckle = (g, w, h, n, colors, size = 2, alpha = 0.25) => { for (let i = 0; i < n; i++) { g.fillStyle = pick(colors); g.globalAlpha = rnd() * alpha; g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * size, 1 + rnd() * size); } g.globalAlpha = 1; };

// ---------- time of day: everything blends between two looks by `night` (0 golden hour, 1 night) ----------
const PAL = {
  zenith: ['#3676d2', '#04060f'], horizon: ['#ffd9a6', '#2b2233'], sun: ['#ffcf8f', '#000000'],
  cloudLit: ['#fff0d8', '#3a3550'], cloudShade: ['#c98f86', '#131226'],
  hemiSky: ['#bcd4ff', '#3a4a78'], hemiGround: ['#8a7660', '#2a2630'], light: ['#ffd2a0', '#8fa8ff'],
  deep: ['#11406a', '#040a14'], shallow: ['#3aa0a8', '#0d2b3a'], lamp: ['#d8d4c8', '#ffffff'],
};
const pal = {};
for (const k in PAL) pal[k] = { a: new THREE.Color(PAL[k][0]), b: new THREE.Color(PAL[k][1]), c: new THREE.Color() };
const sunDir = new THREE.Vector3(-0.66, 0.5, 0.36).normalize(); // in the west, over the sea, low enough for long shadows
const U = {
  uTime: { value: 0 }, uNight: { value: 0 }, uFogDensity: { value: 0.0011 },
  uZenith: { value: pal.zenith.c }, uHorizon: { value: pal.horizon.c }, uSunCol: { value: pal.sun.c }, uSunDir: { value: sunDir },
  uCloudLit: { value: pal.cloudLit.c }, uCloudShade: { value: pal.cloudShade.c },
};
const hemi = new THREE.HemisphereLight(0xffffff, 0x000000, 1);
const sun = new THREE.DirectionalLight(0xffffff, 3.4);
sun.castShadow = true;
sun.shadow.mapSize.setScalar(lite ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -120, right: 120, top: 120, bottom: -120, near: 1, far: 520 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.5;
scene.add(hemi, sun, sun.target);

const GLSL_NOISE = `
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float noise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
  return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y); }
float fbm(vec2 p){ float a = .5, s = 0.; for(int i = 0; i < 5; i++){ s += a*noise(p); p *= 2.03; a *= .5; } return s; }`;
const GLSL_SKY = `
uniform vec3 uZenith, uHorizon, uSunCol, uSunDir;
vec3 skyBase(vec3 d){
  vec3 c = mix(uHorizon, uZenith, pow(max(d.y, 0.), .5));
  return c + uSunCol * pow(max(dot(d, uSunDir), 0.), 8.) * .5;
}`;
const GLSL_OUT = `#include <tonemapping_fragment>\n#include <colorspace_fragment>`;

// ---------- sky ----------
const skyMaterial = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false, uniforms: U,
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
  fragmentShader: `
    varying vec3 vDir; uniform float uTime, uNight; uniform vec3 uCloudLit, uCloudShade;
    ${GLSL_NOISE} ${GLSL_SKY}
    void main(){
      vec3 d = normalize(vDir);
      vec3 col = skyBase(d);
      float s = max(dot(d, uSunDir), 0.);
      col += uSunCol * (smoothstep(.9994, .9997, s) * 8. + pow(s, 160.) * 1.2);
      vec2 cuv = d.xz / (d.y + .25) * 1.4 + vec2(uTime * .004, 0.);
      float cover = smoothstep(.5, .62, fbm(cuv * 1.2)) * smoothstep(.0, .22, d.y);
      vec3 cloud = mix(uCloudShade, uCloudLit, smoothstep(.48, .72, fbm(cuv * 1.2 + uSunDir.xz * .1)) * (.5 + .5 * pow(s, 2.)));
      vec3 sp = d * 170., cell = floor(sp);
      float h = fract(sin(dot(cell, vec3(12.9898, 78.233, 37.719))) * 43758.5453);
      col += vec3(.85, .9, 1.) * step(.994, h) * smoothstep(.42, .05, length(fract(sp) - .5)) * smoothstep(.05, .4, d.y) * uNight * 1.4;
      col = mix(col, cloud, cover * .88);
      gl_FragColor = vec4(col, 1.);
      ${GLSL_OUT}
    }`,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(4000, 32, 16), skyMaterial);
sky.frustumCulled = false; sky.renderOrder = -10;
scene.add(sky);

// ---------- ground: one big painted texture holds every lane line, crossing, manhole and skid mark ----------
const SPAN = 640, PX = 4096 / SPAN;
const groundTex = canvasTexture(4096, 4096, (g, w, h) => {
  const m = (v) => (v + SPAN / 2) * PX;
  g.fillStyle = '#7d7257'; g.fillRect(0, 0, w, h); // dry ground outside the city
  speckle(g, w, h, 30000, ['#6a6048', '#8c8266', '#5c5440'], 6, 0.5);
  g.fillStyle = '#2c2c30'; g.fillRect(m(-HALF), m(-HALF), 2 * HALF * PX, 2 * HALF * PX); // asphalt
  for (let i = 0; i < 500; i++) { g.fillStyle = rnd() < 0.5 ? '#000' : '#777'; g.globalAlpha = 0.03 + rnd() * 0.06; g.fillRect(m(-HALF + rnd() * 2 * HALF), m(-HALF + rnd() * 2 * HALF), 20 + rnd() * 240, 20 + rnd() * 240); }
  g.globalAlpha = 1;
  speckle(g, w, h, 90000, ['#55555a', '#1c1c1f', '#6b6b70', '#3a3a3f'], 2, 0.5);
  // rect(axis, along0, along1, cross0, cross1): a rectangle on a road; axis 'z' roads run north-south
  for (let i = 0; i <= N; i++) for (const axis of ['z', 'x']) {
    const c = roadAt(i), rect = (a0, a1, c0, c1, color, alpha = 1) => {
      g.fillStyle = color; g.globalAlpha = alpha;
      axis === 'z' ? g.fillRect(m(c + c0), m(a0), (c1 - c0) * PX, (a1 - a0) * PX) : g.fillRect(m(a0), m(c + c0), (a1 - a0) * PX, (c1 - c0) * PX);
    };
    for (const lane of [-5.4, -1.8, 1.8, 5.4]) rect(-HALF, HALF, lane - 0.9, lane + 0.9, '#000', 0.1); // tyre wear down each lane
    for (let k = 0; k < N; k++) {
      const a0 = roadAt(k) + ROAD / 2 + 4.6, a1 = roadAt(k + 1) - ROAD / 2 - 4.6;
      rect(a0, a1, -0.27, -0.13, '#d9b233', 0.9); rect(a0, a1, 0.13, 0.27, '#d9b233', 0.9); // double yellow
      for (let a = a0; a < a1 - 3; a += 8) { rect(a, a + 3, -3.67, -3.53, '#e9e9e2', 0.85); rect(a, a + 3, 3.53, 3.67, '#e9e9e2', 0.85); } // lane dashes
      rect(a0, a1, -7.3, -7.18, '#e9e9e2', 0.45); rect(a0, a1, 7.18, 7.3, '#e9e9e2', 0.45);
      for (const end of [a0, a1]) {
        const dir = end === a0 ? -1 : 1;
        rect(Math.min(end, end + dir * 0.45), Math.max(end, end + dir * 0.45), -7.2, 7.2, '#e9e9e2', 0.85); // stop line
        for (let s = -7; s < 7; s += 1.15) rect(Math.min(end + dir * 0.9, end + dir * 3.9), Math.max(end + dir * 0.9, end + dir * 3.9), s, s + 0.6, '#e9e9e2', 0.8); // zebra crossing
      }
      for (let n = 0; n < 2; n++) { // manhole covers
        const a = lerp(a0, a1, rnd()), cr = pick([-5.4, -1.8, 1.8, 5.4]), x = axis === 'z' ? m(c + cr) : m(a), y = axis === 'z' ? m(a) : m(c + cr);
        g.globalAlpha = 0.9; g.fillStyle = '#1b1b1e'; g.beginPath(); g.arc(x, y, 0.42 * PX, 0, 6.2832); g.fill();
        g.strokeStyle = '#4a4a50'; g.lineWidth = 1.5; g.beginPath(); g.arc(x, y, 0.3 * PX, 0, 6.2832); g.stroke();
      }
    }
  }
  g.globalAlpha = 1;
  for (let i = 0; i < 260; i++) { // skid marks and tar repairs
    const x = m(-HALF + rnd() * 2 * HALF), y = m(-HALF + rnd() * 2 * HALF), a = rnd() * 6.28, l = 20 + rnd() * 90;
    g.strokeStyle = '#0c0c0e'; g.globalAlpha = 0.12 + rnd() * 0.25; g.lineWidth = 1 + rnd() * 2.5;
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a) * l * 0.5 + (rnd() - 0.5) * 30, y + Math.sin(a) * l * 0.5 + (rnd() - 0.5) * 30, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  g.globalAlpha = 1;
}, false);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(SPAN, SPAN).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ map: groundTex, roughness: 0.9, metalness: 0 }));
ground.receiveShadow = true;
scene.add(ground);
const outer = new THREE.Mesh(new THREE.PlaneGeometry(9000, 9000).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: '#7d7257', roughness: 1 }));
outer.position.y = -0.06; scene.add(outer);
const beach = new THREE.Mesh(new THREE.PlaneGeometry(260, 9000).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: '#d8c59a', roughness: 1 }));
beach.position.set(-HALF - 150, -0.04, 0); scene.add(beach);

// sea to the west
const sea = new THREE.Mesh(new THREE.PlaneGeometry(7000, 9000).rotateX(-Math.PI / 2), new THREE.ShaderMaterial({
  fog: false, uniforms: { ...U, uDeep: { value: pal.deep.c }, uShallow: { value: pal.shallow.c } },
  vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position, 1.); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `
    varying vec3 vW; uniform float uTime, uFogDensity; uniform vec3 uDeep, uShallow;
    ${GLSL_NOISE} ${GLSL_SKY}
    void main(){
      vec2 p = vW.xz; float t = uTime;
      vec3 toCam = cameraPosition - vW; float dist = length(toCam); vec3 V = toCam / dist;
      vec2 g = vec2(0.);
      #define WAVE(d, f, a, s) g += d * f * a * cos(dot(p, d) * f + t * s);
      WAVE(vec2(.8, .6), .3, .08, 1.1) WAVE(vec2(-.5, .86), .55, .05, 1.4) WAVE(vec2(.2, -.98), 1.2, .025, 2.)
      g += (vec2(noise(p * 1.5 + t * .6), noise(p * 1.5 - t * .5 + 40.)) - .5) * .2;
      g /= 1. + dist * .01;
      vec3 n = normalize(vec3(-g.x, 1., -g.y));
      vec3 R = reflect(-V, n); R.y = abs(R.y);
      float fres = pow(1. - max(dot(n, V), 0.), 4.);
      float shore = smoothstep(${(-HALF - 520).toFixed(1)}, ${(-HALF - 280).toFixed(1)}, vW.x);
      vec3 col = mix(mix(uDeep, uShallow, shore), skyBase(R), .12 + fres * .8);
      col += uSunCol * pow(max(dot(R, uSunDir), 0.), 220.) * 5.;
      float surf = smoothstep(.6, .9, shore + sin(vW.z * .05 + t * .6 + noise(p * .05) * 6.) * .08) * noise(p * 1.2 + t * .3);
      col = mix(col, vec3(1.), surf * .6);
      col = mix(col, skyBase(vec3(-V.x, 0., -V.z)), 1. - exp(-pow(dist * uFogDensity, 2.)));
      gl_FragColor = vec4(col, 1.);
      ${GLSL_OUT}
    }`,
}));
sea.position.set(-HALF - 280 - 3500, -0.5, 0);
scene.add(sea);

// hills behind the city, faded by the haze
{
  const mat = new THREE.MeshStandardMaterial({ color: '#5d6a58', flatShading: true, roughness: 1 });
  for (let i = 0; i < 22; i++) {
    const a = -0.5 + (i / 21) * 3.2 + rnd() * 0.1, d = 900 + rnd() * 420, r = 260 + rnd() * 320, hill = new THREE.Mesh(new THREE.ConeGeometry(r, 110 + rnd() * 260, 7, 2), mat);
    hill.position.set(Math.cos(a) * d + 150, 40, -Math.sin(a) * d); hill.rotation.y = rnd() * 6; hill.scale.z = 1.4;
    scene.add(hill);
  }
}

// ---------- small parts: every pole, kerb, awning and rooftop unit is one box in one instanced mesh ----------
const boxes = [], glowBoxes = [];
const box = (x, y, z, sx, sy, sz, color, rot = 0) => boxes.push([x, y, z, sx, sy, sz, rot, color]);
const glowBox = (x, y, z, sx, sy, sz) => glowBoxes.push([x, y, z, sx, sy, sz, 0, '#ffffff']);
const pools = []; // light on the road under each street lamp, at night

// ---------- facades: a few hand-drawn window textures, tiled over every building ----------
const CELLS = 8, CELL = 128; // one texture tile = 8 bays x 8 floors
function facadeMaterial(kind, tint) {
  const lit = [];
  const map = canvasTexture(CELLS * CELL, CELLS * CELL, (g, w, h) => {
    const wall = { glassBlue: '#1b232c', glassAmber: '#2a2218', office: '#b7b1a6', apart: '#d7b189', brick: '#8b4b3b', white: '#e6e3dc' }[kind];
    g.fillStyle = wall; g.fillRect(0, 0, w, h);
    if (kind === 'brick') { g.strokeStyle = 'rgba(40,18,12,.45)'; g.lineWidth = 1; for (let y = 0; y < h; y += 8) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); for (let x = (y / 8) % 2 ? 0 : 12; x < w; x += 24) { g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + 8); g.stroke(); } } }
    if (kind === 'office' || kind === 'apart' || kind === 'white') speckle(g, w, h, 9000, ['#000', '#fff', '#6b5a48'], 3, 0.07);
    for (let r = 0; r < CELLS; r++) for (let c = 0; c < CELLS; c++) {
      const x = c * CELL, y = r * CELL, glass = kind.startsWith('glass');
      let wx = x + 22, wy = y + 24, ww = CELL - 44, wh = CELL - 52;
      if (glass) { wx = x + 4; wy = y + 4; ww = CELL - 8; wh = CELL - 30; }
      if (kind === 'white') { wx = x; ww = CELL; wy = y + 34; wh = 52; }
      if (kind === 'apart') { wx = x + 30; ww = CELL - 60; }
      const base = glass ? (kind === 'glassBlue' ? [70, 120, 160] : [150, 110, 60]) : [52, 78, 98], j = 0.75 + rnd() * 0.5;
      const gr = g.createLinearGradient(0, wy, 0, wy + wh);
      gr.addColorStop(0, `rgb(${base.map((v) => Math.min(255, v * j * 1.5) | 0)})`); gr.addColorStop(1, `rgb(${base.map((v) => (v * j * 0.55) | 0)})`);
      g.fillStyle = gr; g.fillRect(wx, wy, ww, wh);
      g.fillStyle = 'rgba(255,255,255,.12)'; g.beginPath(); g.moveTo(wx + ww * 0.15, wy + wh); g.lineTo(wx + ww * 0.45, wy); g.lineTo(wx + ww * 0.6, wy); g.lineTo(wx + ww * 0.3, wy + wh); g.fill(); // a streak of reflected sky
      if (!glass) {
        if (rnd() < 0.45) { g.fillStyle = pick(['rgba(230,222,205,.75)', 'rgba(120,130,140,.6)', 'rgba(190,150,120,.65)']); g.fillRect(wx, wy, ww, wh * (0.25 + rnd() * 0.5)); } // blinds, part drawn
        g.strokeStyle = kind === 'brick' ? '#efe9dc' : 'rgba(30,30,34,.8)'; g.lineWidth = 3; g.strokeRect(wx, wy, ww, wh);
        g.beginPath(); g.moveTo(wx + ww / 2, wy); g.lineTo(wx + ww / 2, wy + wh); g.stroke();
        g.fillStyle = 'rgba(0,0,0,.28)'; g.fillRect(wx - 4, wy + wh + 2, ww + 8, 5); // sill and its shadow
        if (rnd() < 0.25) { g.fillStyle = 'rgba(40,30,20,.12)'; g.fillRect(wx + rnd() * ww, wy + wh + 6, 4 + rnd() * 8, 30 + rnd() * 40); } // a rain stain
        if (kind === 'apart') { g.fillStyle = '#5a4a3c'; g.fillRect(x + 12, y + CELL - 22, CELL - 24, 5); g.strokeStyle = 'rgba(40,34,30,.9)'; g.lineWidth = 2; for (let k = x + 14; k < x + CELL - 12; k += 9) { g.beginPath(); g.moveTo(k, y + CELL - 44); g.lineTo(k, y + CELL - 22); g.stroke(); } g.strokeRect(x + 12, y + CELL - 46, CELL - 24, 2); if (rnd() < 0.3) { g.fillStyle = '#c9c9c4'; g.fillRect(wx + ww + 4, wy + wh - 16, 18, 14); } }
      } else { g.fillStyle = 'rgba(8,10,14,.85)'; g.fillRect(x, y + CELL - 26, CELL, 26); } // spandrel between floors
      if (rnd() < (glass ? 0.42 : 0.3)) lit.push([wx, wy, ww, wh, pick(['#ffd08a', '#ffe2b0', '#cfe6ff', '#ffb870']), 0.5 + rnd() * 0.5]);
    }
  });
  const emissiveMap = canvasTexture(CELLS * CELL, CELLS * CELL, (g, w, h) => {
    g.fillStyle = '#000'; g.fillRect(0, 0, w, h);
    for (const [x, y, ww, wh, c, a] of lit) { g.globalAlpha = a; g.fillStyle = c; g.fillRect(x + 2, y + 2, ww - 4, wh - 4); g.globalAlpha = a * 0.5; g.fillStyle = '#000'; g.fillRect(x + 2, y + wh * 0.6, ww - 4, wh * 0.4); }
    g.globalAlpha = 1;
  });
  const glass = kind.startsWith('glass');
  return new THREE.MeshStandardMaterial({ map, emissiveMap, emissive: 0xffffff, emissiveIntensity: 0, color: tint, roughness: glass ? 0.12 : 0.85, metalness: glass ? 0.9 : 0.05 });
}
const FACADES = {};

    const name = Math.abs(player.x) < HALF + 20 && Math.abs(player.z) < HALF + 20 ? `${AVENUES[nearest(player.x)]} · ${STREETS[nearest(player.z)]}` : 'out of town';
    if (name !== shownStreet) streetEl.textContent = shownStreet = name;
    if (engine) { engine.frequency.setTargetAtTime(48 + Math.abs(vf) * 3.4, audio.currentTime, 0.05); engineGain.gain.setTargetAtTime(0.12 + Math.min(Math.abs(vf), 40) * 0.006, audio.currentTime, 0.1); }
  }
  composer ? composer.render() : renderer.render(scene, camera);

  slow = lerp(slow, dt, 0.05);
  if (++frames % 90 === 0 && slow > 0.026 && pixelRatio > 0.7) { pixelRatio *= 0.85; renderer.setPixelRatio(pixelRatio); resize(); } // drop resolution a step if frames are slow
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
