<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>look closer</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1612; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #hint {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    font: 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .04em;
    color: #fff3d2; background: rgba(27, 22, 18, .66); padding: 9px 13px; border-radius: 999px;
    pointer-events: none; transition: opacity .6s; white-space: nowrap;
  }
  #hint.off { opacity: 0; }
  #load { position: fixed; inset: 0; display: grid; place-items: center; color: #e9dcc0;
    font: italic 16px/1.4 Georgia, serif; letter-spacing: .03em; transition: opacity .6s; pointer-events: none; }
  #load.off { opacity: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="load">mixing the paint…</div>
<div id="hint">scroll or drag to walk in · space pauses</div>
<script>
// look closer: an endless zoom through five paintings, each one hanging, lying or glowing in the middle of the last.
// A room at night -> the painting on its wall is an autumn street -> the bakery window is a bakery -> the postcard on
// its wall is a frozen lake -> the hole in the ice is a reef -> the frame sunk in the sand is the room again.
// Every scene is drawn in code (shapes, then a brush-stroke pass that repaints it in short strokes), so nothing loads.

const S = 2048;            // each painting is S x S
const K = 3;               // each painting's window onto the next is 1/K of its side, in the middle
const H0 = (1 - 1 / K) / 2, H1 = 1 - H0;   // the hole: [H0, H1] in both axes

const qs = new URLSearchParams(location.search);
const THUMB = qs.has('thumb'), CAPTURE = qs.has('capture');
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const hint = document.getElementById('hint'), load = document.getElementById('load');
if (THUMB || CAPTURE) hint.remove();

// ---------- tiny helpers ----------
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mixc = (a, b, t) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`; };
function lin(g, x0, y0, x1, y1, stops) { const gr = g.createLinearGradient(x0, y0, x1, y1); stops.forEach(([t, c]) => gr.addColorStop(t, c)); return gr; }
function rad(g, x, y, r0, r1, stops) { const gr = g.createRadialGradient(x, y, r0, x, y, r1); stops.forEach(([t, c]) => gr.addColorStop(t, c)); return gr; }
function poly(g, pts, fill) { g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); g.fillStyle = fill; g.fill(); }
function rect(g, x, y, w, h, fill) { g.fillStyle = fill; g.fillRect(x, y, w, h); }
function ell(g, x, y, rx, ry, fill, rot = 0) { g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); g.fillStyle = fill; g.fill(); }
function blob(g, r, x, y, rad0, fill, n = 9) { g.beginPath(); for (let i = 0; i <= n * 4; i++) { const a = i / (n * 4) * Math.PI * 2, k = 1 + 0.12 * Math.sin(a * n + r() * 6) + (r() - .5) * .06; const px = x + Math.cos(a) * rad0 * k, py = y + Math.sin(a) * rad0 * k * .9; i ? g.lineTo(px, py) : g.moveTo(px, py); } g.closePath(); g.fillStyle = fill; g.fill(); }
function ridge(g, r, y, amp, freq, fill, base = 1) { g.beginPath(); g.moveTo(0, base); for (let x = 0; x <= 1.0001; x += 0.005) g.lineTo(x, y + amp * (Math.sin(x * freq + r() * 0.2) * .5 + Math.sin(x * freq * 2.3 + 1.7) * .3 + Math.sin(x * freq * 5.1) * .1)); g.lineTo(1, base); g.closePath(); g.fillStyle = fill; g.fill(); }
function glow(g, x, y, r, c, a) { g.save(); g.globalCompositeOperation = 'lighter'; g.fillStyle = rad(g, x, y, 0, r, [[0, `rgba(${hex(c)},${a})`], [1, `rgba(${hex(c)},0)`]]); g.fillRect(x - r, y - r, r * 2, r * 2); g.restore(); }

// ---------- the five paintings (normalized 0..1 coordinates; the hole is [H0,H1]²) ----------
// each returns { draw(g, r), frame(g, r), flow(x, y) -> stroke angle, stroke: [min, max] length in px }
const SCENES = [
  // 0 · a room at night, a painting on the wall
  { name: 'room', flow: (x, y) => (y > .74 ? 0.05 : Math.PI / 2 + Math.sin(x * 40) * .08),
    draw(g, r) {
      rect(g, 0, 0, 1, .74, lin(g, 0, 0, 0, .74, [[0, '#2f4a3e'], [1, '#3d5a48']]));              // green wallpaper
      for (let x = 0.02; x < 1; x += 0.055) rect(g, x, 0, .012, .74, 'rgba(232,206,150,0.10)');      // stripes
      rect(g, 0, .70, 1, .045, '#6b4a2e'); rect(g, 0, .70, 1, .008, '#a77a48');                      // skirting
      rect(g, 0, .745, 1, .255, lin(g, 0, .745, 0, 1, [[0, '#5a3a22'], [1, '#3a2414']]));            // floor
      for (let y = .76; y < 1; y += .035) rect(g, 0, y, 1, .004, 'rgba(20,10,4,.35)');
      ell(g, .5, .9, .36, .07, '#7a2e2a'); ell(g, .5, .9, .3, .052, '#9c4436'); ell(g, .5, .9, .2, .03, '#c9894e');   // rug
      // window on the left with the moon
      rect(g, .04, .12, .18, .36, '#17263f'); ell(g, .1, .2, .03, .03, '#f3e9c6'); glow(g, .1, .2, .09, '#f3e9c6', .25);
      for (let i = 0; i < 18; i++) ell(g, .05 + r() * .16, .14 + r() * .3, .002, .002, '#e8e2c8');
      rect(g, .04, .12, .18, .012, '#d9c49a'); rect(g, .04, .468, .18, .012, '#d9c49a'); rect(g, .04, .12, .01, .36, '#d9c49a'); rect(g, .21, .12, .01, .36, '#d9c49a'); rect(g, .125, .12, .008, .36, '#d9c49a'); rect(g, .04, .29, .18, .008, '#d9c49a');
      poly(g, [[.02, .1], [.08, .1], [.07, .55], [.0, .56]], '#8c2f2b'); poly(g, [[.18, .1], [.25, .1], [.27, .56], [.2, .55]], '#8c2f2b');   // curtains
      // armchair on the left
      blob(g, r, .17, .66, .12, '#7d3b2b', 7); rect(g, .07, .63, .2, .14, '#8f4632'); blob(g, r, .08, .66, .045, '#a0533a', 6); blob(g, r, .26, .66, .045, '#a0533a', 6);
      rect(g, .09, .77, .015, .05, '#3a2414'); rect(g, .24, .77, .015, .05, '#3a2414');
      // floor lamp + table on the right
      rect(g, .86, .3, .008, .48, '#2a1c12'); poly(g, [[.81, .3], [.92, .3], [.895, .2], [.835, .2]], '#e7c27a'); glow(g, .865, .3, .35, '#ffc66d', .45);
      ell(g, .78, .66, .07, .015, '#5c3a20'); rect(g, .775, .66, .01, .12, '#4a2e18'); ell(g, .79, .65, .014, .01, '#f2ead8'); rect(g, .77, .63, .02, .02, '#e9e0cc');
      // a sleeping cat on the rug
      ell(g, .66, .885, .05, .022, '#2b2522'); ell(g, .7, .875, .018, .016, '#2b2522'); poly(g, [[.69, .862], [.695, .848], [.702, .86]], '#2b2522'); poly(g, [[.705, .86], [.712, .847], [.716, .862]], '#2b2522');
      glow(g, .5, .5, .45, '#ffcf8a', .12);
    },
    frame(g, r) { goldFrame(g, .028); glow(g, .5, .5, .3, '#ffdca0', .06); } },
  // 1 · an autumn street at sunset, the bakery window
  { name: 'street', flow: (x, y) => (y < .2 ? 0.1 : Math.PI / 2 + Math.sin(y * 30) * .1),
    draw(g, r) {
      rect(g, 0, 0, 1, .3, lin(g, 0, 0, 0, .3, [[0, '#e9875c'], [1, '#f6c98a']]));                 // sky
      ell(g, .78, .2, .05, .05, '#ffe7a8'); glow(g, .78, .2, .2, '#ffd38a', .4);
      // houses either side, the bakery in the middle
      const house = (x, w, top, wall, roof) => { rect(g, x, top, w, .8 - top, wall); poly(g, [[x - .01, top], [x + w + .01, top], [x + w / 2, top - .08]], roof);
        for (let wy = top + .06; wy < .66; wy += .13) for (let wx = x + .03; wx < x + w - .06; wx += .08) { rect(g, wx, wy, .045, .07, '#2c3b4a'); rect(g, wx + .005, wy + .005, .035, .06, r() < .5 ? '#f2b85c' : '#36495a'); } };
      house(-.02, .25, .18, '#c9a47a', '#8a3b2a'); house(.77, .26, .14, '#b98b6a', '#6d3a2a');
      rect(g, .22, .06, .56, .76, '#e7d3ad'); poly(g, [[.2, .06], [.8, .06], [.5, -.06]], '#7a3326');    // bakery
      rect(g, .26, .1, .48, .1, '#5a2e22'); rect(g, .27, .11, .46, .08, '#7d3d2b');                     // sign board
      for (let i = 0; i < 8; i++) poly(g, [[.27 + i * .0575, .225], [.27 + (i + 1) * .0575, .225], [.27 + (i + 1) * .0575 - .006, .3], [.27 + i * .0575 + .006, .3]], i % 2 ? '#f2ead8' : '#b23a2e');   // awning
      for (let i = 0; i < 8; i++) ell(g, .27 + (i + .5) * .0575, .3, .029, .012, i % 2 ? '#f2ead8' : '#b23a2e');
      rect(g, .77 - .02, .5, .07, .3, '#4a2e22'); ell(g, .76, .63, .006, .006, '#d9b45a');           // door
      rect(g, 0, .8, 1, .2, lin(g, 0, .8, 0, 1, [[0, '#8a7a6a'], [1, '#5c4f44']]));                  // cobbles
      for (let i = 0; i < 260; i++) ell(g, r(), .81 + r() * .19, .012 + r() * .01, .006, r() < .5 ? '#9a8a78' : '#6c5e52');
      // trees and leaves
      for (const [tx, s] of [[.08, 1], [.93, .9]]) { rect(g, tx - .01, .5, .02, .32, '#4a2e1c'); for (let k = 0; k < 7; k++) blob(g, r, tx + (r() - .5) * .14 * s, .42 + (r() - .5) * .16 * s, .07 * s, ['#d9772e', '#e59a3a', '#b8452a', '#f0b84a'][k % 4], 7); }
      for (let i = 0; i < 70; i++) ell(g, r(), .78 + r() * .22, .006, .003, ['#d9772e', '#b8452a', '#f0b84a'][i % 3], r() * 3);
      rect(g, .19, .45, .008, .37, '#2a2420'); poly(g, [[.18, .45], [.206, .45], [.2, .41], [.186, .41]], '#f6d48a'); glow(g, .193, .43, .08, '#ffd38a', .5);   // lamp post
      glow(g, .5, .5, .25, '#ffcf80', .25);   // the window's warm light spills out
    },
    late(g) { g.fillStyle = '#f3d9a0'; g.font = 'bold 0.06px Georgia'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('BAKERY', .5, .152); },
    frame(g, r) { woodFrame(g, .022, '#5a2e22', '#8a4a30'); rect(g, H0 - .03, H1 + .015, (H1 - H0) + .06, .022, '#6a3a26');
      g.save(); g.globalAlpha = .08; rect(g, H0, H0, (H1 - H0) * .35, H1 - H0, '#ffffff'); g.restore(); } },
  // 2 · inside the bakery, a postcard pinned to the wall
  { name: 'bakery', flow: (x, y) => Math.sin(x * 9 + y * 7) * .6,
    draw(g, r) {
      rect(g, 0, 0, 1, .7, lin(g, 0, 0, 0, .7, [[0, '#e9d2a6'], [1, '#d9b98a']]));                  // wall
      for (let y = .04; y < .7; y += .06) for (let x = (y * 50 | 0) % 2 ? 0 : .04; x < 1; x += .08) rect(g, x, y, .075, .055, 'rgba(255,240,210,.18)');   // tiles
      // shelves left and right with bread
      for (const sx of [.02, .72]) for (const sy of [.22, .4, .58]) { rect(g, sx, sy, .26, .018, '#7a4a2a');
        for (let i = 0; i < 4; i++) { const bx = sx + .035 + i * .062, c = ['#c98a3e', '#b8732e', '#d9a052', '#a86428'][(i + (sy * 10 | 0)) % 4];
          ell(g, bx, sy - .028, .028, .026, c); for (let k = -1; k <= 1; k++) rect(g, bx + k * .01 - .002, sy - .045, .004, .02, 'rgba(250,225,170,.6)'); } }
      // hanging lamps
      for (const lx of [.2, .8]) { rect(g, lx - .002, 0, .004, .1, '#3a2a1e'); poly(g, [[lx - .05, .14], [lx + .05, .14], [lx + .02, .1], [lx - .02, .1]], '#2f5a52'); glow(g, lx, .16, .2, '#ffd38a', .45); }
      // counter with a glass case of pastries
      rect(g, 0, .7, 1, .3, lin(g, 0, .7, 0, 1, [[0, '#8a5a34'], [1, '#5a3820']]));
      rect(g, .05, .72, .9, .12, 'rgba(220,240,240,.25)'); rect(g, .05, .72, .9, .006, '#f2ead8');
      for (let i = 0; i < 14; i++) { const px = .09 + i * .062; ell(g, px, .8, .024, .018, ['#e6b05a', '#c9502e', '#f2d9a0', '#7a3b22'][i % 4]); ell(g, px, .79, .012, .006, 'rgba(255,245,220,.6)'); }
      rect(g, .46, .58, .08, .07, '#c9c2b0'); ell(g, .5, .58, .045, .012, '#9a9488');   // till bell / scale
      // string of bunting
      for (let i = 0; i < 12; i++) poly(g, [[.04 + i * .08, .05], [.12 + i * .08, .05], [.08 + i * .08, .1]], ['#b23a2e', '#2f6f86', '#e0a53a'][i % 3]);
      glow(g, .5, .5, .3, '#fff0c8', .08);
    },
    frame(g, r) { // a postcard: cream border, a pin, a little shadow
      g.save(); g.fillStyle = 'rgba(60,35,15,.35)'; g.fillRect(H0 - .02 + .012, H0 - .02 + .016, (H1 - H0) + .04, (H1 - H0) + .055); g.restore();
      holeBorder(g, .02, '#f6efdf', .035); g.fillStyle = '#7a5a40'; g.font = 'italic 0.018px Georgia'; g.textAlign = 'center'; g.fillText('greetings from the lake', .5, H1 + .032);
      ell(g, .5, H0 - .01, .012, .012, '#c23a2e'); ell(g, .497, H0 - .013, .004, .004, '#f2a090'); } },
  // 3 · a frozen lake at blue hour, a square hole cut in the ice
  { name: 'lake', flow: (x, y) => (y < .3 ? 0.15 : 0.02),
    draw(g, r) {
      rect(g, 0, 0, 1, .32, lin(g, 0, 0, 0, .32, [[0, '#26345e'], [.6, '#6a6fa0'], [1, '#e7a8a0']]));
      for (let i = 0; i < 40; i++) ell(g, r(), r() * .15, .0015, .0015, '#f2eedd');
      ridge(g, r, .2, .07, 9, '#8a93bd', .32); ridge(g, r, .24, .05, 13, '#5c648f', .32);
      for (let i = 0; i < 6; i++) poly(g, [[.1 + i * .17, .18], [.06 + i * .17, .26], [.14 + i * .17, .26]], '#eef0fa');   // snowy peaks
      for (let i = 0; i < 46; i++) { const px = r(), h = .04 + r() * .05, by = .3 + r() * .03; poly(g, [[px, by - h], [px - h * .35, by], [px + h * .35, by]], r() < .5 ? '#1f3a3a' : '#2a4a44'); }  // pines
      rect(g, 0, .32, 1, .68, lin(g, 0, .32, 0, 1, [[0, '#bcc6e2'], [1, '#e8ecf6']]));               // ice
      for (let i = 0; i < 40; i++) { g.strokeStyle = 'rgba(120,135,180,.35)'; g.lineWidth = .002; g.beginPath(); const x = r(), y = .34 + r() * .66; g.moveTo(x, y); g.lineTo(x + (r() - .5) * .2, y + (r() - .5) * .05); g.stroke(); }
      // the cabin on the shore with a lit window, smoke
      rect(g, .78, .24, .12, .08, '#5a3424'); poly(g, [[.77, .24], [.91, .24], [.84, .19]], '#e9ecf6'); rect(g, .81, .27, .025, .025, '#ffc66d'); glow(g, .822, .28, .08, '#ffb84d', .6);
      for (let i = 0; i < 5; i++) ell(g, .87 + i * .01, .17 - i * .02, .01 + i * .003, .008, 'rgba(230,230,240,.5)');
      // an ice-fishing stool and a rod beside the hole
      rect(g, .74, .6, .06, .012, '#7a4a2a'); rect(g, .745, .612, .008, .05, '#5a3420'); rect(g, .787, .612, .008, .05, '#5a3420');
      g.strokeStyle = '#3a2a1e'; g.lineWidth = .004; g.beginPath(); g.moveTo(.72, .66); g.lineTo(.6, .45); g.stroke();
      g.strokeStyle = 'rgba(40,40,40,.6)'; g.lineWidth = .0012; g.beginPath(); g.moveTo(.6, .45); g.lineTo(.58, .55); g.stroke();
      rect(g, .2, .64, .05, .05, '#c23a2e'); rect(g, .2, .64, .05, .01, '#e9e0cc');   // a little red bucket
      glow(g, .5, .9, .4, '#ffffff', .1);
    },
    frame(g, r) { // the hole's thick ice rim, lit on top, with chunks
      holeBorder(g, .03, '#e2e8f6', 0); g.save(); g.fillStyle = 'rgba(80,100,150,.35)'; g.fillRect(H0, H0, H1 - H0, .02); g.fillRect(H0, H0, .015, H1 - H0); g.restore();
      for (let i = 0; i < 14; i++) { const a = r() * 4 | 0, t = H0 + r() * (H1 - H0), o = .035 + r() * .03; const [x, y] = [[t, H0 - o], [t, H1 + o], [H0 - o, t], [H1 + o, t]][a]; poly(g, [[x - .012, y], [x, y - .01], [x + .014, y + .002], [x, y + .011]], '#f4f7fc'); } } },
  // 4 · a reef, a gilded frame sunk in the sand
  { name: 'reef', flow: (x, y) => Math.PI / 2 + Math.sin(x * 14) * .35,
    draw(g, r) {
      rect(g, 0, 0, 1, 1, lin(g, 0, 0, 0, 1, [[0, '#3fb0c4'], [.5, '#1f7a96'], [1, '#164f6a']]));
      g.save(); g.globalCompositeOperation = 'lighter'; for (let i = 0; i < 7; i++) { const x = .1 + i * .14; poly(g, [[x, 0], [x + .05, 0], [x + .2, 1], [x + .08, 1]], 'rgba(200,240,255,.06)'); } g.restore();
      rect(g, 0, .78, 1, .22, lin(g, 0, .78, 0, 1, [[0, '#d9c290'], [1, '#b89c6a']])); ridge(g, r, .78, .02, 11, '#d9c290', 1);
      const coral = (x, y, s, c) => { for (let k = 0; k < 6; k++) blob(g, r, x + (r() - .5) * .08 * s, y - r() * .1 * s, .035 * s, c, 6); };
      coral(.1, .8, 1.4, '#e2645a'); coral(.22, .82, 1, '#f0a04a'); coral(.82, .8, 1.5, '#c2508a'); coral(.92, .84, 1, '#e2645a'); coral(.7, .85, .8, '#7a5ab0');
      for (const kx of [.04, .3, .66, .97]) for (let k = 0; k < 3; k++) { g.strokeStyle = '#3f8a52'; g.lineWidth = .008; g.beginPath(); g.moveTo(kx + k * .01, .86); g.bezierCurveTo(kx - .04, .7, kx + .05, .6, kx + k * .02, .45 + r() * .1); g.stroke(); }
      const fish = (x, y, s, c, dir = 1) => { ell(g, x, y, .03 * s, .014 * s, c); poly(g, [[x - dir * .028 * s, y], [x - dir * .045 * s, y - .012 * s], [x - dir * .045 * s, y + .012 * s]], c); ell(g, x + dir * .016 * s, y - .003 * s, .003 * s, .003 * s, '#101820'); rect(g, x - .004 * s, y - .013 * s, .006 * s, .026 * s, 'rgba(255,255,255,.5)'); };
      fish(.18, .25, 1.2, '#f28a2e'); fish(.25, .3, .8, '#f28a2e'); fish(.83, .3, 1, '#f2d03a', -1); fish(.78, .62, 1.3, '#5ac0e0', -1); fish(.12, .6, .9, '#f2d03a');
      for (let i = 0; i < 40; i++) { const x = .55 + r() * .4, y = r() * .7; ell(g, x, y, .004 + r() * .004, .004 + r() * .004, 'rgba(230,250,255,.4)'); }
      ell(g, .38, .9, .03, .012, '#f2e2c8'); poly(g, [[.62, .9], [.65, .88], [.68, .9], [.65, .91]], '#e07a5a');   // shell, starfish-ish
    },
    frame(g, r) { goldFrame(g, .03); g.save(); g.fillStyle = 'rgba(200,180,120,.9)'; for (let i = 0; i < 9; i++) ell(g, H0 - .03 + r() * (H1 - H0 + .06), H1 + .03, .03, .012, '#d9c290'); g.restore();
      ell(g, H1 + .03, H0 - .05, .006, .006, 'rgba(230,250,255,.6)'); ell(g, H1 + .04, H0 - .08, .004, .004, 'rgba(230,250,255,.6)'); } },
];

// frames drawn around the hole, on top of the next painting
function holeBorder(g, w, c, round) { g.fillStyle = c; g.fillRect(H0 - w, H0 - w, (H1 - H0) + 2 * w, w); g.fillRect(H0 - w, H1, (H1 - H0) + 2 * w, w + round); g.fillRect(H0 - w, H0, w, H1 - H0); g.fillRect(H1, H0, w, H1 - H0); }
function goldFrame(g, w) {
  holeBorder(g, w, '#8a6424', 0); holeBorder(g, w * .7, '#c8962e', 0); holeBorder(g, w * .35, '#e8c46a', 0); holeBorder(g, w * .12, '#6a4a1a', 0);
  for (const [x, y] of [[H0 - w * .5, H0 - w * .5], [H1 + w * .5, H0 - w * .5], [H0 - w * .5, H1 + w * .5], [H1 + w * .5, H1 + w * .5]]) ell(g, x, y, w * .7, w * .7, '#e8c46a');
}
function woodFrame(g, w, a, b) { holeBorder(g, w, a, 0); holeBorder(g, w * .5, b, 0); g.fillStyle = a; g.fillRect(.5 - .004, H0, .008, H1 - H0); g.fillRect(H0, .5 - .004, H1 - H0, .008); }

// ---------- paint one scene: shapes, then a pass of short brush strokes, then cut the hole and lay the frame ----------
function paint(i) {
  const sc = SCENES[i], r = rng(101 + i * 7919);
  const base = document.createElement('canvas'); base.width = base.height = S;
  const g = base.getContext('2d'); g.scale(S, S); sc.draw(g, r);
  const px = g.getImageData(0, 0, S, S).data;
  const out = document.createElement('canvas'); out.width = out.height = S;
  const o = out.getContext('2d'); o.drawImage(base, 0, 0);
  o.lineCap = 'round';
  const n = 90000, rs = rng(7 + i);
  for (let k = 0; k < n; k++) {
    const x = rs() * S, y = rs() * S, idx = ((y | 0) * S + (x | 0)) * 4;
    const j = (rs() - .5) * 26, a = sc.flow(x / S, y / S) + (rs() - .5) * .5, len = 10 + rs() * 22;
    o.strokeStyle = `rgba(${Math.min(255, Math.max(0, px[idx] + j)) | 0},${Math.min(255, Math.max(0, px[idx + 1] + j)) | 0},${Math.min(255, Math.max(0, px[idx + 2] + j * 1.1)) | 0},.85)`;
    o.lineWidth = 3 + rs() * 5;
    o.beginPath(); o.moveTo(x - Math.cos(a) * len / 2, y - Math.sin(a) * len / 2); o.lineTo(x + Math.cos(a) * len / 2, y + Math.sin(a) * len / 2); o.stroke();
  }
  // canvas weave: a faint grid of light and dark
  if (sc.late) { o.save(); o.scale(S, S); sc.late(o); o.restore(); }   // crisp details painted after the strokes
  o.globalAlpha = .05; for (let y = 0; y < S; y += 4) { o.fillStyle = y % 8 ? '#000' : '#fff'; o.fillRect(0, y, S, 1); } o.globalAlpha = 1;
  // the hole: transparent, so the next painting shows through; then the frame on top
  o.clearRect(H0 * S, H0 * S, (H1 - H0) * S, (H1 - H0) * S);
  o.save(); o.scale(S, S); sc.frame(o, rng(55 + i)); o.restore();
  return out;
}

// ---------- the zoom ----------
const N = SCENES.length, PAINT = new Array(N).fill(null);
let z = 0, vel = 0, paused = false;
const DRIFT = 0.075;                   // paintings per second when left alone
function resize() { const d = Math.min(devicePixelRatio || 1, 2); cv.width = innerWidth * d; cv.height = innerHeight * d; }
if (!CAPTURE) { addEventListener('resize', resize); resize(); }

function render() {
  const W = cv.width, Hh = cv.height, D = Math.max(W, Hh) * 1.02;   // a painting at depth 0 covers the screen
  const lvl = Math.floor(z), f = z - lvl, s = Math.pow(K, f);
  ctx.fillStyle = '#1b1612'; ctx.fillRect(0, 0, W, Hh);
  ctx.imageSmoothingQuality = 'high';
  // innermost first: each outer painting has a transparent hole the inner one shows through
  const layers = [];
  for (let d = 0, size = D * s; size > 2 && d < 12; d++, size /= K) layers.push([((lvl + d) % N + N) % N, size]);
  for (let k = layers.length - 1; k >= 0; k--) {
    const [i, size] = layers[k]; const img = PAINT[i]; if (!img) continue;
    ctx.drawImage(img, W / 2 - size / 2, Hh / 2 - size / 2, size, size);
  }
  // a soft vignette
  const v = ctx.createRadialGradient(W / 2, Hh / 2, Math.min(W, Hh) * .35, W / 2, Hh / 2, Math.max(W, Hh) * .75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(20,12,6,.45)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, Hh);
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (!paused) z += DRIFT * dt;
  z += vel * dt; vel *= Math.pow(.04, dt);
  render(); requestAnimationFrame(loop);
}

addEventListener('wheel', (e) => { e.preventDefault(); vel += e.deltaY * 0.004; hint.classList.add('off'); }, { passive: false });
let drag = null;
cv.addEventListener('pointerdown', (e) => { drag = e.clientY; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', (e) => { if (drag === null) return; vel += (drag - e.clientY) * 0.02; drag = e.clientY; hint.classList.add('off'); });
cv.addEventListener('pointerup', () => { drag = null; });
addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); paused = !paused; }
  else if (e.key === 'ArrowUp' || e.key === 'ArrowRight') vel += 1.2;
  else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') vel -= 1.2;
  hint.classList.add('off');
});

// paint the first two right away, the rest one per frame so the page starts moving quickly
async function build() {
  const next = () => new Promise((res) => requestAnimationFrame(() => res()));
  PAINT[0] = paint(0); PAINT[1] = paint(1);
  load.classList.add('off');
  for (let i = 2; i < N; i++) { await next(); PAINT[i] = paint(i); }
  window.__ready = true;
}
// ?capture=SIZE: a fixed square canvas for recording; __shot(z) draws depth z
if (CAPTURE) { cv.width = cv.height = Number(qs.get('capture')) || 1080; cv.style.width = cv.style.height = cv.width + 'px';
  window.__shot = (zz) => { z = zz; render(); };
  build(); } else { build().then(() => {}); requestAnimationFrame(loop); setTimeout(() => hint.classList.add('off'), 6000); }
</script>
</body>
