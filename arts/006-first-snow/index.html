<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>first snow</title>
<style>
html,body{margin:0;height:100%;background:#0d1626;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;height:98vh;max-width:98vw;aspect-ratio:240/426;box-shadow:0 0 50px #000a}
</style></head><body>
<canvas id="c" width="240" height="426"></canvas>
<script>
const W=240,H=426,cv=document.getElementById('c'),ctx=cv.getContext('2d');
const VPX=128,HY=196,F=230,EYE=1.5;
const P=(X,Y,z)=>[VPX+X*F/z,HY+(EYE-Y)*F/z];
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const BAYER=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
function hex(h){const n=parseInt(h.slice(1),16);return[n>>16,(n>>8)&255,n&255]}
function sh(h,a){const[r,g,b]=hex(h);const c=v=>Math.max(0,Math.min(255,Math.round(v+a)));return'#'+((1<<24)+(c(r)<<16)+(c(g)<<8)+c(b)).toString(16).slice(1)}
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
// drawing primitives on a given context
function rect(g,x,y,w,h,col){g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function poly(g,pts,col){g.fillStyle=col;let y0=Infinity,y1=-Infinity;for(const p of pts){y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1])}
  y0=Math.max(-2,Math.floor(y0));y1=Math.min(g.canvas.height+2,Math.ceil(y1));
  for(let y=y0;y<y1;y++){const yc=y+.5,xs=[];for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];
    if((a[1]<=yc&&b[1]>yc)||(b[1]<=yc&&a[1]>yc))xs.push(a[0]+(yc-a[1])/(b[1]-a[1])*(b[0]-a[0]))}
    xs.sort((a,b)=>a-b);for(let i=0;i+1<xs.length;i+=2){const xa=Math.round(xs[i]),xb=Math.round(xs[i+1]);if(xb>xa)g.fillRect(xa,y,xb-xa,1)}}}
function ell(g,cx,cy,rx,ry,col,half){g.fillStyle=col;for(let y=-Math.ceil(ry);y<=Math.ceil(ry);y++){if(half==='top'&&y>0)break;if(half==='bot'&&y<0)continue;
  const v=1-(y/ry)**2;if(v<0)continue;const w=rx*Math.sqrt(v);g.fillRect(Math.round(cx-w),Math.round(cy+y),Math.round(2*w)||1,1)}}
function line(g,x0,y0,x1,y1,col){g.fillStyle=col;const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0))|0||1;for(let i=0;i<=n;i++)g.fillRect(Math.round(x0+(x1-x0)*i/n),Math.round(y0+(y1-y0)*i/n),1,1)}
function dpoly(g,pts,c1,c2,lvl){ // dithered polygon mix of c1/c2 with level 0..16
  const tmp=mk(W,H),t=tmp.getContext('2d');poly(t,pts,'#fff');const d=t.getImageData(0,0,W,H).data;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(d[(y*W+x)*4+3]){g.fillStyle=BAYER[y&3][x&3]<lvl?c2:c1;g.fillRect(x,y,1,1)}}

// ================= STATIC BACKGROUND =================
const bg=mk(W,H),b=bg.getContext('2d');
// sky
const skyStops=['#2a63c9','#3473d6','#3f84e0','#5096e8','#66a8ee','#82bcf2','#a3d0f6','#c4e2fa'];
for(let y=0;y<HY+4;y++){const t=y/(HY+4)*(skyStops.length-1),i=Math.floor(t),f=(t-i)*16;
  for(let x=0;x<W;x++){b.fillStyle=skyStops[Math.min(skyStops.length-1,i+(BAYER[y&3][x&3]<f?1:0))];b.fillRect(x,y,1,1)}}
// soft clouds
seed=5;for(let k=0;k<5;k++){const cx=rnd()*W,cy=30+rnd()*90,s=10+rnd()*14;
  for(let j=0;j<6;j++){const ox=(rnd()-.5)*s*2.4,oy=(rnd()-.5)*s*.5,r=s*(.5+rnd()*.5);
    ell(b,cx+ox,cy+oy,r,r*.45,'#d8ecfc');ell(b,cx+ox,cy+oy+r*.18,r*.9,r*.3,'#b7d6f4')}}
// distant mountains
for(let x=0;x<W;x++){const h=HY-14-Math.sin(x*.035+1)*7-Math.sin(x*.11)*3-Math.max(0,22-Math.abs(x-60)*.6);
  rect(b,x,h,1,HY-h+2,'#a9c6e3');rect(b,x,h,1,2,'#eef6fd');if(x%9<4)rect(b,x,h+5,1,2,'#c4d9ee')}
// distant town blocks along horizon
seed=9;for(let i=0;i<26;i++){const z=34+rnd()*60,X=(rnd()<.5?-1:1)*(4+rnd()*10),w=3+rnd()*5,hh=4+rnd()*6;
  const[a,y0]=P(X,hh,z),[c,y1]=P(X+w*(X<0?-1:1),0,z);const xl=Math.min(a,c),xr=Math.max(a,c);
  rect(b,xl,y0,xr-xl,y1-y0,['#8ea9c6','#9db6cf','#a3a9c4'][i%3]);rect(b,xl-1,y0-1,xr-xl+2,2,'#f3f8fd')}
// ground base (snow), bluer with distance
for(let y=HY;y<H;y++){const t=(y-HY)/(H-HY);for(let x=0;x<W;x++){const lv=Math.min(16,t*26);
  b.fillStyle=BAYER[y&3][x&3]<lv?'#f3f8fe':'#dbe8f6';b.fillRect(x,y,1,1)}}
// road surface: slightly grey-blue packed snow
{const pts=[P(-2.3,0,1.2),P(2.6,0,1.2),P(2.6,0,80),P(-2.3,0,80)];dpoly(b,pts,'#e6eef8','#d2dff0',5)}
// tire ruts
for(const X of[-1.6,-.7,.7,1.6]){for(let z=1.25;z<70;z*=1.012){const[x,y]=P(X,0,z),w=Math.max(1,.22*F/z);
  rect(b,x-w/2,y,w,Math.max(1,w*.25),'#cfdcec');if(w>3)rect(b,x-w/2,y,1,1,'#bfd0e4')}}
// shadows on the left side of the road from the wall
{dpoly(b,[P(-3,0,1.1),P(-1.9,0,1.1),P(-2.6,0,40),P(-3,0,40)],'#dbe8f6','#bcd0ea',9)}

// ---------- right side houses ----------
function sideFace(X,z1,z2,y0,y1,col){poly(b,[P(X,y1,z1),P(X,y1,z2),P(X,y0,z2),P(X,y0,z1)],col)}
function frontFace(X1,X2,z,y0,y1,col){poly(b,[P(X1,y1,z),P(X2,y1,z),P(X2,y0,z),P(X1,y0,z)],col)}
function rightHouse(z1,z2,hgt,wall,trim,opts={}){
  const X=3.6;
  // gable front face (facing camera) spans X..X+6
  frontFace(X,X+7,z1,0,hgt,sh(wall,-18));
  poly(b,[P(X,hgt,z1),P(X+7,hgt,z1),P(X+3.5,hgt+1.6,z1)],sh(wall,-26));
  // snow on gable
  poly(b,[P(X-.3,hgt+.1,z1),P(X+3.5,hgt+1.9,z1),P(X+7.3,hgt+.1,z1),P(X+3.5,hgt+1.55,z1)],'#ffffff');
  // front windows
  for(let k=0;k<2;k++){const a=X+1+k*3;frontFace(a,a+1.6,z1,1.2,2.4,opts.lit?'#ffdd93':'#3b5f86');frontFace(a,a+1.6,z1,1.12,1.22,'#ffffff')}
  // side wall (facing road)
  sideFace(X,z1,z2,0,hgt,wall);
  // horizontal siding lines
  for(let yy=.3;yy<hgt;yy+=.35){const p1=P(X,yy,z1),p2=P(X,yy,z2);line(b,p1[0],p1[1],p2[0],p2[1],sh(wall,-10))}
  // windows on side
  for(let z=z1+.8;z<z2-1.2;z+=2.2){for(const[ya,yb]of(hgt>4.5?[[1,2.2],[3.4,4.4]]:[[1,2.2]])){
    sideFace(X,z,z+1.3,ya-.12,yb+.12,trim);
    sideFace(X,z+.08,z+1.22,ya,yb,opts.lit&&ya<2?'#ffd88a':'#335a82');
    const m=P(X,ya,z+.65),mt=P(X,yb,z+.65);line(b,m[0],m[1],mt[0],mt[1],trim);
    if(!(opts.lit&&ya<2)){const g1=P(X,yb-.2,z+.2),g2=P(X,ya+.4,z+.55);line(b,g1[0],g1[1],g2[0],g2[1],'#6d95bf')}
    else{const g=P(X,yb-.25,z+.25);rect(b,g[0],g[1],2,2,'#fff4cf')}
    sideFace(X-.05,z-.05,z+1.35,ya-.25,ya-.1,'#ffffff')}}
  // door
  if(opts.door){const z=opts.door;sideFace(X,z,z+1,0,2,'#7a5640');sideFace(X,z+.1,z+.45,.2,1.8,'#8f6a50');
    sideFace(X-.4,z-.3,z+1.3,2.1,2.3,'#ffffff')}
  // eave: thick snow slab
  for(let i=0;i<3;i++)sideFace(X-.6+i*.02,z1-.4,z2+.2,hgt-.05+i*.1,hgt+.35+i*.12,i==0?'#c9dcef':'#ffffff');
  sideFace(X,z1,z2,hgt-.25,hgt-.05,sh(wall,-40));
  // icicles
  for(let z=z1;z<z2;z+=.35){const p=P(X-.55,hgt-.05,z),len=(1+((z*7.3)%3))*F/z*.07;if(len>.6)rect(b,p[0],p[1],Math.max(1,F/z*.03),len,'#e2f2ff')}
  // AC unit
  if(opts.ac){const z=opts.ac;sideFace(X-.01,z,z+.9,.3,.95,'#c8ccd4');sideFace(X-.02,z+.15,z+.6,.4,.85,'#9aa1ad');sideFace(X-.05,z-.05,z+.95,.95,1.1,'#ffffff')}
}
// far to near
rightHouse(30,40,5,'#c7b79a','#efe8dc');
rightHouse(22,29,6,'#9fb3c9','#e6edf4',{lit:true});
// little shop with awning
(function(){const X=3.6,z1=15,z2=21;rightHouse(z1,z2,4.2,'#ece3d2','#ffffff',{lit:true});
  for(let z=z1+.2;z<z2-.2;z+=.5){const i=Math.round((z-z1)/.5)%2;poly(b,[P(X,2.9,z),P(X,2.9,z+.5),P(X-1.1,2.3,z+.5),P(X-1.1,2.3,z)],i?'#e25a5a':'#ffffff')}
  sideFace(X-1.1,z1+.2,z2-.2,2.12,2.32,'#c94848');
  sideFace(X-1.1,z1+.2,z2-.2,2.3,2.4,'#ffffff');
  sideFace(X+.01,z1+.6,z2-.6,3.15,3.75,'#2f6bb3');
  for(let z=z1+.9;z<z2-.9;z+=.55){const p=P(X,3.3,z);rect(b,p[0],p[1],1,2,'#ffffff')}
})();
rightHouse(7.5,14,6.2,'#d8b39a','#f7ede4',{lit:true,ac:9.2});
rightHouse(2.2,7,6.5,'#b9cbe0','#f4f8fc',{door:3.2,ac:5.6});

// ---------- left: house behind wall, trees ----------
function leftHouse(z1,z2,hgt,wall,lit){const X=-4.6;
  poly(b,[P(X,hgt,z1),P(X,hgt,z2),P(X,0,z2),P(X,0,z1)],wall);
  for(let yy=.3;yy<hgt;yy+=.4){const p1=P(X,yy,z1),p2=P(X,yy,z2);line(b,p1[0],p1[1],p2[0],p2[1],sh(wall,-10))}
  for(let z=z1+.7;z<z2-1;z+=2){poly(b,[P(X,3.9,z),P(X,3.9,z+1.2),P(X,2.6,z+1.2),P(X,2.6,z)],'#e8e2d6');
    poly(b,[P(X,3.8,z+.08),P(X,3.8,z+1.12),P(X,2.7,z+1.12),P(X,2.7,z+.08)],lit?'#ffd88a':'#355b84');
    poly(b,[P(X+.1,2.6,z-.1),P(X+.1,2.6,z+1.3),P(X+.1,2.45,z+1.3),P(X+.1,2.45,z-.1)],'#ffffff')}
  // roof underside + snow slab
  poly(b,[P(X,hgt,z1-.5),P(X,hgt,z2+.3),P(X+.9,hgt+.2,z2+.3),P(X+.9,hgt+.2,z1-.5)],sh(wall,-50));
  for(let i=0;i<3;i++)poly(b,[P(X+.9,hgt+.2+i*.12,z1-.5),P(X+.9,hgt+.2+i*.12,z2+.3),P(X+.9,hgt+.65+i*.15,z2+.3),P(X+.9,hgt+.65+i*.15,z1-.5)],i?'#ffffff':'#cadcee');
  // chimney
  const cz=(z1+z2)/2;poly(b,[P(X-.8,hgt+1.9,cz),P(X-.8,hgt+1.9,cz+.6),P(X-.8,hgt+.5,cz+.6),P(X-.8,hgt+.5,cz)],'#7d6b62');
  poly(b,[P(X-.85,hgt+2.1,cz-.05),P(X-.85,hgt+2.1,cz+.65),P(X-.85,hgt+1.9,cz+.65),P(X-.85,hgt+1.9,cz-.05)],'#ffffff');
  return P(X-.8,hgt+2.1,cz+.3)}
leftHouse(26,34,5,'#a6bcd2',false);
leftHouse(14,22,5.5,'#e2cfae',true);
const chimney=leftHouse(5,12,5.4,'#b07862',true);

function pine(X,z,hgt){const[bx,by]=P(X,0,z),s=F/z;
  rect(b,bx-.15*s,by-1.4*s,.3*s,1.4*s,'#5b4032');
  const tiers=5;for(let i=0;i<tiers;i++){const y0=by-(hgt*(i+1)/tiers+.8)*s+ .2*s,y1=by-(hgt*i/tiers+.6)*s,w=(1.5-i*.25)*s;
    poly(b,[[bx,y0],[bx+w,y1],[bx-w,y1]],'#2e6a58');poly(b,[[bx,y0],[bx+w,y1],[bx+w*.35,y1]],'#22503f');
    poly(b,[[bx,y0],[bx+w*.75,y0+(y1-y0)*.55],[bx,y0+(y1-y0)*.35],[bx-w*.8,y0+(y1-y0)*.6]],'#f5faff');
    for(let k=-2;k<=2;k++)rect(b,bx+k*w*.4,y1-1,Math.max(1,w*.3),Math.max(1,s*.12),'#ffffff')}}
pine(-4.1,30,4);pine(-4.0,18.5,5);pine(-3.9,10,6);

// ---------- stone wall on left ----------
{const X=-3,top=1.45;
  poly(b,[P(X,top,1),P(X,top,60),P(X,0,60),P(X,0,1)],'#b8bfcc');
  seed=21;for(let row=0;row<5;row++){const y0=row*.29,y1=y0+.27,off=row%2?.3:0;
    for(let z=1+off;z<40;z+=.62){const z2=z+.58,c=['#c6ccd8','#bcc3d0','#ced4df','#b3bac8'][(row*3+Math.floor(z*1.7))%4];
      poly(b,[P(X,y1,z),P(X,y1,z2),P(X,y0,z2),P(X,y0,z)],c);
      const p=P(X,y1,z),q=P(X,y1,z2);line(b,p[0],p[1],q[0],q[1],'#e4e8ef');
      const r=P(X,y0,z2),s2=P(X,y1,z2);if(F/z>6)line(b,r[0],r[1],s2[0],s2[1],'#8d95a6')}}
  // snow cap
  poly(b,[P(X+.08,top+.32,1),P(X+.08,top+.32,60),P(X+.08,top-.04,60),P(X+.08,top-.04,1)],'#ffffff');
  poly(b,[P(X+.08,top+.02,1),P(X+.08,top+.02,60),P(X+.08,top-.06,60),P(X+.08,top-.06,1)],'#cfe0f2');
  for(let z=1.1;z<30;z*=1.07){const p=P(X+.08,top-.04,z),s=F/z;ell(b,p[0],p[1],s*.06,s*.08*((z*13)%2+.5),'#ffffff','bot')}
  // snowbank at wall base
  for(let z=1;z<50;z*=1.03){const p=P(X+.25,0,z),s=F/z;ell(b,p[0],p[1],s*.35,s*.18,'#f6faff','top');ell(b,p[0]+s*.1,p[1],s*.22,s*.08,'#dde9f6','top')}
}
// snowbank along right houses
for(let z=2.2;z<50;z*=1.03){const p=P(3.3,0,z),s=F/z;ell(b,p[0],p[1],s*.4,s*.2,'#f6faff','top');ell(b,p[0]-s*.1,p[1],s*.25,s*.07,'#dde9f6','top')}

// ---------- utility poles & wires ----------
const poles=[2.6,9,17,27,40];const PX=3.1,PT=8.2;
for(let i=poles.length-1;i>=0;i--){const z=poles[i],s=F/z,[x,yb]=P(PX,0,z),[,yt]=P(PX,PT,z);
  rect(b,x-.13*s,yt,.26*s,yb-yt,'#767b86');rect(b,x+.04*s,yt,.09*s,yb-yt,'#585c66');rect(b,x-.13*s,yt,.05*s+1,yb-yt,'#9097a3');
  rect(b,x-.15*s,yt-.12*s,.3*s,.14*s,'#ffffff');
  for(const[yy,w]of[[7.6,1.3],[6.9,1]]){const[,ya]=P(PX,yy,z);rect(b,x-w*s,ya,2*w*s,.1*s,'#555a64');rect(b,x-w*s,ya-.05*s,2*w*s,.05*s+1,'#ffffff')}
  const[,yx]=P(PX,5.6,z);rect(b,x-.38*s,yx,.3*s,.5*s,'#8e949f');rect(b,x-.38*s,yx-.05*s,.3*s,.07*s+1,'#ffffff');
  // pole plate
  const[,yp]=P(PX,2.2,z);rect(b,x-.1*s,yp,.2*s,.35*s,'#e9e3c8')}
function wire3(a,c,sag,col){let prev=null;for(let t=0;t<=1;t+=.002){const X=a[0]+(c[0]-a[0])*t,Y=a[1]+(c[1]-a[1])*t-Math.sin(t*Math.PI)*sag,z=a[2]+(c[2]-a[2])*t;
  const p=P(X,Y,z);if(prev)line(b,prev[0],prev[1],p[0],p[1],col);prev=p}}
for(let i=0;i<poles.length-1;i++)for(const[dx,yy]of[[-1.1,7.65],[1.1,7.65],[-.7,6.95],[.7,6.95]])wire3([PX+dx,yy,poles[i]],[PX+dx,yy,poles[i+1]],.35,'#2b3142');
for(const[dx,yy]of[[-1.1,7.65],[1.1,7.65],[-.7,6.95]])wire3([PX+dx,yy,poles[0]],[PX+dx*2,yy+.5,.6],.2,'#2b3142');
wire3([PX-1.1,7.65,poles[1]],[-4.6,4.3,8],.5,'#2b3142');wire3([PX-.7,6.95,poles[2]],[-4.6,4.3,18],.4,'#2b3142');
wire3([PX-1.1,7.65,poles[0]],[-1.7,6.95,6],.4,'#2b3142');

// left poles (the guy leans on the nearest one), each wire ends on a crossarm or a house wall
function leftPole(z){const X=-2.6,sc=F/z,[x,yb]=P(X,0,z),[,yt]=P(X,8.2,z);
  rect(b,x-.13*sc,yt,.26*sc,yb-yt,'#767b86');rect(b,x+.04*sc,yt,.09*sc,yb-yt,'#585c66');rect(b,x-.13*sc,yt,.05*sc+1,yb-yt,'#9097a3');
  rect(b,x-.15*sc,yt-.12*sc,.3*sc,.14*sc,'#ffffff');
  const[,ya]=P(X,6.9,z);rect(b,x-.9*sc,ya,1.8*sc,.1*sc,'#555a64');rect(b,x-.9*sc,ya-.05*sc,1.8*sc,.05*sc+1,'#ffffff');
  const[,yp]=P(X,2.2,z);rect(b,x-.1*sc,yp,.2*sc,.35*sc,'#e9e3c8');rect(b,x-.08*sc,yp+.08*sc,.16*sc,1,'#6b6f7a');
  ell(b,x,yb,.45*sc,.12*sc,'#ffffff','top');ell(b,x+.1*sc,yb,.3*sc,.05*sc,'#dde9f6','top')}
const LPOLES=[6,16,28];
for(let i=LPOLES.length-1;i>=0;i--)leftPole(LPOLES[i]);
for(let i=0;i<LPOLES.length-1;i++)for(const dx of[-.7,.7])wire3([-2.6+dx,6.95,LPOLES[i]],[-2.6+dx,6.95,LPOLES[i+1]],.3,'#2b3142');
wire3([-1.9,6.95,6],[PX-.7,6.95,poles[1]],.6,'#2b3142');
wire3([-1.9,6.95,6],[-1.9,7.5,1.2],.2,'#2b3142');wire3([-3.3,6.95,6],[-3.3,7.5,1.2],.2,'#2b3142');
wire3([-3.3,6.95,16],[-4.6,4.3,15],.15,'#2b3142');



// ================= CHARACTER =================
const CW=90,CH=190,chr=mk(CW,CH),g=chr.getContext('2d');
const C={out:'#231f36',skin:'#f8dfcf',skinS:'#ecbfac',blush:'#f39ea2',hair:'#302b42',hairH:'#4d4666',hairS:'#201c2e',
