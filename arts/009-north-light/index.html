<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>north light</title>
<style>
  html,body{margin:0;height:100%;background:#0a0c1c;overflow:hidden}
  canvas{display:block;width:100%;height:100%;object-fit:contain;cursor:pointer}
  .thumb canvas{object-fit:cover}
</style>
<canvas id="c"></canvas>
<script>
// north light: an aurora over a fjord, drawn stroke by stroke with four dry tools
// (soft pastel, oil pastel, coloured pencil, chalk) on dark toned paper. Canvas 2D only.
const q = new URLSearchParams(location.search);
const THUMB = q.has('thumb');
const SPEED = Math.max(.1, +(q.get('speed') || 3)); // strokes per frame multiplier: ?speed=6 is twice as fast as the default
if (THUMB) document.documentElement.classList.add('thumb');
const W = 2400, H = 1350, HZ = 800;
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const layer = document.createElement('canvas'); layer.width = W; layer.height = H;
const lctx = layer.getContext('2d');

let seed = +(q.get('seed') || 7);
let rs = 1;
const rnd = () => { rs = (rs + 0x6D2B79F5) | 0; let t = Math.imul(rs ^ (rs >>> 15), 1 | rs); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const rr = (a, b) => a + (b - a) * rnd();
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function hash(i, j) { let n = Math.imul(i, 374761393) + Math.imul(j, 668265263) + Math.imul(seed, 1442695041); n = Math.imul(n ^ (n >>> 13), 1274126177); return ((n ^ (n >>> 16)) >>> 0) / 4294967296; }
function vnoise(x, y) { const xi = Math.floor(x), yi = Math.floor(y); let fx = x - xi, fy = y - yi; fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy); return lerp(lerp(hash(xi, yi), hash(xi + 1, yi), fx), lerp(hash(xi, yi + 1), hash(xi + 1, yi + 1), fx), fy); }

// ---------- colour ----------
const C = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const S = (...hs) => hs.map(C);
// a stick of colour, held a little differently every time
function css(c, j = 7) { const l = (rnd() - .5) * 2 * j; return `rgb(${clamp(c[0] + l + (rnd() - .5) * j, 0, 255) | 0},${clamp(c[1] + l + (rnd() - .5) * j, 0, 255) | 0},${clamp(c[2] + l + (rnd() - .5) * j, 0, 255) | 0})`; }
// a finite box of sticks: between two neighbours, pick one or the other, never a blend
function pick(stops, t) { t = clamp(t, 0, .9999) * (stops.length - 1); const i = t | 0; return stops[rnd() < t - i ? i + 1 : i]; }
const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];

const PAPER = '#151833';
const SKY = S('#10143a', '#161b4e', '#1e2668', '#27378a', '#2c4d9e', '#2d6aa8', '#2f86a6', '#3d9d9c', '#62b8a0');
const WARM = S('#6f55a6', '#b06aa8', '#e07a94', '#f29a80', '#f7c08c', '#f9dca2');
const AUR = S('#e6ffe9', '#b4f9c4', '#6fec9f', '#3fd993', '#27bf92', '#1f9f9c', '#3f7fc0', '#7a60cc', '#b45cc6', '#dc6cbc');
const SNOW = S('#232863', '#333c86', '#4a57a8', '#6676c6', '#8a9cde', '#afc4ee', '#d3e4f6', '#f1f6fb');
const PINE = S('#090e20', '#0c1a2c', '#10283a', '#163846', '#1d4a52');
const ROCK = S('#161a44', '#1f2458', '#2b2f6c');

// ---------- paper tooth ----------
// one tileable height field; each tool leaves pigment only on the part of the tooth it can reach
const G = 512, masks = {};
function buildGrain() {
  const h = new Float32Array(G * G);
  const tn = (x, y, p) => { const xi = Math.floor(x), yi = Math.floor(y); let fx = x - xi, fy = y - yi; fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy); const w = (a, b) => hash(((a % p) + p) % p + 911, ((b % p) + p) % p + 77 * p); return lerp(lerp(w(xi, yi), w(xi + 1, yi), fx), lerp(w(xi, yi + 1), w(xi + 1, yi + 1), fx), fy); };
  for (let y = 0; y < G; y++) for (let x = 0; x < G; x++)
    h[y * G + x] = .46 * tn(x / 1.7, y / 1.7, 301) + .2 * tn(x / 4.4, y / 3.6, 113) + .1 * tn(x / 22, y / 2.6, 23) + .24 * hash(x + 3, y + 5);
  const sorted = Float32Array.from(h).sort();
  const mk = (cover, soft) => {
    const thr = sorted[((1 - cover) * (G * G - 1)) | 0];
    const c = document.createElement('canvas'); c.width = c.height = G; const x = c.getContext('2d');
    const im = x.createImageData(G, G);
    for (let i = 0; i < G * G; i++) im.data[i * 4 + 3] = 255 * clamp((thr - h[i]) / soft + .5, 0, 1);

const TOOLS = {
  pastel: { wob: .9, rag: .22, taper: .18 },
  oil: { wob: .6, rag: .14, taper: .3 },
  pencil: { wob: .45, rag: .25, taper: .7 },
  chalk: { wob: .3, rag: .3, taper: .5 },
  smudge: { wob: 0, rag: 0, taper: 0 },

let cur = 'pastel', bx0 = 1e9, by0 = 1e9, bx1 = -1e9, by1 = -1e9, count = 0;
function grow(x, y, p) { if (x - p < bx0) bx0 = x - p; if (y - p < by0) by0 = y - p; if (x + p > bx1) bx1 = x + p; if (y + p > by1) by1 = y + p; }
function flush() {
  if (bx1 < bx0) return;
  const x = Math.max(0, Math.floor(bx0)), y = Math.max(0, Math.floor(by0)), w = Math.min(W, Math.ceil(bx1)) - x, h = Math.min(H, Math.ceil(by1)) - y;
  if (w > 0 && h > 0) {
    lctx.globalAlpha = 1; lctx.globalCompositeOperation = 'destination-out'; lctx.fillStyle = masks[cur]; lctx.fillRect(x, y, w, h);
    lctx.globalCompositeOperation = 'source-over';

}
function use(tool) { if (tool !== cur) { flush(); cur = tool; } }
// one stroke: a ribbon with a wandering spine, a ragged edge and a pressure taper
function mark(tool, x0, y0, x1, y1, w, col, a = 1, bow = 0) {

    const ww = .5 * w * Math.pow(Math.sin(Math.PI * (.06 + .88 * t)), T.taper) * (1 + (rnd() - .5) * T.rag);
    L.push(px + nx * ww, py + ny * ww); R.push(px - nx * ww, py - ny * ww);
  }
  lctx.globalAlpha = a; lctx.fillStyle = col; lctx.beginPath(); lctx.moveTo(L[0], L[1]);
  for (let i = 2; i < L.length; i += 2) lctx.lineTo(L[i], L[i + 1]);
  for (let i = R.length - 2; i >= 0; i -= 2) lctx.lineTo(R[i], R[i + 1]);
  lctx.closePath(); lctx.fill();
  const pad = w + Math.abs(bow) * len + 6; grow(x0, y0, pad); grow(x1, y1, pad);
}
function dot(tool, x, y, r, col, a = 1) { use(tool); count++; lctx.globalAlpha = a; lctx.fillStyle = col; lctx.beginPath(); lctx.ellipse(x, y, r * rr(.8, 1.2), r * rr(.8, 1.2), rnd() * 3, 0, 7); lctx.fill(); grow(x, y, r + 3); }
// pigment rubbed in with a finger
function glow(x, y, rx, ry, c, a) {
  use('smudge'); count += 3;
  lctx.save(); lctx.translate(x, y); lctx.scale(1, ry / rx); lctx.globalAlpha = 1;
  const g = lctx.createRadialGradient(0, 0, 0, 0, 0, rx);
  g.addColorStop(0, `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`); g.addColorStop(.5, `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a * .45})`); g.addColorStop(1, `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},0)`);
  lctx.fillStyle = g; lctx.fillRect(-rx, -rx, 2 * rx, 2 * rx); lctx.restore();

// fill a shape the way a hand does: parallel strokes that overshoot a little
function hatch(poly, ang, gap, tool, w, colFn, a = 1, over = 3) {

    const xs = [];

      const a0 = xs[k] - rr(-1, over), a1 = xs[k + 1] + rr(-1, over), m = (a0 + a1) / 2;
      mark(tool, a0 * c - y * s, a0 * s + y * c, a1 * c - y * s, a1 * s + y * c, w * rr(.85, 1.2), colFn(m * c - y * s, m * s + y * c), a, rr(-.015, .015));

const quad = (Q, u, v) => { const t = [lerp(Q[0][0], Q[1][0], u), lerp(Q[0][1], Q[1][1], u)], b = [lerp(Q[3][0], Q[2][0], u), lerp(Q[3][1], Q[2][1], u)]; return [lerp(t[0], b[0], v), lerp(t[1], b[1], v)]; };

// ---------- the place ----------
const shore = x => 1040 + 30 * Math.sin(x / 610 + .6) - 90 * sstep(1400, 2400, x) + 10 * (fbm(x / 90, 3, 2) - .5);
const twilight = x => Math.exp(-Math.pow((x - 430) / 560, 2));
function ridge(peaks, rough, k) {
  return x => {
    let y = HZ - 8, face = 0, pk = 0;
    for (let i = 0; i < peaks.length; i++) { const p = peaks[i], d = x - p[0], v = p[1] + (d < 0 ? -d * p[2] : d * p[3]); if (v < y) { y = v; face = d < 0 ? -1 : 1; pk = i; } }

}
const farR = ridge([[120, 706, .3, .34], [420, 668, .42, .36], [735, 712, .3, .3], [1010, 640, .5, .42], [1290, 688, .4, .36], [1545, 622, .52, .46], [1830, 676, .4, .4], [2120, 640, .45, .5]], 20, 2.5);
const nearR = ridge([[-140, 640, .5, .42], [1985, 560, .5, .62], [2255, 492, .62, .7], [2520, 560, .5, .5]], 26, 7.5);

function spline(pts, step) {
  const out = []; let px = pts[0][0], py = pts[0][1], acc = step;
  const P = i => pts[clamp(i, 0, pts.length - 1)];
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
    for (let k = 1; k <= 120; k++) {
      const t = k / 120, t2 = t * t, t3 = t2 * t;
      const x = .5 * (2 * p1[0] + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3);
      const y = .5 * (2 * p1[1] + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3);

const CURTAINS = [
  { pts: [[-80, 250], [260, 205], [560, 238], [800, 170], [1010, 205]], h: [170, 240], sc: [.8, 1], amp: .5, hue: .22, k: 31 },
  { pts: [[2480, 668], [2180, 640], [1900, 676], [1650, 632], [1400, 660], [1210, 640]], h: [150, 110], sc: [.75, .6], amp: .62, hue: .12, k: 57 },
  { pts: [[-70, 655], [300, 596], [640, 612], [905, 522], [822, 432], [1100, 352], [1500, 402], [1752, 300], [1655, 202], [2000, 118], [2470, 150]], h: [120, 400], sc: [.55, 1.45], amp: 1, hue: 0, k: 3 },
];
let rays = [];

// ---------- the drawing, in the order a hand would do it ----------
let pace = 20;
function* drawing() {
  // 1. sky: diagonal pastel hatching, dark to light, top to bottom
  pace = 26;
  const skyCol = (x, y) => {
    const t = clamp(y / HZ + (fbm(x / 420, y / 260, 3) - .5) * .22, 0, 1), g = twilight(x) * sstep(.74, .99, y / HZ);
    if (rnd() < g * .9) return pick(WARM, sstep(.74, 1.04, y / HZ) * (.2 + .62 * twilight(x)) + rr(-.08, .08));
    return pick(SKY, Math.pow(t, 1.9) * .97);
  };
  for (let y = -30; y < HZ + 10; y += 17) {
    for (let x = -60 + rr(0, 20); x < W + 60; x += rr(20, 30)) {
      const yy = y + rr(-9, 9), ang = -.62 + rr(-.16, .16), len = rr(80, 170);
      mark('pastel', x, yy, x + Math.cos(ang) * len, yy + Math.sin(ang) * len, rr(13, 24), css(skyCol(x, yy), 6), rr(.6, .95), rr(-.03, .03));
    }
    yield;
  }
  pace = 14; // second pass, another angle, the next stick along: colours mix in the eye
  for (let y = -20; y < HZ; y += 30) {
    for (let x = -40; x < W + 40; x += rr(46, 80)) {
      const yy = y + rr(-14, 14), ang = -1.0 + rr(-.2, .2), len = rr(60, 130);
      mark('pencil', x, yy, x + Math.cos(ang) * len, yy + Math.sin(ang) * len, rr(2.2, 4), css(skyCol(x, yy + rr(20, 60)), 10), rr(.3, .6));
    }
    yield;
  }

  const starC = S('#ffffff', '#dfe9ff', '#fff3cf', '#ffd9ec', '#cfeee6');
  for (let i = 0; i < 620; i++) {
    const x = rr(0, W), y = Math.pow(rnd(), 1.5) * (HZ - 90), r = rnd() < .08 ? rr(2.2, 3.4) : rr(.8, 1.9);

  pace = 6;
  for (let i = 0; i < 9; i++) { glow(rr(60, 900), HZ - rr(20, 110), rr(170, 300), rr(40, 70), WARM[2], .1); yield; }
  for (const [cx, cy, cw] of [[300, 648, 210], [760, 690, 150], [1010, 662, 90]]) {
    for (let i = 0; i < 16; i++) {
      const t = rnd(), x = cx + (rnd() - .5) * cw * 2 * (1 - t * .5), y = cy - t * 26 + rr(-3, 3), l = rr(30, 90) * (1 - t * .4);

  // stars that show through the thin parts
  pace = 8;
  for (let i = 0; i < 120; i++) { dot('chalk', rr(0, W), Math.pow(rnd(), 1.3) * (HZ - 160), rr(.8, 1.8), '#f4fff6', rr(.5, .9)); if (i % 5 === 0) yield; }
  for (let i = 0; i < 16; i++) {
    const x = rr(60, W - 60), y = rr(30, 520), r = rr(9, 19), c = css(starC[rnd() * 5 | 0], 3);
    mark('pencil', x - r, y, x + r, y, 2.2, c, .9); mark('pencil', x, y - r * 1.25, x, y + r * 1.25, 2.2, c, .9); dot('chalk', x, y, 3, '#ffffff', 1);
    yield;
  }

  // 4. mountains: far range pale, near range dark, snow faces turned to the twilight
  for (const [R, far] of [[farR, 1], [nearR, 0]]) {
    pace = 16;
    for (let x = -20; x < W + 20; x += far ? 15 : 13) {
      const r = R(x); if (r.y > HZ - 12) continue;
      for (let y = r.y + 4; y < HZ + 4; y += rr(15, 21)) {
        const d = y - r.y, xs = x + rr(-7, 7);
        const spur = vnoise((xs - r.face * d * 1.5) / (far ? 46 : 60) + r.pk * 7, far ? 3 : 9);
        const tw = twilight(xs), lit = r.face < 0 ? 1 : 0;
        let c;
        if (far) {
          const L = (lit ? .62 : .3) + (spur - .5) * .5 - d / 500;
          c = lit && rnd() < tw * .5 ? mix(pick(WARM, .2 + L * .6 - (1 - tw) * .2), SNOW[5], .35) : pick(SNOW, L + .12);
          c = mix(c, SKY[5], .22 + .2 * sstep(40, 160, d));
        } else {
          const L = (lit ? .5 : .2) + (spur - .5) * .62 - d / 620;
          c = spur < .34 ? pick(ROCK, rnd()) : (!lit && rnd() < .3 ? mix(pick(SNOW, L + .1), AUR[4], .5) : pick(SNOW, L));
        }
        const ang = r.face < 0 ? 2.25 + rr(-.2, .2) : .95 + rr(-.2, .2), len = rr(30, 70);
        mark('pastel', xs, y, xs + Math.cos(ang) * len, Math.min(HZ + 6, y + Math.sin(ang) * len), rr(11, 18), css(c, 6), rr(.75, 1), rr(-.04, .04));
      }
      yield;
    }
    pace = 10; // ridge line: a pale pencil edge with a dark one under it
    for (let x = -10; x < W; x += 16) {
      const a = R(x), b = R(x + 19); if (a.y > HZ - 14) continue;
      mark('pencil', x, a.y + 1, x + 19, b.y + 1, rr(2, 3.4), css(far ? mix(SNOW[6], WARM[4], twilight(x) * .7) : (rnd() < .5 ? AUR[1] : SNOW[7]), 6), rr(.6, .95));
      if (rnd() < .5) { const l = rr(18, 50), an = a.face < 0 ? 2.2 : .95; mark('pencil', x, a.y + 5, x + Math.cos(an) * l, a.y + 5 + Math.sin(an) * l, rr(1.6, 2.6), css(far ? SNOW[1] : PINE[0], 5), rr(.4, .8)); }
      if (x % 64 === 0) yield;
    }
    if (far) { // mist lying on the water under the far range
      pace = 4;
      for (let x = -100; x < W + 100; x += 150) { glow(x + rr(-40, 40), HZ - 14 + rr(-6, 6), rr(150, 240), rr(18, 34), mix(SKY[7], WARM[4], twilight(x) * .8), .2); yield; }
    }
  }
  // far shore: a dark line of trees and a few lit windows
  pace = 12;
  for (let x = 240; x < 1840; x += rr(6, 11)) {
    if (fbm(x / 130, 20, 2) < .43) continue;
    const h = rr(7, 17); mark('pencil', x, HZ + 1, x + rr(-1, 1), HZ - h, rr(2.4, 4.4), css(PINE[1], 5), rr(.7, 1));
    if (count % 8 === 0) yield;
  }

  // 5. the fjord: horizontal strokes, the sky upside down, the mountains dark in it
  pace = 18;
  for (let y = HZ + 3; y < 1090; y += 11) {
    for (let x = -60 + rr(0, 30); x < W + 40; x += rr(46, 88)) {
      const yy = y + rr(-5, 5); if (yy > shore(x) + 8) continue;
      const d = (yy - HZ) / 250, len = rr(50, 150) * (.6 + d * .9), m1 = HZ - farR(x).y, m2 = HZ - nearR(x).y;
      let c = rnd() < twilight(x) * (1 - d * .7) * .9 ? pick(WARM, .8 - d * 1.5 + rr(-.1, .1)) : pick(SKY, .92 - d * 1.05 + rr(-.08, .08));
      if (yy - HZ < Math.max(m1 * .75, m2 * .85) * rr(.8, 1.1)) c = mix(pick(SNOW, rr(.05, .3)), c, .25);
      mark('pastel', x, yy, x + len, yy + rr(-2, 2), rr(7, 13) * (.7 + d * .6), css(c, 6), rr(.7, 1), rr(-.012, .012));
    }
    yield;
  }
  pace = 12; // the aurora lying broken on the water
  for (const r of rays) {
    if (r.I < .22 || rnd() > .8) continue;
    const y0 = HZ + (HZ - r.y) * .5;
    for (let j = 0; j < 7; j++) {
      const yy = y0 + j * r.h * .075 + rr(-4, 4), x = r.x + rr(-1, 1) * (8 + j * 9); if (yy > shore(x) - 5) break;
      const len = rr(14, 44) * (.7 + (yy - HZ) / 200);
      mark(j < 2 ? 'oil' : 'pastel', x - len / 2, yy, x + len / 2, yy + rr(-1, 1), rr(3.5, 6.5), css(pick(AUR, r.hue + .08 + j / 7 * .7), 5), r.I * (.95 - j * .11));
    }
    yield;
  }
  pace = 8;
  const lamps = [[1168, 3], [1196, 2.4], [1252, 3.2], [1287, 2.2], [1348, 2.8], [1392, 2.4], [1410, 2]];
  for (const [x, r] of lamps) {
    glow(x, HZ - 5, 15, 12, C('#ffbf66'), .5); dot('oil', x, HZ - 5, r, '#ffe29a', 1);
    for (let j = 0; j < 5; j++) mark('oil', x - rr(3, 8), HZ + 7 + j * 8, x + rr(3, 8), HZ + 7 + j * 8, rr(2.2, 3.4), css(C('#ffc873'), 6), .9 - j * .16);
    yield;
  }
  for (let i = 0; i < 90; i++) { // glints and thin ice
    const x = rr(0, W), y = rr(HZ + 8, shore(x) - 8), l = rr(14, 60);
    mark('pencil', x, y, x + l, y + rr(-1, 1), rr(1.4, 2.4), css(rnd() < .5 ? SNOW[6] : AUR[1], 5), rr(.35, .8));
    if (i % 4 === 0) yield;
  }

  // 6. snow: strokes that follow the drifts; blue in the dark, green where the sky reaches it
  pace = 18;
  const pool = (x, y) => Math.exp(-Math.pow((x - 905) / 190, 2) - Math.pow((y - 1196) / 52, 2)) + .8 * Math.exp(-Math.pow((x - 600) / 130, 2) - Math.pow((y - 1168) / 30, 2));
  for (let y = 900; y < H + 20; y += 12) {
    for (let x = -80 + rr(0, 40); x < W + 40; x += rr(34, 60)) {
      const yy = y + rr(-6, 6); if (yy < shore(x) + 3) continue;
      const dr = fbm(x / 340, yy / 95, 3), sl = (fbm((x + 30) / 340, yy / 95, 3) - dr) * 2.6;
      const depth = (yy - shore(x)) / 300, L = .3 + (dr - .5) * 1.25 + .16 * sstep(.25, 0, depth) - .22 * sstep(.45, 1.1, depth) - .22 * sstep(1750, 2400, x) - .2 * sstep(330, 0, x);
      const p = pool(x, yy);
      let c = rnd() < p * .95 ? mix(pick(WARM, .35 + p * .7), C('#ffd88a'), .5) : (L > .52 && rnd() < .42 ? mix(pick(SNOW, L + .1), AUR[2], .42) : pick(SNOW, L));
      const len = rr(60, 150);
      mark('pastel', x, yy, x + len, yy + len * sl + rr(-2, 2), rr(9, 15), css(c, 6), rr(.72, 1), rr(-.03, .03));
    }
    yield;
  }
  pace = 10; // the lip of ice along the water
  for (let x = -20; x < W; x += rr(50, 120)) {
    const l = rr(24, 60); mark('oil', x, shore(x) + rr(1, 6), x + l, shore(x + l) + rr(1, 6), rr(3, 5.5), css(pick(SNOW, rr(.55, .9)), 5), rr(.5, .9));
    if (rnd() < .6) mark('pencil', x, shore(x) - 3, x + l, shore(x + l) - 3, 2.4, css(SKY[0], 4), rr(.5, .9));
    if (count % 6 === 0) yield;
  }
  // ski tracks coming up from the bottom of the page to the door
  const tr = spline([[1330, 1400], [1265, 1320], [1120, 1262], [960, 1226], [850, 1192], [800, 1166]], 22);
  for (let i = 0; i + 1 < tr.length; i++) {
    const a = tr[i], b = tr[i + 1], k = lerp(1, .45, a[2]);
    for (const o of [-9, 9]) {
      mark('pencil', a[0] + o * k, a[1] + o * k * .25, b[0] + o * k, b[1] + o * k * .25, 3.4 * k, css(SNOW[1], 5), .85);
      mark('pencil', a[0] + o * k + 1, a[1] + o * k * .25 + 3.4 * k, b[0] + o * k + 1, b[1] + o * k * .25 + 3.4 * k, 1.8 * k, css(SNOW[6], 5), .6);
    }
    if (i % 3 === 0) yield;
  }

  // 7. small spruces behind the cabin, then the cabin
  pace = 9;
  yield* spruce(388, 1092, 118, .9); yield* spruce(436, 1086, 168, 1); yield* spruce(912, 1098, 176, 1); yield* spruce(968, 1104, 112, .9);
  yield* cabin();

  // 8. the big spruces that frame the page
  pace = 12;
  yield* spruce(52, 1400, 600, 1.15); yield* spruce(2330, 1410, 560, 1.1); yield* spruce(2128, 1440, 730, 1.2);

  // 9. last touches: dust, a few hard lights
  pace = 8;
  for (let i = 0; i < 260; i++) {
    const x = rr(0, W), y = rr(0, H);
    dot('chalk', x, y, rr(.6, 1.3), css(y < HZ ? pick(AUR, rnd()) : SNOW[6], 8), rr(.15, .45));
    if (i % 8 === 0) yield;
  }
  // initials, bottom right, the way you would
  mark('pencil', 2318, 1322, 2326, 1300, 2, css(SNOW[5], 4), .7); mark('pencil', 2326, 1300, 2335, 1322, 2, css(SNOW[5], 4), .7);
  mark('pencil', 2322, 1314, 2332, 1313, 1.8, css(SNOW[5], 4), .7); mark('pencil', 2342, 1322, 2362, 1319, 1.8, css(SNOW[5], 4), .6, .2);
}

function* spruce(cx, base, hgt, k) {
  const top = base - hgt, n = Math.round(hgt / (15 + hgt * .028)), big = hgt / 170;
  mark('oil', cx, base, cx + rr(-2, 2), top + hgt * .12, Math.max(3, 5 * big), css(PINE[0], 4), 1);
  for (let i = 0; i <= n; i++) {
    const t = i / n, y = top + t * hgt, half = (.05 + .95 * Math.pow(t, .85)) * hgt * .27 * rr(.82, 1.12);
    for (const side of [-1, 1]) {
      const m = 2 + (big > 1.5 ? 2 : 0) + (rnd() * 2 | 0);
      for (let b = 0; b < m; b++) {
        const reach = half * rr(.45, 1), x0 = cx + side * reach * rr(0, .2), y0 = y + rr(-5, 5) * big, x1 = cx + side * reach, y1 = y0 + reach * rr(.3, .5) + 3;
        const w = clamp(rr(5, 9) * Math.pow(big, .75) * k, 3, 30);
        mark('oil', x0, y0, x1, y1, w, css(pick(PINE, rr(0, .55) + (side < 0 ? .25 : 0)), 5), rr(.85, 1), side * rr(.04, .12));
        if (rnd() < .78) { // snow carried on top of the bough; lit from the left, green from above
          const f = rr(.35, .8), L = side < 0 ? rr(.6, 1) : rr(.32, .7);
          let c = pick(SNOW, L); if (rnd() < .25) c = mix(c, AUR[2], .4);
          mark('oil', x0 + side * 2, y0 - w * .55, lerp(x0, x1, f), lerp(y0, y1, f) - w * .6, w * rr(.55, .85), css(c, 5), rr(.8, 1), side * rr(.06, .14));
        }
        if (rnd() < .5) mark('pencil', x1, y1, x1 + side * rr(4, 12) * big, y1 + rr(3, 9) * big, clamp(1.6 * big, 1.6, 4), css(PINE[rnd() * 3 | 0], 5), .9);
      }
    }
    if (i % 2 === 0) yield;
  }
  // drift at the foot
  if (base < H) for (let i = 0; i < 4; i++) mark('pastel', cx - hgt * .2 + rr(-8, 8), base + rr(-2, 6), cx + hgt * .2 + rr(-8, 8), base + rr(0, 8), rr(7, 11), css(pick(SNOW, rr(.25, .6)), 5), .9);
  yield;
}

function* cabin() {
  const sideW = [[500, 1040], [700, 1052], [700, 1145], [500, 1130]];        // long wall, turned away from the lamp light
  const gabW = [[700, 1052], [840, 1040], [840, 1132], [700, 1145]];          // gable wall, facing us
  const apex = [770, 965], back = [562, 950];
  const RED = S('#4c1730', '#6c1f38', '#8a2a3e', '#a8343f', '#c04a44');
  // smoke first, so the chimney sits on it
  for (let i = 0; i < 9; i++) { const t = i / 8; glow(628 + t * t * 150 + rr(-6, 6), 905 - t * 190, 16 + t * 40, 20 + t * 34, mix(C('#b9a6d8'), SKY[4], t * .6), .26 * (1 - t * .75)); yield; }
  for (let i = 0; i < 14; i++) { const t = rnd(), x = 628 + t * t * 150 + rr(-18, 18) * (.4 + t), y = 905 - t * 190; mark('pastel', x, y, x + rr(14, 40), y - rr(10, 30), rr(6, 12), css(C('#cdbfe6'), 8), rr(.2, .45) * (1 - t * .6), rr(-.2, .2)); }
  yield;
  hatch(sideW, 0.066, 7, 'oil', 7.5, (x) => css(pick(RED, .12 + (x - 500) / 200 * .3 + rr(-.1, .1)), 5), .95, 2); yield;
  hatch([...gabW.slice(0, 1), apex, ...gabW.slice(1)], -.09, 7, 'oil', 7.5, (x, y) => css(pick(RED, .5 + (y - 965) / 180 * .35 + rr(-.12, .12)), 5), .95, 2); yield;
  // plank lines and a little green sky caught on the dark wall
  for (let v = .1; v < 1; v += .11) { const a = quad(sideW, 0, v), b = quad(sideW, 1, v); mark('pencil', a[0], a[1], b[0], b[1], 1.8, css(C('#2a0f26'), 4), .7); const c = quad(gabW, 0, v), d = quad(gabW, 1, v); mark('pencil', c[0], c[1], d[0], d[1], 1.8, css(C('#4a1530'), 4), .6); }
  for (let i = 0; i < 16; i++) { const p = quad(sideW, rnd(), rr(.05, .6)); mark('pencil', p[0], p[1], p[0] + rr(10, 26), p[1] + rr(8, 20), 2, css(AUR[5], 6), rr(.25, .5)); }
  yield;
  // chimney
  hatch([[612, 908], [640, 910], [640, 958], [612, 956]], Math.PI / 2, 6, 'oil', 7, () => css(C('#3a2440'), 6), 1, 1);
  mark('oil', 607, 906, 645, 908, 8, css(SNOW[6], 4), 1);
  // roof: a thick blanket of snow, lit along the top, blue toward the eave
  const roof = [[558, 946], [778, 958], [694, 1062], [482, 1048]];
  hatch(roof, 1.02, 7, 'oil', 8.5, (x, y) => { const t = (y - 950) / 110; let c = pick(SNOW, .98 - t * .5 + rr(-.1, .1)); return css(rnd() < .22 ? mix(c, AUR[2], .35) : c, 4); }, 1, 3); yield;
  for (let u = 0; u < 1; u += .07) { const a = quad(roof, 1 - u, 1), b = quad(roof, 1 - u - .09, 1); mark('oil', a[0], a[1] + 1, b[0], b[1] + 1, rr(8, 12), css(pick(SNOW, rr(.55, .8)), 4), 1, rr(.05, .14)); }
  { const a = roof[3], b = roof[2]; mark('pencil', a[0] + 6, a[1] + 8, b[0], b[1] + 8, 3, css(C('#1a0c22'), 3), .9); }
  // the far roof plane, seen edge on, and the barge boards
  hatch([[778, 958], [856, 1046], [848, 1054], [770, 972]], .85, 5, 'oil', 6, () => css(pick(SNOW, rr(.5, .75)), 4), 1, 2);
  mark('oil', 772, 974, 700, 1058, 4.5, css(SNOW[5], 5), .95); mark('oil', 773, 975, 843, 1050, 4.5, css(SNOW[4], 5), .95);
  mark('oil', 700, 1056, 700, 1145, 4, css(SNOW[5], 5), .9); mark('oil', 840, 1046, 840, 1132, 3.6, css(SNOW[4], 5), .9);
  for (let i = 0; i < 15; i++) { const p = quad(roof, rr(.04, .98), 1); mark('pencil', p[0], p[1] + 6, p[0] + rr(-1, 1), p[1] + rr(12, 26), 1.8, css(SNOW[7], 3), rr(.6, .95)); }
  yield;
  // windows and the door: warm light, the one hot colour on the page
  const win = (Q, door) => {
    const cx = (Q[0][0] + Q[2][0]) / 2, cy = (Q[0][1] + Q[2][1]) / 2;
    glow(cx, cy, door ? 70 : 84, door ? 80 : 70, C('#ff9a3c'), .3);
    hatch(Q, Math.PI / 2, 4.5, 'oil', 5.5, (x, y) => css(pick(S('#fff2b4', '#ffe07a', '#ffc24e', '#f79a3c'), Math.abs(y - cy) / (Q[2][1] - Q[0][1]) * 1.5 + rr(-.1, .25)), 4), 1, 0);
    for (let i = 0; i < 4; i++) { const a = Q[i], b = Q[(i + 1) % 4]; mark('pencil', a[0], a[1], b[0], b[1], 2.6, css(door ? C('#5a2a22') : SNOW[6], 4), .95); }
    if (!door) { const a = quad(Q, .5, 0), b = quad(Q, .5, 1), c = quad(Q, 0, .5), d = quad(Q, 1, .5); mark('pencil', a[0], a[1], b[0], b[1], 2.4, css(C('#7a3a22'), 4), .95); mark('pencil', c[0], c[1], d[0], d[1], 2.4, css(C('#7a3a22'), 4), .95); }
  };
  win(sub(sideW, .2, .3, .42, .68)); win(sub(sideW, .58, .3, .8, .68)); yield;
  win(sub(gabW, .56, .3, .84, .62)); win(sub(gabW, .12, .34, .4, .99), true);
  { const Q = [[758, 1004], [782, 1003], [782, 1024], [758, 1025]]; hatch(Q, Math.PI / 2, 4, 'oil', 5, () => css(C('#ffd76a'), 5), 1, 0); }
  yield;
  // snow banked against the walls, and the light the door throws on it
  for (let i = 0; i < 16; i++) { const u = rnd(), p = quad(u < .6 ? sideW : gabW, rnd(), 1); mark('pastel', p[0] - rr(14, 30), p[1] + rr(-3, 5), p[0] + rr(14, 30), p[1] + rr(-1, 7), rr(7, 11), css(pick(SNOW, rr(.4, .8)), 5), .95, rr(-.1, .02)); }
  for (let i = 0; i < 26; i++) { const x = rr(710, 1010), y = 1150 + (x - 710) * .16 + rr(-8, 34), l = rr(24, 70); mark('pastel', x, y, x + l, y + l * .14, rr(5, 9), css(pick(S('#f29a80', '#f7c08c', '#ffd98a', '#fff0b8'), rnd() * Math.exp(-(x - 720) / 260) + .15), 5), rr(.45, .85)); }
  yield;
}

// ---------- run ----------
let gen = null, raf = 0, done = false;
function start() {
  cancelAnimationFrame(raf); rs = seed * 7919 + 1; done = false; count = 0;
  lctx.clearRect(0, 0, W, H); bx0 = by0 = 1e9; bx1 = by1 = -1e9;
  buildGrain();
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H);
  // the sheet itself: faint tooth and a few fibres
  const im = ctx.getImageData(0, 0, W, H), d = im.data;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const i = (y * W + x) * 4, v = (vnoise(x / 2.4, y / 2.4) - .5) * 14 + (hash(x, y) - .5) * 8 + (fbm(x / 300, y / 300, 2) - .5) * 10; d[i] += v; d[i + 1] += v; d[i + 2] += v * 1.3; }
  ctx.putImageData(im, 0, 0);
  gen = drawing(); raf = requestAnimationFrame(frame);
}
function frame() {
  const t0 = performance.now(), lim = THUMB ? 40 : 11; let c0 = count;
  while (true) {
    if (gen.next().done) { done = true; break; }
    if (!THUMB && count - c0 >= pace * SPEED) break;
    if (performance.now() - t0 > lim) break;
  }
  flush();
  if (!done) raf = requestAnimationFrame(frame);
}
addEventListener('click', () => { if (done) { seed++; start(); } else { // impatient: finish it now
  cancelAnimationFrame(raf); while (!gen.next().done) { if (count % 400 < 3) flush(); } flush(); done = true; } });
start();
</script>
