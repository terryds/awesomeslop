    const kind = rnd(), w = kind < 0.35 ? 1.3 + rnd() * 0.5 : 0.6 + rnd() * 0.3, h = kind < 0.35 ? 1.2 + rnd() * 0.5 : 0.6 + rnd() * 0.3;
    if (t + w / L > 0.95) break;
    const p = P(t + w / L / 2), pivot = new THREE.Group();
    pivot.position.copy(p); pivot.rotation.y = ang;
    const c = pick(CLOTH), parts2 = [];
    parts2.push(prep(new THREE.BoxGeometry(w, h, 0.02).translate(0, -h / 2, 0), c));
    if (kind > 0.35 && kind < 0.7) parts2.push(prep(new THREE.BoxGeometry(w * 1.7, h * 0.35, 0.02).translate(0, -h * 0.17, 0), c)); // a shirt
    if (kind > 0.85) for (let k = 0; k < 3; k++) parts2.push(prep(new THREE.BoxGeometry(w, 0.06, 0.025).translate(0, -h * (0.25 + k * 0.25), 0), '#7aa0cc')); // stripes

    mesh.castShadow = mesh.receiveShadow = true;
    pivot.add(mesh); scene.add(pivot);
    swings.push({ mesh, ph: rnd() * 6.28, amp: 0.12 + 0.18 / h });
    for (const s of [-0.4, 0.4]) add(new THREE.BoxGeometry(0.05, 0.12, 0.05), '#c8a978', at(p.x + Math.cos(ang) * s * w, p.y + 0.02, p.z - Math.sin(ang) * s * w));

}

const tail = charParts([[new THREE.CylinderGeometry(0.03, 0.04, 0.45, 5).translate(0, 0.22, 0), '#e9a25c']]);
tail.position.set(0, 0.2, -0.3); tail.rotation.x = -0.6;
cat.add(tail); cat.position.set(-3.5, 1.12, 20.3); cat.rotation.y = 0.4; scene.add(cat);
const jet = new THREE.Mesh(prep(new THREE.CylinderGeometry(0.05, 0.12, 0.7, 6, 1, true), '#cfe6ee'), townMat);
jet.position.set(0, 3.55, 2); scene.add(jet);

// ---------- renderer and the two passes ----------
const canvas = document.getElementById('c');
const small = innerWidth < 520;
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
let pixelRatio = Math.min(window.devicePixelRatio || 1, small ? 1 : 1.5);
renderer.setPixelRatio(pixelRatio);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
const camera = new THREE.PerspectiveCamera(55, 1, 0.2, 900);

// pass 1: the lit scene (with shadows) and its depth
const rtLit = new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType, depthTexture: new THREE.DepthTexture(4, 4) });
// pass 2: world normal in rgb, the luminance of the flat (unlit) colour in alpha; alpha 0 means sky
const rtInfo = new THREE.WebGLRenderTarget(4, 4, { type: THREE.HalfFloatType });
const infoMat = new THREE.ShaderMaterial({
  vertexColors: true, side: THREE.DoubleSide,
  vertexShader: `varying vec3 vN; varying vec3 vC;
    void main(){ vN = normalize(mat3(modelMatrix) * normal); vC = color; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
  fragmentShader: `varying vec3 vN; varying vec3 vC;
    void main(){ vec3 n = normalize(vN) * (gl_FrontFacing ? 1. : -1.); gl_FragColor = vec4(n * .5 + .5, max(dot(vC, vec3(.299, .587, .114)), .02)); }`,
});

// pass 3: coloured pencil on paper
const pencil = new THREE.ShaderMaterial({
  uniforms: {
    tLit: { value: rtLit.texture }, tInfo: { value: rtInfo.texture }, tDepth: { value: rtLit.depthTexture },
    uRes: { value: new THREE.Vector2(1, 1) }, uBoil: { value: 0 }, uTime: { value: 0 }, uScale: { value: 1 },
    uNear: { value: camera.near }, uFar: { value: camera.far }, uFull: { value: (HEMI + SUN) / Math.PI },
    uInvProj: { value: camera.projectionMatrixInverse }, uCamWorld: { value: camera.matrixWorld },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }`,
  fragmentShader: /* glsl */`
    precision highp float;
    uniform sampler2D tLit, tInfo, tDepth;
    uniform vec2 uRes; uniform float uBoil, uTime, uScale, uNear, uFar, uFull;
    uniform mat4 uInvProj, uCamWorld;
    varying vec2 vUv;
    const vec3 LUMA = vec3(.299, .587, .114);
    float h11(float p){ p = fract(p * .1031); p *= p + 33.33; p *= p + p; return fract(p); }
    float h21(vec2 p){ vec3 q = fract(vec3(p.xyx) * .1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
    float vn(vec2 p){ vec2 i = floor(p), f = fract(p), u = f * f * (3. - 2. * f);
      return mix(mix(h21(i), h21(i + vec2(1, 0)), u.x), mix(h21(i + vec2(0, 1)), h21(i + vec2(1, 1)), u.x), u.y); }
    float fbm(vec2 p){ float s = 0., a = .5; for (int i = 0; i < 4; i++){ s += a * vn(p); p = p * 2.03 + 17.1; a *= .5; } return s / .9375; }
    float linZ(float d){ float z = d * 2. - 1.; return 2. * uNear * uFar / (uFar + uNear - z * (uFar - uNear)); }

    // One layer of pencil strokes in screen space: rows of short tapered marks that
    // start and stop at random, each a little thicker or fainter than its neighbours.
    // Returns 0..1, 1 at the middle of a stroke.
    float strokes(vec2 p, float ang, float gap, float seed){
      float c = cos(ang), s = sin(ang);
      vec2 q = vec2(c * p.x + s * p.y, -s * p.x + c * p.y) / gap;
      float row = floor(q.y);
      float len = mix(6., 16., h11(row * 1.37 + seed));
      float sx = q.x / len + h11(row + seed * 3.1) * 9.;
      float seg = floor(sx), f = fract(sx);
      float h = h21(vec2(row + seed, seg));
      float y = fract(q.y) - .5 + (h - .5) * .5 + (f - .5) * (h11(seg * 7.3 + row) - .5) * .5;
      float w = mix(.22, .42, h);
      float taper = smoothstep(0., .14, f) * smoothstep(1., .78, f);
      return (1. - smoothstep(0., w, abs(y))) * taper * mix(.55, 1., h11(seg * 3.7 + row * .13 + seed));
    }
    // draw a stroke layer as tone d (0 none, 1 dense): thicker and longer marks as it darkens
    float layer(float v, float d){ return smoothstep(1. - d * 1.15, 1.18 - d * 1.15, v + .001); }

    void main(){
      vec2 fc = gl_FragCoord.xy;
      float S = uScale;
      // boiling: every quarter second the hand redraws, a little to one side
      vec2 jit = (vec2(h11(uBoil * 1.31 + .2), h11(uBoil * 2.71 + .5)) - .5) * 7. * S;
      float jang = (h11(uBoil * 5.1) - .5) * .09;
      vec2 p = fc + jit;
      vec2 wob = (vec2(vn(fc * .03 / S + uBoil * 3.1), vn(fc * .03 / S + 40. + uBoil * 1.7)) - .5) * 2.4 * S / uRes;
      vec2 uv = vUv + wob;

      vec4 inf = texture2D(tInfo, uv);
      float z = linZ(texture2D(tDepth, uv).r);
      bool sky = inf.a < .005;
      float grain = fbm(fc * .45 / S) * .65 + vn(fc * 1.6 / S) * .35;
      vec3 paper = vec3(.972, .956, .922) * (.98 + .02 * grain);
      vec3 col;
      vec3 lineCol = vec3(.33, .3, .35);
      float fog = 0.;

      if (sky) {
        vec4 v = uInvProj * vec4(vUv * 2. - 1., 1., 1.);
        vec3 dir = normalize((uCamWorld * vec4(v.xyz / v.w, 0.)).xyz);
        float el = dir.y;
        vec3 skyC = mix(vec3(.86, .9, .9), vec3(.55, .71, .87), smoothstep(-.02, .5, el));
        vec2 cuv = dir.xz / (max(el, .03) + .22);
        float cl = fbm(cuv * .9 + vec2(uTime * .006, 0.));
        float cm = smoothstep(.52, .66, cl);
        float sk = strokes(p, .16 + jang, 5.5 * S, 3.);
        col = mix(paper, skyC, (.5 + .4 * smoothstep(.05, .55, sk)) * (1. - cm * .92));
        float under = cm * smoothstep(.5, .35, fbm(cuv * .9 + vec2(uTime * .006, -.12)));
        col = mix(col, vec3(.72, .7, .82), under * smoothstep(.1, .6, strokes(p, .5 + jang, 4.5 * S, 9.)) * .55);
        fog = 1.;
      } else {
        vec3 lit = texture2D(tLit, uv).rgb;
        float aL = inf.a, lL = max(dot(lit, LUMA), 1e-4);
        vec3 alb = pow(clamp(lit * (aL / lL), 0., 1.), vec3(1. / 2.2));
        float s = (lL / aL) / uFull;
        vec3 n = inf.rgb * 2. - 1.;
        float g = dot(alb, LUMA);
        vec3 base = mix(vec3(g), alb, .82);
        base = mix(base, vec3(1.), .1);
        fog = smoothstep(45., 520., z);
        // stroke direction: chosen per facing, so each plane gets its own hatch angle
        vec3 qn = floor(n * 2.5 + .5);
        float ang = .5 + 1.9 * h21(qn.xz * 1.7 + qn.y * 3.1) + jang;
        float gap = 4.4 * S;
        float f0 = strokes(p, ang, gap, 1.);
        float fill = (.64 + .36 * smoothstep(.05, .5, f0)) * mix(.93, 1., grain);
        col = mix(paper, base, fill * (1. - fog * .35));
        // shadow becomes hatching: one layer, then crossed, then a third, darker hand
        float d = smoothstep(.9, .18, s) * (1. - fog * .7);
        vec3 hc = mix(base * base * .85, vec3(.36, .34, .52), .3);
        col = mix(col, hc, layer(strokes(p, ang + .1, gap * .95, 7.), d) * .8);
        col = mix(col, hc * .9, layer(strokes(p, ang + 1.2, gap * .9, 13.), d - .3) * .75);
        col = mix(col, vec3(.3, .28, .38), layer(strokes(p, ang - .75, gap * .85, 21.), d - .62) * .5);
        // a few loose strokes even in full light, so nothing looks printed
        col = mix(col, base * .85, layer(strokes(p, ang + .05, gap * 1.3, 31.), .25) * .16 * (1. - fog));
        col = mix(col, mix(paper, vec3(.8, .84, .9), .55), fog * .65);
        lineCol = mix(base * .38, vec3(.3, .27, .32), .45);
      }

      // outlines: where depth bends, normals turn, or the flat colour changes
      vec2 px = 1.15 * S / uRes;
      float zl = linZ(texture2D(tDepth, uv - vec2(px.x, 0)).r), zr = linZ(texture2D(tDepth, uv + vec2(px.x, 0)).r);
      float zd = linZ(texture2D(tDepth, uv - vec2(0, px.y)).r), zu = linZ(texture2D(tDepth, uv + vec2(0, px.y)).r);
      float de = max(abs(zl + zr - 2. * z), abs(zu + zd - 2. * z)) / z;
      float edge = smoothstep(.02, .07, de);
      if (!sky) {
        vec4 il = texture2D(tInfo, uv - vec2(px.x, 0)), ir = texture2D(tInfo, uv + vec2(px.x, 0));
        vec4 id = texture2D(tInfo, uv - vec2(0, px.y)), iu = texture2D(tInfo, uv + vec2(0, px.y));
        vec3 n = inf.rgb * 2. - 1.;
        float nd = min(min(dot(n, il.rgb * 2. - 1.), dot(n, ir.rgb * 2. - 1.)), min(dot(n, id.rgb * 2. - 1.), dot(n, iu.rgb * 2. - 1.)));
        edge = max(edge, smoothstep(.3, .6, 1. - nd));
        float ad = max(max(abs(inf.a - il.a), abs(inf.a - ir.a)), max(abs(inf.a - id.a), abs(inf.a - iu.a)));
        edge = max(edge, smoothstep(.07, .2, ad) * .55);
        edge *= mix(1., .42, smoothstep(.9, .98, n.y)); // paving joints a little lighter
      }
      float press = mix(.45, 1., vn(fc * .025 / S + uBoil * 5.3)) * mix(.9, 1., grain);
      edge *= press * (1. - smoothstep(60., 380., z) * .85);
      col = mix(col, lineCol, clamp(edge, 0., 1.) * .85);

      // the sheet: grain, a torn white border, a faint smudge just inside it
      col *= .985 + .015 * grain;
      float asp = uRes.x / uRes.y;
      vec2 bp = vUv * vec2(asp, 1.);
      float e = min(min(vUv.x, 1. - vUv.x) * asp, min(vUv.y, 1. - vUv.y));
      float tear = fbm(bp * 7.) * .045 + vn(bp * 46.) * .01 + vn(bp * 140.) * .004;
      float inside = smoothstep(.022 + tear, .028 + tear, e);
      col = mix(col, col * .9 + vec3(.06, .055, .07) * .3, (1. - smoothstep(.03 + tear, .09 + tear, e)) * .35);
      col = mix(vec3(.985, .978, .962) * (.985 + .015 * grain), col, inside);
      gl_FragColor = vec4(col, 1.);
    }`,
  depthTest: false, depthWrite: false,
});
const post = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), pencil);
post.frustumCulled = false;
const postScene = new THREE.Scene(); postScene.add(post);
const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

// ---------- walking ----------
const hud = document.getElementById('hud'), where = document.getElementById('where');
const P = { x: 2.5, z: 9.5, y: 0, vx: 0, vz: 0, vy: 0, face: Math.PI, grounded: true, phase: 0, speed: 0 };
let yaw = 0, pitch = -0.28, dist = 6, mode = 'intro', dragging = false, blend = 0;
const q = new URLSearchParams(location.search);
if (q.has('thumb')) hud.style.display = 'none'; // shown as a gallery preview: no instructions
if (q.get('walk') === '1') { mode = 'walk'; blend = 1; hud.classList.add('walking'); } // open straight over the shoulder
const keys = {};
const R = 0.3;

canvas.addEventListener('click', () => {
  if (mode === 'intro') { mode = 'walk'; hud.classList.add('walking'); }
  if (document.pointerLockElement !== canvas) { try { const p = canvas.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch {} }
});
const look = (dx, dy) => { yaw -= dx * 0.0025; pitch = clamp(pitch - dy * 0.0025, -1.1, 0.3); };
addEventListener('mousemove', (e) => { if (mode === 'walk' && (document.pointerLockElement === canvas || dragging)) look(e.movementX, e.movementY); });
canvas.addEventListener('pointerdown', () => (dragging = true));
addEventListener('pointerup', () => (dragging = false));
addEventListener('wheel', (e) => { dist = clamp(dist + Math.sign(e.deltaY) * 0.6, 3, 11); }, { passive: true });
let lastTouch = null;
canvas.addEventListener('touchmove', (e) => { const t = e.touches[0]; if (lastTouch && mode === 'walk') look((t.clientX - lastTouch.x) * 2, (t.clientY - lastTouch.y) * 2); lastTouch = { x: t.clientX, y: t.clientY }; e.preventDefault(); }, { passive: false });
canvas.addEventListener('touchend', () => (lastTouch = null));
addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code === 'Space' && mode === 'walk' && P.grounded) { P.vy = 7.4; P.grounded = false; }
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', (e) => (keys[e.code] = false));
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

const inBounds = (x, z) => x > -23.4 && x < 23.4 && z > -39.4 && z < 19.7;
function tryMove(dx, dz) {
  const nx = P.x + dx, nz = P.z + dz;
  if (!inBounds(nx, nz) || heightAt(nx, nz, R) > P.y + 0.45) return false;
  P.x = nx; P.z = nz; return true;
}
function walk(dt) {
  let f = 0, r = 0;
  if (mode === 'walk') {
    f = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
    r = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  }
  const run = keys.ShiftLeft || keys.ShiftRight;
  let tx = 0, tz = 0;
  if (f || r) {
    const sp = (run ? 6.6 : 3.1) / Math.hypot(f, r);
    tx = (-Math.sin(yaw) * f + Math.cos(yaw) * r) * sp;
    tz = (-Math.cos(yaw) * f - Math.sin(yaw) * r) * sp;
  }
  const k = 1 - Math.exp(-dt * (P.grounded ? 12 : 3));
  P.vx = lerp(P.vx, tx, k); P.vz = lerp(P.vz, tz, k);
  if (!tryMove(P.vx * dt, 0)) P.vx = 0;
  if (!tryMove(0, P.vz * dt)) P.vz = 0;
  const g = heightAt(P.x, P.z, 0.12);
  if (P.grounded && P.vy <= 0 && P.y - g < 0.45) P.y = lerp(P.y, g, 1 - Math.exp(-dt * 25));
  else { P.vy -= 22 * dt; P.y += P.vy * dt; P.grounded = false; if (P.y <= g) { P.y = g; P.vy = 0; P.grounded = true; } }
  P.speed = Math.hypot(P.vx, P.vz);
  if (P.speed > 0.2) { const want = Math.atan2(P.vx, P.vz); let d = want - P.face; d = Math.atan2(Math.sin(d), Math.cos(d)); P.face += d * (1 - Math.exp(-dt * 12)); }
  // pose
  P.phase += dt * P.speed * 2.6;
  const amt = clamp(P.speed / 3, 0, 1.25), sw = Math.sin(P.phase) * 0.7 * amt;
  hero.position.set(P.x, P.y, P.z); hero.rotation.y = P.face;
  if (!P.grounded) { legs[0].rotation.x = -0.6; legs[1].rotation.x = 0.3; arms[0].rotation.x = -1.2; arms[1].rotation.x = -1.0; body.position.y = 0; }
  else {
    legs[0].rotation.x = sw; legs[1].rotation.x = -sw; arms[0].rotation.x = -sw * 0.9; arms[1].rotation.x = sw * 0.9;
    body.position.y = Math.abs(Math.cos(P.phase)) * 0.06 * amt + (amt < 0.1 ? Math.sin(performance.now() / 600) * 0.01 : 0);
  }
  body.rotation.x = amt * 0.08;
}

// the camera: a slow drift around the square before the first click, then over the shoulder
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3(), tmp = new THREE.Vector3();
function introCam(t, outPos, outLook) {
  const a = Math.sin(t * 0.05) * 0.75 + 0.15;
  outPos.set(Math.sin(a) * 18, 7.2 + Math.sin(t * 0.09) * 0.8, -1 + Math.cos(a) * 19);
  outLook.set(Math.sin(a) * 4, 3.4, -10);
}
function followCam(outPos, outLook) {
  outLook.set(P.x, P.y + 1.45, P.z);
  const dx = Math.sin(yaw) * Math.cos(pitch), dy = -Math.sin(pitch), dz = Math.cos(yaw) * Math.cos(pitch);
  let d = dist;
  for (let i = 1; i <= 14; i++) { // pull in if a wall is in the way
    const s = (dist * i) / 14;
    if (heightAt(outLook.x + dx * s, outLook.z + dz * s, 0.25) > outLook.y + dy * s - 0.3) { d = Math.max(0.8, s - 0.5); break; }
  }
  outPos.set(outLook.x + dx * d, outLook.y + dy * d, outLook.z + dz * d);
}

function zone() {
  const { x, z } = P;
  if (Math.abs(x) > 16.2) return 'monteviola, a washing lane';
  if (z > 15) return 'monteviola, the lookout';
  if (z > -7) return 'monteviola, the fountain square';
  if (z > -14) return 'monteviola, the long steps';
  if (z > -27) return 'monteviola, the upper walk';
  return 'monteviola, the chapel terrace';
}

// ---------- loop ----------
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  const w = Math.max(1, Math.floor(innerWidth * pixelRatio)), h = Math.max(1, Math.floor(innerHeight * pixelRatio));
  rtLit.setSize(w, h); rtInfo.setSize(w, h);
  pencil.uniforms.uRes.value.set(w, h);
  pencil.uniforms.uScale.value = Math.max(0.6, h / 820);
  camera.aspect = innerWidth / Math.max(innerHeight, 1);
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

const clock = new THREE.Clock();
let slow = 0, frames = 0, lastZone = '';
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  walk(dt);
  if (mode === 'walk') blend = Math.min(1, blend + dt * 0.8);
  introCam(t, camPos, camLook);
  if (blend > 0) {
    followCam(tmp, camera.position);
    const b = smooth(0, 1, blend);
    camPos.lerp(tmp, b); camLook.lerp(camera.position, b);
  }
  camera.position.copy(camPos); camera.lookAt(camLook); camera.updateMatrixWorld();

  for (const s of swings) s.mesh.rotation.x = Math.sin(t * 1.9 + s.ph) * s.amp + Math.sin(t * 0.63 + s.ph * 2) * 0.12 + 0.12;
  jet.scale.y = 1 + Math.sin(t * 9) * 0.06;
  tail.rotation.z = Math.sin(t * 1.3) * 0.5;
  for (const b of birds) {
    const dx = b.x - P.x, dz = b.z - 2 - (P.z - 2), near = Math.hypot(b.x - P.x, b.z - P.z);
    if (b.fly <= 0 && near < 2.2 && P.speed > 0.5) { // startled: hop away over the fountain
      const a = Math.atan2(dz, dx) + (rnd() - 0.5), r = 3.5 + rnd() * 2.5;
      b.fx = b.x; b.fz = b.z; b.tx = clamp(Math.cos(a) * r, -14, 14); b.tz = clamp(2 + Math.sin(a) * r, -6, 18); b.fly = 1;
      b.ry = Math.atan2(b.tx - b.x, b.tz - b.z);
    }
    if (b.fly > 0) {
      b.fly = Math.max(0, b.fly - dt * 0.8); const k = 1 - b.fly;
      b.x = lerp(b.fx, b.tx, k); b.z = lerp(b.fz, b.tz, k); b.y = Math.sin(k * Math.PI) * 2.2;
      if (Math.hypot(b.x, b.z - 2) < 2.9) b.y = Math.max(b.y, 0.72);
    } else b.y = Math.hypot(b.x, b.z - 2) < 2.9 ? 0.72 : 0;
    b.g.position.set(b.x, b.y, b.z); b.g.rotation.y = b.ry;
    b.head.position.y = 0.12 - Math.max(0, Math.sin(t * 2.3 + b.ph)) * 0.08;
  }

  const zn = zone();
  if (zn !== lastZone && mode === 'walk') { lastZone = zn; where.style.opacity = 0; setTimeout(() => { where.textContent = zn; where.style.opacity = 1; }, 800); }

  pencil.uniforms.uBoil.value = Math.floor(t * 4);
  pencil.uniforms.uTime.value = t;

  renderer.shadowMap.needsUpdate = true;
  renderer.setRenderTarget(rtLit); renderer.setClearColor(0xffffff, 1); renderer.clear(); renderer.render(scene, camera);
  scene.overrideMaterial = infoMat;
  renderer.setRenderTarget(rtInfo); renderer.setClearColor(0x000000, 0); renderer.clear(); renderer.render(scene, camera);
  scene.overrideMaterial = null;
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);

  // drop resolution a step if this machine cannot hold a smooth frame
  slow = lerp(slow, dt, 0.05);
  if (++frames % 90 === 0 && slow > 0.024 && pixelRatio > 0.7) { pixelRatio *= 0.85; renderer.setPixelRatio(pixelRatio); resize(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
