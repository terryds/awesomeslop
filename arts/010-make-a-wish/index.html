<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>make a wish</title>
<style>
  html,body{margin:0;height:100%;background:#0c0a14;overflow:hidden}
  canvas{display:block;width:100%;height:100%;object-fit:contain;cursor:pointer}
  .thumb canvas{object-fit:cover}
  .thumb #ui{display:none}
  #ui{position:fixed;inset:0;pointer-events:none;color:#f4e2c4;font:italic 17px Georgia,"Times New Roman",serif;text-shadow:0 1px 8px rgba(8,4,16,.9)}
  #hint{position:absolute;left:0;right:0;bottom:13%;text-align:center;opacity:0;transition:opacity .8s;letter-spacing:.02em}
  #hint.on{opacity:.9}
  #bar{position:absolute;left:14px;bottom:12px;display:flex;gap:14px;align-items:flex-end;pointer-events:auto;font-size:16px}
  #bar button,#panel button{font:inherit;color:inherit;background:none;border:0;padding:2px 0;cursor:pointer;opacity:.8;border-bottom:1px solid rgba(244,226,196,.35)}
  #bar button:hover,#panel button:hover{opacity:1}
  #panel{position:absolute;left:14px;bottom:44px;pointer-events:auto;background:rgba(22,16,34,.92);border:1px solid rgba(244,226,196,.25);padding:14px 16px;display:none;font-size:14px;width:230px}
  #panel.on{display:block}
  #panel label{display:block;margin-bottom:10px;opacity:.85}
  #panel input{display:block;width:100%;box-sizing:border-box;margin-top:4px;font:16px Georgia,serif;color:#fff4dc;background:rgba(255,255,255,.06);border:1px solid rgba(244,226,196,.3);padding:6px 8px;outline:none}
  #panel input:focus{border-color:#f4e2c4}
  #panel .row{display:flex;gap:16px;margin-top:4px}
  #said{position:absolute;left:14px;bottom:44px;pointer-events:none;background:rgba(22,16,34,.92);border:1px solid rgba(244,226,196,.25);padding:8px 12px;font-size:15px;opacity:0;transition:opacity .4s;z-index:2}
  #said.on{opacity:1}
  #out{position:absolute;left:14px;bottom:86px;width:min(420px,calc(100% - 28px));box-sizing:border-box;pointer-events:auto;font:14px ui-monospace,Menlo,monospace;color:#fff4dc;background:rgba(22,16,34,.96);border:1px solid #f4e2c4;padding:6px 8px;display:none;z-index:2}
  #out.on{display:block}
  @media (max-height:340px){#ui{display:none}}
</style>
<canvas id="c"></canvas>
<div id="ui">
  <div id="hint"></div>
  <div id="panel">
    <label>who is it for?<input id="fname" maxlength="24" autocomplete="off" placeholder="a name"></label>
    <label>how old? (candles)<input id="fage" inputmode="numeric" maxlength="3" autocomplete="off" placeholder="leave empty for five"></label>
    <div class="row"><button id="show">show it</button><button id="copy">share it</button></div>
  </div>
  <div id="bar"><button id="make">make one for someone</button><button id="share">share this card</button><button id="snd">sound: on</button></div>
  <div id="said"></div><input id="out" readonly aria-label="link to this card">
</div>
<script>
// make a wish: a birthday cake in a dark room, drawn stroke by stroke in dry media, with candles
// you can light and blow out. ?name=Ada sets who it is for, ?age=7 the candles. Canvas 2D + WebAudio.
const q = new URLSearchParams(location.search);
const THUMB = q.has('thumb');
if (THUMB) document.documentElement.classList.add('thumb');
const SPEED = Math.max(.1, +(q.get('speed') || 3));
const NAME = (q.get('name') || '').replace(/\s+/g, ' ').trim().slice(0, 24);
const AGE = clampi(parseInt(q.get('age'), 10), 0, 150);
function clampi(v, a, b) { return isNaN(v) ? 0 : Math.max(a, Math.min(b, v)); }
const W = 2400, H = 1350;
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const view = cv.getContext('2d');
const mkc = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
const paper = mkc(), pctx = paper.getContext('2d');   // the drawing itself, built once
const layer = mkc(), lctx = layer.getContext('2d');   // scratch: one batch of strokes before the tooth is applied
const fx = mkc(), fctx = fx.getContext('2d');         // what moves: flames, smoke, snow, steam. Redrawn 12 times a second
let tgt = pctx;

let seed = +(q.get('seed') || 3), rs = 1;
const rnd = () => { rs = (rs + 0x6D2B79F5) | 0; let t = Math.imul(rs ^ (rs >>> 15), 1 | rs); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const rr = (a, b) => a + (b - a) * rnd();
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function hash(i, j) { let n = Math.imul(i, 374761393) + Math.imul(j, 668265263) + Math.imul(seed, 1442695041); n = Math.imul(n ^ (n >>> 13), 1274126177); return ((n ^ (n >>> 16)) >>> 0) / 4294967296; }
function vnoise(x, y) { const xi = Math.floor(x), yi = Math.floor(y); let fx = x - xi, fy = y - yi; fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy); return lerp(lerp(hash(xi, yi), hash(xi + 1, yi), fx), lerp(hash(xi, yi + 1), hash(xi + 1, yi + 1), fx), fy); }
function fbm(x, y, o = 3) { let a = .5, s = 0, n = 0; for (let i = 0; i < o; i++) { s += a * vnoise(x, y); n += a; x = x * 2.03 + 17.1; y = y * 2.03 + 9.7; a *= .5; } return s / n; }

// ---------- colour: a small box of sticks ----------
const C = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const S = (...hs) => hs.map(C);
function css(c, j = 6) { const l = (rnd() - .5) * 2 * j; return `rgb(${clamp(c[0] + l + (rnd() - .5) * j, 0, 255) | 0},${clamp(c[1] + l + (rnd() - .5) * j, 0, 255) | 0},${clamp(c[2] + l + (rnd() - .5) * j, 0, 255) | 0})`; }
function pick(stops, t) { t = clamp(t, 0, .9999) * (stops.length - 1); const i = t | 0; return stops[rnd() < t - i ? i + 1 : i]; }
const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const PAPER = '#191526', INK = C('#120e1e');
const WALL = S('#16132a', '#1e1936', '#2a2044', '#382850', '#4a3058', '#623a5c', '#7e4c5c', '#9a625a');
const WOOD = S('#22161e', '#342026', '#4c2c2c', '#6a3e32', '#8a543a', '#aa7048', '#c89058');
const CREAM = S('#7a5c70', '#a88488', '#d4b09c', '#eed4b4', '#fbeacc', '#fff6e0');
const ROSE = S('#6e2844', '#9a3a56', '#c85670', '#e88094', '#f8b4bc');
const CHOC = S('#241018', '#3a1a20', '#54282a', '#723a30', '#96543c');
const NIGHT = S('#0c1230', '#131d52', '#1d3080', '#2c4ea2', '#4470b8');
const TEAL = S('#0e2e38', '#16484e', '#206a6a', '#3a9088', '#6cbca6');
const FLAGS = S('#d0607a', '#d8a23a', '#3a9088', '#f0dcb8', '#9a84c8');

// ---------- paper tooth and tools ----------
const G = 512, masks = {};
function buildGrain() {
  const h = new Float32Array(G * G);
  const tn = (x, y, p) => { const xi = Math.floor(x), yi = Math.floor(y); let fx = x - xi, fy = y - yi; fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy); const w = (a, b) => hash(((a % p) + p) % p + 911, ((b % p) + p) % p + 77 * p); return lerp(lerp(w(xi, yi), w(xi + 1, yi), fx), lerp(w(xi, yi + 1), w(xi + 1, yi + 1), fx), fy); };
  for (let y = 0; y < G; y++) for (let x = 0; x < G; x++)
    h[y * G + x] = .46 * tn(x / 1.7, y / 1.7, 301) + .2 * tn(x / 4.4, y / 3.6, 113) + .1 * tn(x / 22, y / 2.6, 23) + .24 * hash(x + 3, y + 5);
  const sorted = Float32Array.from(h).sort();
  const mk = (cover, soft) => {
    const thr = sorted[((1 - cover) * (G * G - 1)) | 0];
    const c = document.createElement('canvas'); c.width = c.height = G; const x = c.getContext('2d');
    const im = x.createImageData(G, G);
    for (let i = 0; i < G * G; i++) im.data[i * 4 + 3] = 255 * clamp((thr - h[i]) / soft + .5, 0, 1);
    x.putImageData(im, 0, 0); return lctx.createPattern(c, 'repeat');
  };
  masks.pastel = mk(.83, .22); masks.oil = mk(.95, .2); masks.pencil = mk(.86, .16); masks.chalk = mk(.9, .12); masks.smudge = mk(.97, .06); masks.flame = masks.oil;
}
const TOOLS = { pastel: { wob: .9, rag: .22, taper: .18 }, oil: { wob: .6, rag: .14, taper: .3 }, pencil: { wob: .45, rag: .25, taper: .7 }, chalk: { wob: .3, rag: .3, taper: .5 }, smudge: { wob: 0, rag: 0, taper: 0 }, flame: { wob: .5, rag: .1, taper: .95 } };
let cur = 'pastel', bx0 = 1e9, by0 = 1e9, bx1 = -1e9, by1 = -1e9, count = 0;
function grow(x, y, p) { if (x - p < bx0) bx0 = x - p; if (y - p < by0) by0 = y - p; if (x + p > bx1) bx1 = x + p; if (y + p > by1) by1 = y + p; }
function flush() {
  if (bx1 < bx0) return;
  const x = Math.max(0, Math.floor(bx0)), y = Math.max(0, Math.floor(by0)), w = Math.min(W, Math.ceil(bx1)) - x, h = Math.min(H, Math.ceil(by1)) - y;
  if (w > 0 && h > 0) {
    lctx.globalAlpha = 1; lctx.globalCompositeOperation = 'destination-out'; lctx.fillStyle = masks[cur]; lctx.fillRect(x, y, w, h);
    lctx.globalCompositeOperation = 'source-over';
    tgt.drawImage(layer, x, y, w, h, x, y, w, h); lctx.clearRect(x, y, w, h);
  }
  bx0 = by0 = 1e9; bx1 = by1 = -1e9;
}
function use(tool) { if (tool !== cur) { flush(); cur = tool; } }
function mark(tool, x0, y0, x1, y1, w, col, a = 1, bow = 0) {
  use(tool); count++;
  const T = TOOLS[tool], dx = x1 - x0, dy = y1 - y0, len = Math.hypot(dx, dy) || 1, nx = -dy / len, ny = dx / len;
  const n = clamp((len / 11 | 0) + 2, 3, 26), amp = T.wob * Math.sqrt(len / n) * .55;
  const L = [], R = []; let wob = 0;
  for (let i = 0; i <= n; i++) {
    const t = i / n; wob = wob * .8 + (rnd() - .5) * amp;
    const off = bow * len * Math.sin(Math.PI * t) + wob, px = x0 + dx * t + nx * off, py = y0 + dy * t + ny * off;
    const ww = .5 * w * Math.pow(Math.sin(Math.PI * (.06 + .88 * t)), T.taper) * (1 + (rnd() - .5) * T.rag);
    L.push(px + nx * ww, py + ny * ww); R.push(px - nx * ww, py - ny * ww);
  }
  lctx.globalAlpha = a; lctx.fillStyle = col; lctx.beginPath(); lctx.moveTo(L[0], L[1]);
  for (let i = 2; i < L.length; i += 2) lctx.lineTo(L[i], L[i + 1]);
  for (let i = R.length - 2; i >= 0; i -= 2) lctx.lineTo(R[i], R[i + 1]);
  lctx.closePath(); lctx.fill();
  const pad = w + Math.abs(bow) * len + 6; grow(x0, y0, pad); grow(x1, y1, pad);
}
function dot(tool, x, y, r, col, a = 1) { use(tool); count++; lctx.globalAlpha = a; lctx.fillStyle = col; lctx.beginPath(); lctx.ellipse(x, y, r * rr(.85, 1.15), r * rr(.85, 1.15), rnd() * 3, 0, 7); lctx.fill(); grow(x, y, r + 3); }
function glow(x, y, rx, ry, c, a) {
  use('smudge'); count += 3;
  lctx.save(); lctx.translate(x, y); lctx.scale(1, ry / rx); lctx.globalAlpha = 1;
  const g = lctx.createRadialGradient(0, 0, 0, 0, 0, rx), k = `${c[0] | 0},${c[1] | 0},${c[2] | 0}`;
  g.addColorStop(0, `rgba(${k},${a})`); g.addColorStop(.5, `rgba(${k},${a * .45})`); g.addColorStop(1, `rgba(${k},0)`);
  lctx.fillStyle = g; lctx.fillRect(-rx, -rx, 2 * rx, 2 * rx); lctx.restore(); grow(x, y, Math.max(rx, ry) + 2);
}
function hatch(poly, ang, gap, tool, w, colFn, a = 1, over = 3) {
  const c = Math.cos(ang), s = Math.sin(ang), P = poly.map(p => [p[0] * c + p[1] * s, -p[0] * s + p[1] * c]);
  let y0 = 1e9, y1 = -1e9; for (const p of P) { y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); }
  for (let y = y0 + gap * .4; y < y1; y += gap * rr(.8, 1.2)) {
    const xs = [];
    for (let i = 0; i < P.length; i++) { const A = P[i], B = P[(i + 1) % P.length]; if ((A[1] <= y) !== (B[1] <= y)) xs.push(A[0] + (y - A[1]) / (B[1] - A[1]) * (B[0] - A[0])); }
    xs.sort((p, q) => p - q);
    for (let k = 0; k + 1 < xs.length; k += 2) {
      const a0 = xs[k] - rr(-1, over), a1 = xs[k + 1] + rr(-1, over), m = (a0 + a1) / 2;
      mark(tool, a0 * c - y * s, a0 * s + y * c, a1 * c - y * s, a1 * s + y * c, w * rr(.85, 1.2), colFn(m * c - y * s, m * s + y * c), a, rr(-.015, .015));
    }
  }
}
const quad = (Q, u, v) => { const t = [lerp(Q[0][0], Q[1][0], u), lerp(Q[0][1], Q[1][1], u)], b = [lerp(Q[3][0], Q[2][0], u), lerp(Q[3][1], Q[2][1], u)]; return [lerp(t[0], b[0], v), lerp(t[1], b[1], v)]; };
const sub = (Q, u0, v0, u1, v1) => [quad(Q, u0, v0), quad(Q, u1, v0), quad(Q, u1, v1), quad(Q, u0, v1)];
const ell = (cx, cy, rx, ry, a0 = 0, a1 = Math.PI * 2, n = 36) => { const o = []; for (let i = 0; i <= n; i++) { const a = lerp(a0, a1, i / n); o.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); } return o; };

// ---------- the room ----------
const CX = 1300, TOP = 885, BOT = 1112, RX = 268, RY = 52;         // the cake: a cylinder
const WIN = { x0: 170, y0: 190, x1: 630, y1: 700, mx: 400, my: 445 };
const edge = x => 1012 + 34 * Math.pow((x - 1200) / 1200, 2);        // back edge of a round table
const stringY = x => 62 + 96 * Math.sin(Math.PI * clamp(x / W, 0, 1)); // the bunting sags
const light = (x, y) => Math.exp(-(Math.pow(x - CX, 2) + Math.pow((y - 760) * 1.15, 2)) / (760 * 760));
const BULBS = []; for (let x = 96; x < W; x += 172) BULBS.push([x, stringY(x) + 12]);
// candles: one per year up to ten, then number candles
const FLAMES = [];
const DIGITS = {
  0: [[.33, 0], [.1, .2], [.06, .7], [.33, 1], [.58, .78], [.6, .25], [.33, 0]], 1: [[.16, .26], [.4, 0], [.4, 1]],
  2: [[.06, .24], [.3, 0], [.6, .2], [.5, .5], [.02, 1], [.64, 1]], 3: [[.06, .1], [.4, 0], [.6, .22], [.3, .48], [.62, .72], [.38, 1], [.03, .88]],
  4: [[.5, 1], [.5, 0], [.02, .68], [.66, .68]], 5: [[.6, 0], [.14, 0], [.08, .45], [.4, .4], [.63, .68], [.38, 1], [.04, .9]],
  6: [[.54, .04], [.24, .22], [.06, .64], [.3, 1], [.6, .76], [.4, .5], [.1, .62]], 7: [[.04, 0], [.62, 0], [.26, 1]],
  8: [[.33, .48], [.1, .24], [.33, 0], [.56, .24], [.33, .48], [.04, .76], [.33, 1], [.62, .76], [.33, .48]], 9: [[.56, .4], [.3, .52], [.06, .26], [.33, 0], [.58, .26], [.5, .76], [.2, 1]],
};

let pace = 20;
function* drawing() {
  // 1. the wall: dark plum, warmer where the candles will reach it
  pace = 26;
  const inWin = (x, y) => x > WIN.x0 - 6 && x < WIN.x1 + 6 && y > WIN.y0 - 6 && y < WIN.y1 + 6;
  const wallCol = (x, y) => pick(WALL, light(x, y) * .92 + (fbm(x / 380, y / 300) - .5) * .24 - .1 * sstep(900, 0, y) * (1 - light(x, y)));
  for (let y = -30; y < 1070; y += 17) {
    for (let x = -60 + rr(0, 20); x < W + 60; x += rr(20, 30)) {
      const yy = y + rr(-9, 9), ang = -.62 + rr(-.16, .16), len = rr(80, 160);
      if (inWin(x + 40, yy - 30)) continue;
      mark('pastel', x, yy, x + Math.cos(ang) * len, yy + Math.sin(ang) * len, rr(13, 23), css(wallCol(x, yy), 5), rr(.65, .95), rr(-.03, .03));
    }
    yield;
  }
  pace = 14;
  for (let y = -20; y < 1040; y += 30) {
    for (let x = -40; x < W + 40; x += rr(50, 90)) {
      const yy = y + rr(-14, 14), ang = -1.0 + rr(-.2, .2), len = rr(60, 120);
      if (inWin(x + 20, yy - 40)) continue;
      mark('pencil', x, yy, x + Math.cos(ang) * len, yy + Math.sin(ang) * len, rr(2.2, 3.8), css(wallCol(x + 80, yy - 60), 9), rr(.3, .55));
    }
    yield;
  }

  // 2. the window: night, a moon, snow on the sill outside, a cat asleep inside
  pace = 12;
  hatch([[WIN.x0, WIN.y0], [WIN.x1, WIN.y0], [WIN.x1, WIN.y1], [WIN.x0, WIN.y1]], -.5, 12, 'pastel', 15, (x, y) => css(pick(NIGHT, .1 + (y - WIN.y0) / 510 * .75 + rr(-.1, .1)), 5), .95, 2); yield;
  for (let i = 0; i < 46; i++) dot('chalk', rr(WIN.x0 + 12, WIN.x1 - 12), WIN.y0 + Math.pow(rnd(), 1.4) * 380, rr(.9, 2.2), '#eef2ff', rr(.5, 1));
  glow(506, 292, 110, 110, C('#cfd6ff'), .22);
  dot('oil', 506, 292, 34, '#fff2c8', 1); dot('oil', 521, 283, 29, css(NIGHT[1], 3), 1); yield;
  for (let x = WIN.x0; x < WIN.x1; x += rr(26, 44)) mark('oil', x, WIN.y1 - rr(6, 20), x + rr(40, 70), WIN.y1 - rr(4, 18), rr(10, 16), css(pick(S('#8a9cde', '#afc4ee', '#e4eefa'), rnd()), 4), 1, rr(-.12, .02));
  const fr = C('#6a5a86'), frL = C('#a892b4');
  for (const [a, b, c, d, w] of [[WIN.x0, WIN.y0, WIN.x1, WIN.y0, 18], [WIN.x0, WIN.y1, WIN.x1, WIN.y1, 18], [WIN.x0, WIN.y0, WIN.x0, WIN.y1, 18], [WIN.x1, WIN.y0, WIN.x1, WIN.y1, 18], [WIN.mx, WIN.y0, WIN.mx, WIN.y1, 11], [WIN.x0, WIN.my, WIN.x1, WIN.my, 11]]) {
    for (let k = 0; k < 2; k++) mark('oil', a + rr(-2, 2), b + rr(-2, 2), c + rr(-2, 2), d + rr(-2, 2), w, css(fr, 6), .95);
    mark('pencil', a + 4, b + 4, c + 4, d + 4, 2.6, css(frL, 6), .7);
  }
  for (let k = 0; k < 3; k++) mark('oil', WIN.x0 - 34, WIN.y1 + 22 + k * 5, WIN.x1 + 34, WIN.y1 + 22 + k * 5, 12, css(mix(fr, frL, k / 3), 6), 1);
  yield;
  // the cat
  hatch(ell(540, 676, 70, 34), .1, 6, 'oil', 8, () => css(INK, 4), 1, 2);
  hatch(ell(602, 652, 26, 23), .1, 5, 'oil', 7, () => css(INK, 4), 1, 1);
  mark('oil', 586, 640, 590, 616, 12, css(INK, 3), 1); mark('oil', 612, 636, 620, 614, 12, css(INK, 3), 1);
  mark('oil', 478, 690, 462, 770, 11, css(INK, 3), 1, .16);
  for (const p of ell(540, 676, 70, 34, Math.PI * 1.08, Math.PI * 1.8, 9)) mark('pencil', p[0], p[1], p[0] + rr(10, 18), p[1] + rr(-3, 2), 2.2, css(C('#7c6ca8'), 6), rr(.5, .9));
  for (const p of ell(602, 652, 26, 23, Math.PI * 1.1, Math.PI * 1.9, 5)) mark('pencil', p[0], p[1], p[0] + rr(6, 10), p[1] + rr(-2, 2), 2, css(C('#7c6ca8'), 6), rr(.5, .9));
  yield;

  // 3. bunting and a string of small lights across the top of the room
  pace = 10;
  for (let x = -30; x < W + 30; x += 46) mark('pencil', x, stringY(x), x + 48, stringY(x + 48), 2.4, css(C('#8a7a90'), 8), .9);
  let fi = 0;
  for (let x = 10; x < W - 40; x += 172, fi++) {
    const y = stringY(x + 35), tilt = (stringY(x + 70) - stringY(x)) / 70, k = .35 + .65 * light(x, y + 200);
    const col = mix(C('#17122a'), FLAGS[fi % 5], k);
    hatch([[x, stringY(x) + 2], [x + 72, stringY(x + 72) + 2], [x + 36 + tilt * 30, y + 92]], Math.PI / 2 + tilt * .4, 7, 'pastel', 9, () => css(col, 7), .95, 1);
    mark('pencil', x, stringY(x) + 3, x + 72, stringY(x + 72) + 3, 2.4, css(mix(col, C('#fff4dc'), .35), 5), .8);
